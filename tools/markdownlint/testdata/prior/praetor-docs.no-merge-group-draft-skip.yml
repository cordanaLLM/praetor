---
name: Praetor Documentation Governance

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Governance gate
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/markdownlint/package-lock.json
      - name: Verify public Markdown
        run: node tools/markdownlint/verify.mjs
      - name: Verify figures
        run: |
          node tools/figures/build.mjs check
          node tools/figures/build.mjs sources
  documentation-result:
    name: Documentation Governance
    needs: [documentation]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # yamllint disable rule:line-length
      - name: Report the draft
        if: needs.documentation.result == 'skipped'
        run: |
          echo "::error title=Gate not run on a draft::The gate did not run because the pull request is a draft. It runs when the pull request is marked ready for review."
          exit 1
      # yamllint enable rule:line-length
      - name: Fail unless the gate passed
        if: needs.documentation.result != 'success'
        run: |
          echo "The gate did not pass or was skipped on a draft."
          exit 1
