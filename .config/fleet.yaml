# cordanaLLM Fleet-Wide Infrastructure Policy & Runner Matrix
runners:
  default: "arc-runner-set-linux-amd64"
  routing:
    darwin/arm64:
      type: "github-hosted"
      runs_on:
        - "macos-14"
      ephemeral: true
    darwin/amd64:
      type: "github-hosted"
      runs_on:
        - "macos-13"
      ephemeral: true
    linux/amd64:
      type: "self-hosted-arc"
      runs_on:
        - "arc-runner-set-linux-amd64"
      ephemeral: true
    linux/arm64:
      type: "self-hosted-arc"
      runs_on:
        - "arc-runner-set-linux-arm64"
      ephemeral: true
    linux/gpu:
      type: "self-hosted-arc"
      runs_on:
        - "arc-runner-set-gpu-xpu"
      ephemeral: true
