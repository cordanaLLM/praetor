# Global Version Flavors and Track Definitions
#
# update_frequency: on_push, on_release and on_patch are followed by every sync;
# manual holds the tag until 'praetorctl flavors sync --flavor=<name>' names it.
# stability is a free-form label reported on every plan line; it moves and holds no tag.
# Each flavor's moving tag is named after the flavor; version tags (v*) are cut by hand.
# See docs/guides/releasing.md.
version: 1
flavors:
  bleeding:
    description: "Continuous development builds tracking main branch commits"
    source_ref: "refs/heads/main"
    update_frequency: "on_push"
    stability: "experimental"

  edge:
    description: "Release candidates undergoing integration and canary validation"
    source_ref: "refs/heads/main"
    update_frequency: "manual"
    stability: "pre-release"

  latest:
    description: "Highest validated stable semantic release"
    source_ref: "refs/tags/v*"
    update_frequency: "on_release"
    stability: "stable"

  lts:
    description: "Long-Term Support release channel receiving security and invariant patches"
    source_ref: "refs/heads/lts-*"
    update_frequency: "on_patch"
    stability: "enterprise-stable"
