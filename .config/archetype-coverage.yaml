---
# Declarative coverage of the archetype catalog schema (#353).
#
# Every key a profile or facet in .config/archetypes may declare is bound here to the
# functions that read its value, or marked unconsumed with the reason. The effective-policy
# digest records every key; recording a value is not acting on it, and a key nothing reads
# advertises enforcement the engine does not have.
#
# internal/archetypecoverage type-checks the engine's Go source and replays this file in
# both directions (TestShippedManifestMatchesTheSource, run by go test and verify-all):
#   - a key config.ArchetypeKeys decodes without an entry fails, and so does an entry for a
#     key the schema does not decode;
#   - a listed consumer that no longer reads the key's Go fields fails;
#   - a function that starts reading them fails until it is listed, so an unconsumed key
#     that gains a reader must change state here in the same change.
#
# A reader is the function that selects the field. A value read through an accessor is
# credited to the accessor (ComplexityPolicy.Limits, not each caller); a whole section read
# and passed on is credited where its fields are selected.
#
# States:
#   consumed    at least one consumer acts on the value: renders, gates or selects with it
#   reported    consumers only print or return the value; nothing acts on it
#   unconsumed  nothing outside the plumbing reads it; the reason says what that means
#   refused     a catalog file cannot set it (refused_by rejects it); the consumers read
#               the same field from the repository manifest
#
# The Go fields are shared with other sources: ComplexityPolicy and BranchProtectionPolicy
# also carry .standards.yaml overrides and the HISS-04 ceiling, so an effect may name those.
version: 1
schema: internal/config
carriers:
  - Archetype
  - ArchetypeControls
  - ResolvedPolicy
  - ComplexityOverride
  - ComplexityPolicy
  - BranchProtectionPolicy
  - SupplyChainPolicy
  - MemoryPolicy
containers:
  - Archetype.Complexity
  - Archetype.Controls
  - ArchetypeControls.BranchProtection
  - ArchetypeControls.SupplyChain
  - ArchetypeControls.Memory
  - ResolvedPolicy.Complexity
  - ResolvedPolicy.BranchProtection
  - ResolvedPolicy.SupplyChain
  - ResolvedPolicy.Memory
plumbing:
  - func: internal/config.ArchetypeControls.contribution
    role: copies one catalog layer's controls into its policy layer
  - func: internal/config.ArchetypeControls.validate
    role: bounds counts and names, and refuses branch_protection.review_mode
  - func: internal/config.ResolvedPolicy.validateJoined
    role: bounds the joined linter and feature names
  - func: internal/config.Join
    role: joins two policy layers, highest standard winning
  - func: internal/config.clonePolicy
    role: copies a resolved policy
  - func: internal/config.joinComplexity
    role: keeps the lower of two complexity limits
  - func: internal/config.joinBranchProtection
    role: keeps the stricter of two branch protection settings
  - func: internal/config.joinSupplyChain
    role: keeps the stricter of two supply-chain settings
  - func: internal/config.joinMemory
    role: keeps every allocation ban of two layers
  - func: internal/config.decodeComplexityLimits
    role: decodes a complexity section
  - func: internal/config.ComplexityOverride.values
    role: lists a layer's complexity overrides for the join
  - func: internal/config.ComplexityPolicy.pointers
    role: addresses the limits a layer may tighten
  - func: internal/config.ComplexityPolicy.applyOverride
    role: tightens limits with a repository override
  - func: internal/config.ComplexityPolicy.WithHISSDefaults
    role: fills unset limits from the HISS-04 ceiling
  - func: internal/config.BranchProtectionPolicy.applyOverride
    role: applies a repository branch protection override
  - func: internal/config.newEffectivePolicy
    role: digests the built-in defaults as the first policy source
fields:
  - key: id
    go: [Archetype.ID]
    state: consumed
    consumers:
      - func: internal/config.indexedArchetypeID
        kind: acts
        effect: keys the catalog index, so a manifest's profile or facet id selects the file
      - func: internal/config.effectiveLoader.pinnedLayer
        kind: acts
        effect: fails the policy load when a pinned file's id differs from its lock entry
  - key: name
    go: [Archetype.Name]
    state: unconsumed
    reason: >-
      Decoded into config.Archetype and read by nothing: no command prints it and no gate
      acts on it. It labels the file for a reader.
  - key: description
    go: [Archetype.Description]
    state: unconsumed
    reason: >-
      Decoded and read by nothing. A capability the text names is enforced only where a key
      in this file binds a consumer for it; the text itself promises nothing the engine keeps.
  - key: runtime
    go: [Archetype.Runtime]
    state: unconsumed
    reason: >-
      Decoded and read by nothing; no flavor, scan or emitted file selects on it.
  - key: complexity.max_cyclomatic
    go: [ComplexityOverride.MaxCyclomatic, ComplexityPolicy.MaxCyclomatic]
    state: consumed
    consumers:
      - func: internal/config.ComplexityPolicy.Limits
        kind: reports
        effect: >-
          passes the limit to the HISS-04 scan, which prints a measurement over it and fails
          nothing (hiss.SeverityReport)
      - func: internal/editor.generateJetBrains
        kind: acts
        effect: writes the limit into the generated JetBrains inspection profile
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the limit in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the limit in the MCP plan
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: prints the limit beside each function's measurement in MCP symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: states the HISS-04 ceiling in the warning when no policy resolves
  - key: complexity.max_cognitive
    go: [ComplexityOverride.MaxCognitive, ComplexityPolicy.MaxCognitive]
    state: reported
    reason: >-
      The HISS-04 scan measures cognitive complexity against the limit and reports each
      excess without failing any gate (hiss.SeverityReport).
    consumers:
      - func: internal/config.ComplexityPolicy.Limits
        kind: reports
        effect: passes the limit to the HISS-04 scan, which reports and never fails on it
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: prints the limit beside each function's measurement in MCP symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: states the HISS-04 ceiling in the warning when no policy resolves
  - key: complexity.max_func_loc
    go: [ComplexityOverride.MaxFuncLOC, ComplexityPolicy.MaxFuncLOC]
    state: consumed
    consumers:
      - func: internal/config.ComplexityPolicy.ScanOptions
        kind: acts
        effect: >-
          sets the function length the HISS scanner fails on in audit, the gate and the MCP
          audit
      - func: cmd/standards-lsp.Server.checkHISS04Complexity
        kind: acts
        effect: publishes a language-server diagnostic for a longer function
      - func: internal/editor.neovimLSPBlock
        kind: acts
        effect: writes the limit into the generated Neovim language-server settings
      - func: internal/adopt.adoptionScanLimit
        kind: acts
        effect: bounds adoption's legacy-debt scan
      - func: internal/adopt.RepositoryHISSFacts
        kind: acts
        effect: states the limit in the HISS facts of the generated agent harness
      - func: internal/adopt.adoptSession.harnessFuncLOC
        kind: acts
        effect: states the limit in the HISS facts of the generated Paperclip harness
      - func: internal/dogfood.validatePublicPolicy
        kind: acts
        effect: refuses a public verification policy above the 60-line audit ceiling
      - func: internal/dogfood.validateRepairPolicyEvidence
        kind: acts
        effect: refuses repair evidence whose limit differs from the anchored policy
      - func: internal/dogfood.verifyPublicCheckout
        kind: reports
        effect: records the limit in the public verification result
      - func: internal/config.EffectivePolicy.Evidence
        kind: reports
        effect: prints the limit in the effective-policy evidence line
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the limit in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the limit in the MCP plan
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: prints the limit beside each function's length in MCP symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: states the HISS-04 ceiling in the warning when no policy resolves
      - func: internal/needs.epicFromAnalysis
        kind: reports
        effect: states the limit in a migration epic
      - func: internal/needs.renderRequestMarkdown
        kind: reports
        effect: states the HISS-04 ceiling in a rendered framework request
  - key: complexity.max_statements
    go: [ComplexityOverride.MaxStatements, ComplexityPolicy.MaxStatements]
    state: consumed
    consumers:
      - func: internal/editor.neovimLSPBlock
        kind: acts
        effect: writes the limit into the generated Neovim language-server settings
      - func: internal/config.ComplexityPolicy.Limits
        kind: reports
        effect: passes the limit to the HISS-04 scan, which reports and never fails on it
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: prints the limit beside each function's measurement in MCP symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: states the HISS-04 ceiling in the warning when no policy resolves
  - key: memory.zero_frame_malloc
    go: [MemoryPolicy.ZeroFrameMalloc]
    state: unconsumed
    reason: >-
      Joined (true wins) and recorded in the effective-policy digest; no scanner, gate or
      emitted file reads it. HISS-03 is defined only in docs/standards/hiss-spec.md.
  - key: memory.banned_alloc_in_ticks
    go: [MemoryPolicy.BannedAllocInTicks]
    state: unconsumed
    reason: >-
      Joined (true wins) and recorded in the effective-policy digest; no scanner, gate or
      emitted file reads it.
  - key: error_unwraps
    go: [ArchetypeControls.ErrorUnwraps, ResolvedPolicy.ErrorUnwraps]
    state: unconsumed
    reason: >-
      Joined (strict_ban wins) and recorded in the effective-policy digest; no scanner reads
      the mode, so no HISS-07 check changes with it.
  - key: branch_protection.enforce_linear_history
    go: [BranchProtectionPolicy.EnforceLinearHistory]
    state: consumed
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: renders the required_linear_history rule into the branch ruleset
      - func: internal/adopt.rulesetRequired
        kind: acts
        effect: makes the branch protection audit require a ruleset
      - func: internal/adopt.PlanDrift
        kind: acts
        effect: reports drift when the ruleset file is missing
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
  - key: branch_protection.require_signed_commits
    go: [BranchProtectionPolicy.RequireSignedCommits]
    state: consumed
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: renders the required_signatures rule into the branch ruleset
      - func: internal/adopt.rulesetRequired
        kind: acts
        effect: makes the branch protection audit require a ruleset
      - func: internal/adopt.PlanDrift
        kind: acts
        effect: reports drift when the ruleset file is missing
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
  - key: branch_protection.required_approving_reviewers
    go: [BranchProtectionPolicy.RequiredApprovingReviewers]
    state: consumed
    consumers:
      - func: internal/config.BranchProtectionPolicy.EffectiveReviewRequirements
        kind: acts
        effect: sets the approving review count the rendered branch ruleset requires
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the count in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the count in the MCP plan
  - key: branch_protection.dismiss_stale_reviews
    go: [BranchProtectionPolicy.DismissStaleReviews]
    state: consumed
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: sets dismiss_stale_reviews_on_push in the rendered branch ruleset
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
  - key: branch_protection.review_mode
    go: [BranchProtectionPolicy.ReviewMode]
    state: refused
    refused_by: internal/config.ArchetypeControls.validate
    reason: >-
      Single-maintainer review is a repository-only relaxation: a catalog file that sets it
      fails to decode. The consumers read the mode from the .standards.yaml override.
    consumers:
      - func: internal/config.BranchProtectionPolicy.EffectiveReviewRequirements
        kind: acts
        effect: drops the review gate from the rendered ruleset under single_maintainer
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the mode in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the mode in the MCP plan
  - key: supply_chain.slsa_level
    go: [SupplyChainPolicy.SLSALevel]
    state: reported
    reason: >-
      Joined (maximum wins) and printed; no workflow, release step or audit attests at the
      declared level.
    consumers:
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the level in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the level in the MCP plan
  - key: supply_chain.enforce_cosign
    go: [SupplyChainPolicy.EnforceCosign]
    state: reported
    reason: >-
      Joined (true wins) and printed; nothing signs or verifies a signature because of it.
    consumers:
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
  - key: supply_chain.require_sbom
    go: [SupplyChainPolicy.RequireSBOM]
    state: consumed
    consumers:
      - func: internal/adopt.PlanDrift
        kind: acts
        effect: reports drift when no workflow generates an SBOM
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
  - key: linters
    go: [ArchetypeControls.Linters, ResolvedPolicy.Linters]
    state: unconsumed
    reason: >-
      Joined into a deduplicated union, bounded by validate and recorded in the
      effective-policy digest, and never run: no gate, emitted workflow or editor
      configuration reads the list (#353).
  - key: devcontainer_features
    go: [ArchetypeControls.DevFeatures, ResolvedPolicy.DevFeatures]
    state: consumed
    consumers:
      - func: internal/config.decodeArtifactFeatures
        kind: acts
        effect: >-
          re-reads each pinned file's features for config.ResolveDevContainerFeatures, which
          the devcontainer command, adoption and audit resolve
