---
# Declarative coverage of the archetype catalog schema (#353).
#
# Every key a profile or facet in .config/archetypes may declare is
# bound here to the functions that read its value, or marked unconsumed
# with the reason. The effective-policy digest records every key;
# recording a value is not acting on it, and a key nothing reads
# advertises enforcement the engine does not have.
#
# internal/archetypecoverage type-checks the engine's Go source and
# replays this file in both directions
# (TestShippedManifestMatchesTheSource, run by go test and verify-all):
#   - a key config.ArchetypeKeys decodes without an entry fails, and so
#     does an entry for a key the schema does not decode;
#   - a listed consumer that no longer reads the key's Go fields fails;
#   - a function that starts reading them fails until it is listed, so
#     an unconsumed key that gains a reader changes state here in the
#     same change.
#
# A reader is the function that selects the field. A value read through
# an accessor is credited to the accessor (ComplexityPolicy.Limits, not
# each caller); a whole section read and passed on is credited where its
# fields are selected.
#
# States:
#   consumed    a consumer acts on the value: renders, gates or selects
#   reported    consumers only print or return the value
#   unconsumed  nothing outside the plumbing reads it
#   refused     a catalog file cannot set it (refused_by rejects it);
#               the consumers read the field from the repository manifest
#
# The Go fields are shared with other sources: ComplexityPolicy and
# BranchProtectionPolicy also carry .standards.yaml overrides and the
# HISS-04 ceiling, so an effect may name those.
version: 1
schema: internal/config
carriers:
  - Archetype
  - ArchetypeControls
  - ResolvedPolicy
  - ComplexityOverride
  - ComplexityPolicy
  - BranchProtectionPolicy
  - SupplyChainPolicy
  - MemoryPolicy
  - BacklogCaps
  - BacklogCap
containers:
  - Archetype.Complexity
  - Archetype.Controls
  - ArchetypeControls.BranchProtection
  - ArchetypeControls.SupplyChain
  - ArchetypeControls.Memory
  - ResolvedPolicy.Complexity
  - ResolvedPolicy.BranchProtection
  - ResolvedPolicy.SupplyChain
  - ResolvedPolicy.Memory
  - Archetype.Backlog
  - ResolvedPolicy.Backlog
  - BacklogCaps.Defects
  - BacklogCaps.Tasks
  - BacklogCaps.Questions
  - BacklogCaps.ForgeAlerts
plumbing:
  - func: internal/config.ArchetypeControls.contribution
    role: copies one catalog layer's controls into its policy layer
  - func: internal/config.ArchetypeControls.validate
    role: bounds counts and names; refuses branch_protection.review_mode
  - func: internal/config.ResolvedPolicy.validateJoined
    role: bounds the joined linter and feature names
  - func: internal/config.Join
    role: joins two policy layers, highest standard winning
  - func: internal/config.clonePolicy
    role: copies a resolved policy
  - func: internal/config.joinComplexity
    role: keeps the lower of two complexity limits
  - func: internal/config.joinBranchProtection
    role: keeps the stricter of two branch protection settings
  - func: internal/config.joinSupplyChain
    role: keeps the stricter of two supply-chain settings
  - func: internal/config.joinMemory
    role: keeps every allocation ban of two layers
  - func: internal/config.decodeComplexityLimits
    role: decodes a complexity section
  - func: internal/config.ComplexityOverride.values
    role: lists a layer's complexity overrides for the join
  - func: internal/config.ComplexityPolicy.pointers
    role: addresses the limits a layer may tighten
  - func: internal/config.ComplexityPolicy.applyOverride
    role: tightens limits with a repository override
  - func: internal/config.ComplexityPolicy.WithHISSDefaults
    role: fills unset limits from the HISS-04 ceiling
  - func: internal/config.BranchProtectionPolicy.applyOverride
    role: applies a repository branch protection override
  - func: internal/config.newEffectivePolicy
    role: digests the built-in defaults as the first policy source
  - func: internal/config.BacklogCaps.validate
    role: bounds a layer's backlog caps
  - func: internal/config.BacklogCaps.validateResolved
    role: refuses an action no layer gave a max
  - func: internal/config.joinBacklog
    role: keeps the lower max and the stricter action of two layers
  - func: internal/config.EffectivePolicy.applyBacklog
    role: records the layers imposing each backlog cap value
  - func: internal/config.verifyBacklogFields
    role: checks a retained snapshot's backlog cap contributors
fields:
  - key: id
    go: [Archetype.ID]
    state: consumed
    consumers:
      - func: internal/config.indexedArchetypeID
        kind: acts
        effect: >-
          keys the catalog index, so a manifest's profile or facet id
          selects the file
      - func: internal/config.effectiveLoader.pinnedLayer
        kind: acts
        effect: >-
          fails the policy load when a pinned file's id differs from its
          lock entry
      - func: internal/config.retainedContributions
        kind: reports
        effect: >-
          keys each retained catalog text's share of the join by kind and id,
          so the facet effects name the profile or facet that raised a setting
  - key: name
    go: [Archetype.Name]
    state: unconsumed
    reason: >-
      Decoded into config.Archetype and read by nothing: no command prints
      it and no gate acts on it. It labels the file for a reader.
  - key: description
    go: [Archetype.Description]
    state: unconsumed
    reason: >-
      Decoded and read by nothing. A capability the text names is enforced
      only where a key in this file binds a consumer for it; the text
      itself promises nothing the engine keeps.
  - key: runtime
    go: [Archetype.Runtime]
    state: unconsumed
    reason: >-
      Decoded and read by nothing; no flavor, scan or emitted file selects
      on it.
  - key: complexity.max_cyclomatic
    go: [ComplexityOverride.MaxCyclomatic, ComplexityPolicy.MaxCyclomatic]
    state: consumed
    consumers:
      - func: internal/config.ComplexityPolicy.Limits
        kind: reports
        effect: >-
          passes the limit to the HISS-04 scan, which prints a measurement
          over it and fails nothing (hiss.SeverityReport)
      - func: internal/editor.generateJetBrains
        kind: acts
        effect: writes the limit into the generated JetBrains profile
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the limit in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the limit in the MCP plan
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: >-
          prints the limit beside each function's measurement in MCP
          symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: >-
          states the HISS-04 ceiling in the warning when no policy
          resolves
  - key: complexity.max_cognitive
    go: [ComplexityOverride.MaxCognitive, ComplexityPolicy.MaxCognitive]
    state: reported
    reason: >-
      The HISS-04 scan measures cognitive complexity against the limit and
      reports each excess without failing any gate (hiss.SeverityReport).
    consumers:
      - func: internal/config.ComplexityPolicy.Limits
        kind: reports
        effect: >-
          passes the limit to the HISS-04 scan, which reports and never
          fails on it
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: >-
          prints the limit beside each function's measurement in MCP
          symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: >-
          states the HISS-04 ceiling in the warning when no policy
          resolves
  - key: complexity.max_func_loc
    go: [ComplexityOverride.MaxFuncLOC, ComplexityPolicy.MaxFuncLOC]
    state: consumed
    consumers:
      - func: internal/config.ComplexityPolicy.ScanOptions
        kind: acts
        effect: >-
          sets the function length the HISS scanner fails on in audit, the
          gate and the MCP audit, and the limit the generated agent and
          Paperclip harness rows state (internal/adopt.withPolicy)
      - func: cmd/standards-lsp.Server.checkHISS04Complexity
        kind: acts
        effect: publishes a language-server diagnostic for a longer function
      - func: internal/editor.neovimLSPBlock
        kind: acts
        effect: >-
          writes the limit into the generated Neovim language-server
          settings
      - func: internal/adopt.adoptionScanLimit
        kind: acts
        effect: bounds adoption's legacy-debt scan
      - func: internal/dogfood.validatePublicPolicy
        kind: acts
        effect: >-
          refuses a public verification policy above the 60-line audit
          ceiling
      - func: internal/dogfood.validateRepairPolicyEvidence
        kind: acts
        effect: >-
          refuses repair evidence whose limit differs from the anchored
          policy
      - func: internal/dogfood.verifyPublicCheckout
        kind: reports
        effect: records the limit in the public verification result
      - func: internal/config.EffectivePolicy.Evidence
        kind: reports
        effect: prints the limit in the effective-policy evidence line
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the limit in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the limit in the MCP plan
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: >-
          prints the limit beside each function's length in MCP symbol
          inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: >-
          states the HISS-04 ceiling in the warning when no policy
          resolves
      - func: internal/needs.epicFromAnalysis
        kind: reports
        effect: states the limit in a migration epic
      - func: internal/needs.renderRequestMarkdown
        kind: reports
        effect: states the HISS-04 ceiling in a rendered framework request
  - key: complexity.max_statements
    go: [ComplexityOverride.MaxStatements, ComplexityPolicy.MaxStatements]
    state: consumed
    consumers:
      - func: internal/editor.neovimLSPBlock
        kind: acts
        effect: >-
          writes the limit into the generated Neovim language-server
          settings
      - func: internal/config.ComplexityPolicy.Limits
        kind: reports
        effect: >-
          passes the limit to the HISS-04 scan, which reports and never
          fails on it
      - func: cmd/standards-mcp.writeFuncReport
        kind: reports
        effect: >-
          prints the limit beside each function's measurement in MCP
          symbol inspection
      - func: internal/config.unresolvedComplexity
        kind: reports
        effect: >-
          states the HISS-04 ceiling in the warning when no policy
          resolves
  - key: memory.zero_frame_malloc
    go: [MemoryPolicy.ZeroFrameMalloc]
    state: unconsumed
    reason: >-
      Joined (true wins) and recorded in the effective-policy digest; no
      scanner, gate or emitted file reads it. HISS-03 is defined only in
      docs/standards/hiss-spec.md.
  - key: memory.banned_alloc_in_ticks
    go: [MemoryPolicy.BannedAllocInTicks]
    state: unconsumed
    reason: >-
      Joined (true wins) and recorded in the effective-policy digest; no
      scanner, gate or emitted file reads it.
  - key: error_unwraps
    go: [ArchetypeControls.ErrorUnwraps, ResolvedPolicy.ErrorUnwraps]
    state: unconsumed
    reason: >-
      Joined (strict_ban wins) and recorded in the effective-policy digest;
      no scanner reads the mode, so no HISS-07 check changes with it.
  - key: branch_protection.enforce_linear_history
    go: [BranchProtectionPolicy.EnforceLinearHistory]
    state: consumed
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: renders the required_linear_history rule into the ruleset
      - func: internal/forge.RenderMergeQueueRuleset
        kind: acts
        effect: picks the squash merge method of the merge queue rule
      - func: internal/adopt.RulesetRequired
        kind: acts
        effect: >-
          makes the branch protection audit require a ruleset, and plan report
          drift when the ruleset file is missing
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
      - func: internal/forge.EvaluateBranchProtection
        kind: reports
        effect: >-
          compares the setting GitHub enforces on the default branch with the
          declared one (plan --remote, sync --remote readback)
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: branch_protection.require_signed_commits
    go: [BranchProtectionPolicy.RequireSignedCommits]
    state: consumed
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: renders the required_signatures rule into the ruleset
      - func: internal/adopt.RulesetRequired
        kind: acts
        effect: >-
          makes the branch protection audit require a ruleset, and plan report
          drift when the ruleset file is missing
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
      - func: internal/forge.EvaluateBranchProtection
        kind: reports
        effect: >-
          compares the setting GitHub enforces on the default branch with the
          declared one (plan --remote, sync --remote readback)
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: branch_protection.required_approving_reviewers
    go: [BranchProtectionPolicy.RequiredApprovingReviewers]
    state: consumed
    consumers:
      - func: internal/config.BranchProtectionPolicy.EffectiveReviewRequirements
        kind: acts
        effect: >-
          sets the approving review count the rendered branch ruleset
          requires
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the count in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the count in the MCP plan
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: branch_protection.dismiss_stale_reviews
    go: [BranchProtectionPolicy.DismissStaleReviews]
    state: consumed
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: sets dismiss_stale_reviews_on_push in the rendered ruleset
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: internal/forge.EvaluateBranchProtection
        kind: reports
        effect: >-
          compares the setting GitHub enforces on the default branch with the
          declared one (plan --remote, sync --remote readback)
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: branch_protection.review_mode
    go: [BranchProtectionPolicy.ReviewMode]
    state: refused
    refused_by: internal/config.ArchetypeControls.validate
    reason: >-
      Single-maintainer review is a repository-only relaxation: a catalog
      file that sets it fails to decode. The consumers read the mode from
      the .standards.yaml override.
    consumers:
      - func: internal/config.BranchProtectionPolicy.EffectiveReviewRequirements
        kind: acts
        effect: >-
          drops the review gate from the rendered ruleset under
          single_maintainer
      - func: internal/forge.rulesetBypassActors
        kind: acts
        effect: >-
          renders the repository admin role as the ruleset's pull-request
          bypass actor under single_maintainer, and none under any other mode
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the mode in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the mode in the MCP plan
      - func: internal/forge.EvaluateBranchProtection
        kind: reports
        effect: >-
          compares the setting GitHub enforces on the default branch with the
          declared one (plan --remote, sync --remote readback)
  - key: branch_protection.merge_queue
    go: [BranchProtectionPolicy.MergeQueue]
    state: refused
    refused_by: internal/config.ArchetypeControls.validate
    reason: >-
      A merge queue is a property of one repository: a catalog file that sets
      it fails to decode. The consumers read it from the .standards.yaml
      override.
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: renders the code_scanning rule next to a declared queue
      - func: internal/forge.RenderRulesetForRepository
        kind: acts
        effect: >-
          selects the required status contexts from the workflows that
          trigger on merge_group only
      - func: internal/config.Overrides.DeclaresMergeQueue
        kind: acts
        effect: >-
          lets sync select the merge_group contexts before the policy is
          resolved
      - func: internal/forge.ReadRulesetBaseline
        kind: acts
        effect: >-
          reads the earlier ruleset's contexts under the same selection, so an
          unedited file refreshes
      - func: internal/adopt.auditRulesetContent
        kind: acts
        effect: >-
          compares the committed ruleset with the merge_group selection
      - func: internal/adopt.queueRequiredContexts
        kind: reports
        effect: >-
          names a required context whose workflow lacks the merge_group
          trigger, with the workflow path (the offline audit)
      - func: cmd/standardsctl.auditDocumentationHostedWiring
        kind: acts
        effect: >-
          compares the documentation gate's ruleset with the merge_group
          selection
      - func: cmd/standardsctl.reconcileRemoteRuleset
        kind: acts
        effect: >-
          writes the merge_group selection to the forge ruleset
      - func: cmd/standardsctl.liveProtectionTarget
        kind: acts
        effect: >-
          compares the live branch protection with the merge_group selection
      - func: cmd/standardsctl.auditProtectionTarget
        kind: acts
        effect: >-
          compares the live branch protection with the merge_group selection
          of the default branch's workflows
      - func: cmd/standardsctl.verifySyncLocal
        kind: reports
        effect: >-
          names the workflows the declared queue leaves out of the required
          checks (sync, local)
      - func: cmd/standardsctl.liveMergeQueueVerdict
        kind: reports
        effect: >-
          fails the audit for a live merge_queue rule the policy does not
          declare
      - func: internal/adopt.reconcileBranchRuleset
        kind: reports
        effect: >-
          warns about the workflows the declared queue leaves out of the
          ruleset
      - func: internal/flavor.applyRuleset
        kind: reports
        effect: >-
          names the workflows the declared queue leaves out of the ruleset
      - func: cmd/standardsctl.reconcileRemoteMergeQueue
        kind: acts
        effect: >-
          writes the merge_queue rule into its own ruleset on the default
          branch alone
      - func: internal/forge.MergeQueueRulesetFindings
        kind: reports
        effect: >-
          compares the live queue and its ruleset's refs with the declaration
          (plan --remote, sync --remote readback, the audit)
      - func: cmd/standardsctl.reportLiveProtection
        kind: reports
        effect: >-
          names a queue ruleset still on GitHub when the policy declares no
          queue
      - func: internal/forge.protectionDocument
        kind: acts
        effect: >-
          drops the CodeQL default setup contexts from the required checks
          under a merge queue
      - func: internal/forge.PriorRulesetDigests
        kind: acts
        effect: >-
          accepts the queue rendering as the prior of the queue-less one and
          the reverse, so toggling the key refreshes an unedited file
  - key: branch_protection.codeql_default_setup
    go: [BranchProtectionPolicy.CodeQLDefaultSetup]
    state: refused
    refused_by: internal/config.ArchetypeControls.validate
    reason: >-
      Whether CodeQL default setup is on is a property of one repository: a
      catalog file that sets it fails to decode. The consumer reads it from
      the .standards.yaml override.
    consumers:
      - func: internal/forge.protectionRules
        kind: acts
        effect: >-
          renders a code_scanning rule for CodeQL under a merge queue, where
          default setup reports no status context for a merge group
      - func: internal/forge.protectionDocument
        kind: acts
        effect: >-
          drops the CodeQL default setup contexts from the required checks
          under a merge queue
  - key: supply_chain.slsa_level
    go: [SupplyChainPolicy.SLSALevel]
    state: consumed
    consumers:
      - func: internal/adopt.declaresSupplyChain
        kind: acts
        effect: >-
          reads no workflow when policy declares Level 0 and nothing else
          (the CLI and MCP audits)
      - func: internal/adopt.supplyChainShortfalls
        kind: acts
        effect: >-
          fails the audit when the level exceeds the one the workflow files
          measure (forge.MeasureProvenance), unless a live HISS-11 exceptions
          entry declares the gap
      - func: internal/adopt.supplyChainPass
        kind: reports
        effect: prints the declared and the measured level on the audit pass line
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the level in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the level in the MCP plan
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: supply_chain.enforce_cosign
    go: [SupplyChainPolicy.EnforceCosign]
    state: consumed
    consumers:
      - func: internal/adopt.declaresSupplyChain
        kind: acts
        effect: measures the workflow files when set (the CLI and MCP audits)
      - func: internal/adopt.supplyChainShortfalls
        kind: acts
        effect: >-
          fails the audit when no workflow signs with cosign, unless a live
          HISS-11 exceptions entry declares the gap
      - func: internal/adopt.supplyChainPass
        kind: reports
        effect: names the workflow that signs on the audit pass line
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: supply_chain.require_sbom
    go: [SupplyChainPolicy.RequireSBOM]
    state: consumed
    consumers:
      - func: internal/adopt.PlanDrift
        kind: acts
        effect: reports drift when no workflow generates an SBOM
      - func: internal/adopt.declaresSupplyChain
        kind: acts
        effect: measures the workflow files when set (the CLI and MCP audits)
      - func: internal/adopt.measureSupplyChainGap
        kind: acts
        effect: looks for an SBOM workflow when set (the CLI and MCP audits)
      - func: internal/adopt.supplyChainShortfalls
        kind: acts
        effect: >-
          fails the audit when no workflow generates an SBOM, unless a live
          HISS-11 exceptions entry declares the gap
      - func: internal/adopt.supplyChainPass
        kind: reports
        effect: names the workflow that generates the SBOM on the audit pass line
      - func: cmd/standardsctl.printPlanHeader
        kind: reports
        effect: prints the setting in praetorctl plan
      - func: cmd/standards-mcp.writePlanHeader
        kind: reports
        effect: prints the setting in the MCP plan
      - func: internal/config.raisedSettings
        kind: reports
        effect: >-
          names the setting with both values when a declared facet raises it
          (the facet effects the policy reports)
  - key: linters
    go: [ArchetypeControls.Linters, ResolvedPolicy.Linters]
    state: consumed
    consumers:
      - func: cmd/standardsctl.auditTidyCoverage
        kind: acts
        effect: >-
          runs the clang-tidy translation-unit coverage gate in the audit
          when the list names clang-tidy, as native-gpu-systems does (#778);
          no gate, emitted workflow or editor configuration reads any other
          name (#353)
  - key: devcontainer_features
    go: [ArchetypeControls.DevFeatures, ResolvedPolicy.DevFeatures]
    state: consumed
    consumers:
      - func: internal/config.decodeArtifactFeatures
        kind: acts
        effect: >-
          re-reads each pinned file's features for
          config.ResolveDevContainerFeatures, which the devcontainer
          command, adoption and audit resolve
  - key: backlog.caps.defects.max
    go: [BacklogCap.Max]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.Declared
        kind: acts
        effect: >-
          selects the categories internal/backlogcap counts, so a category
          without a max is not bounded, printed, batched or gated
      - func: internal/config.BacklogCap.Over
        kind: acts
        effect: >-
          decides that a count is over the cap, which makes praetorctl state
          batch write the category's batch and praetorctl audit fail a gated
          category
      - func: internal/config.BacklogCap.Limit
        kind: reports
        effect: >-
          prints the max in praetorctl state status, the audit, the batch file
          and the effective-policy evidence line
  - key: backlog.caps.defects.action
    go: [BacklogCap.Action]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.EffectiveAction
        kind: acts
        effect: >-
          selects what an over-cap category triggers: batch makes praetorctl
          state batch write its batch file, gate makes praetorctl audit fail;
          an undeclared action is report
  - key: backlog.caps.tasks.max
    go: [BacklogCap.Max]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.Declared
        kind: acts
        effect: >-
          selects the categories internal/backlogcap counts, so a category
          without a max is not bounded, printed, batched or gated
      - func: internal/config.BacklogCap.Over
        kind: acts
        effect: >-
          decides that a count is over the cap, which makes praetorctl state
          batch write the category's batch and praetorctl audit fail a gated
          category
      - func: internal/config.BacklogCap.Limit
        kind: reports
        effect: >-
          prints the max in praetorctl state status, the audit, the batch file
          and the effective-policy evidence line
  - key: backlog.caps.tasks.action
    go: [BacklogCap.Action]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.EffectiveAction
        kind: acts
        effect: >-
          selects what an over-cap category triggers: batch makes praetorctl
          state batch write its batch file, gate makes praetorctl audit fail;
          an undeclared action is report
  - key: backlog.caps.questions.max
    go: [BacklogCap.Max]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.Declared
        kind: acts
        effect: >-
          selects the categories internal/backlogcap counts, so a category
          without a max is not bounded, printed, batched or gated
      - func: internal/config.BacklogCap.Over
        kind: acts
        effect: >-
          decides that a count is over the cap, which makes praetorctl state
          batch write the category's batch and praetorctl audit fail a gated
          category
      - func: internal/config.BacklogCap.Limit
        kind: reports
        effect: >-
          prints the max in praetorctl state status, the audit, the batch file
          and the effective-policy evidence line
  - key: backlog.caps.questions.action
    go: [BacklogCap.Action]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.EffectiveAction
        kind: acts
        effect: >-
          selects what an over-cap category triggers: batch makes praetorctl
          state batch write its batch file, gate makes praetorctl audit fail;
          an undeclared action is report
  - key: backlog.caps.forge_alerts.max
    go: [BacklogCap.Max]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.Declared
        kind: acts
        effect: >-
          selects the category; praetor has no forge alert reader, so it is
          never counted or compared with the max: praetorctl state status and
          the audit print it as not counted, and a gate on it fails the audit
          as a category that cannot be counted
      - func: internal/config.BacklogCap.Over
        kind: acts
        effect: >-
          reads the max for the counted categories only; for forge_alerts
          Category.State returns not counted before Over is evaluated, so
          only Declared and Limit apply and the max never writes a batch or
          fails the audit on a count
      - func: internal/config.BacklogCap.Limit
        kind: reports
        effect: >-
          prints the max in praetorctl state status, the audit and the
          effective-policy evidence line
  - key: backlog.caps.forge_alerts.action
    go: [BacklogCap.Action]
    state: consumed
    consumers:
      - func: internal/config.BacklogCap.EffectiveAction
        kind: acts
        effect: >-
          gate makes praetorctl audit fail, because the category cannot be
          counted; report and batch only print it as not counted, and no batch
          is written; an undeclared action is report
