id: "web-package"
name: "Published Web Package"
description: "npm-published TypeScript and Svelte libraries: a versioned public API surface, semver discipline and a changelog consumers read, with no container to ship"
runtime: "node"

# A library is not a service. The bounds match pages-site because the language and
# tooling are the same; what differs is everything below, where a package answers to
# its consumers rather than to a deployment.
complexity:
  max_cyclomatic: 10
  max_cognitive: 12
  max_func_loc: 75
  max_statements: 40

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 1
  dismiss_stale_reviews: true

# SLSA 2 rather than 3, and no cosign: npm provenance is the attestation consumers
# actually verify for this artifact class, and it is produced by the registry rather
# than by a signing step in the repository. Requiring cosign here would demand a
# signature nothing in the install path checks.
supply_chain:
  slsa_level: 2
  enforce_cosign: false
  require_sbom: true

# Flat config only. ESLint v10 states that "the old configuration format is no longer
# supported", so an archetype that named .eslintrc.* would require a file the linter
# cannot load.
linters:
  - "eslint"
  - "prettier"
  - "svelte-check"
  - "publint"
  - "markdownlint"

devcontainer_features:
  - "ghcr.io/devcontainers/features/node:1"
  - "ghcr.io/devcontainers/features/common-utils:2"
