id: "gitops-infra"
name: "GitOps & Infrastructure as Code"
description: "Declarative cluster state, Kubernetes manifests, Helm charts, and Terraform definitions under automated reconciler governance"
runtime: "iac"

complexity:
  max_cyclomatic: 8
  max_cognitive: 10
  max_func_loc: 60
  max_statements: 30

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 2
  dismiss_stale_reviews: true

supply_chain:
  slsa_level: 3
  enforce_cosign: true
  require_sbom: true

linters:
  - "kubeconform"
  - "trivy"
  - "yamllint"
  - "checkov"
  - "tflint"

devcontainer_features:
  - "ghcr.io/devcontainers/features/kubectl-helm-minikube:1"
  - "ghcr.io/devcontainers/features/terraform:1"
  - "ghcr.io/devcontainers/features/common-utils:2"
