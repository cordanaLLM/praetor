# Rust module names use $_ deliberately: named captures fail the pinned engine's
# module match. Real-engine fixtures cover test bodies and adjacent production.
rules:
  - id: hiss-07-banned-unwrap
    patterns:
      - pattern: $X.unwrap()
      - pattern-not-inside: |
          mod tests { ... }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $F(...) { ... }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $_ { ... }
    message: "[HISS-07] Direct .unwrap() prohibited. fix: pattern match or ? propagation."
    languages: [rust]
    severity: ERROR

  - id: hiss-07-banned-expect
    patterns:
      - pattern: $X.expect(...)
      - pattern-not-inside: |
          mod tests { ... }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $F(...) { ... }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $_ { ... }
    message: "[HISS-07] Direct .expect() prohibited. fix: pattern match or ? propagation."
    languages: [rust]
    severity: ERROR

  - id: hiss-08-banned-eval
    patterns:
      - pattern: eval(...)
    message: "[HISS-08] Dynamic runtime eval() prohibited."
    languages: [javascript, typescript]
    severity: ERROR

  - id: hiss-08-banned-eval-python
    pattern: eval(...)
    message: "[HISS-08] Dynamic runtime eval() prohibited."
    languages: [python]
    severity: ERROR

  - id: hiss-08-banned-c-memory
    patterns:
      - pattern-either:
          - pattern: gets(...)
          - pattern: strcpy(...)
          - pattern: sprintf(...)
    message: "[HISS-08] Insecure legacy C memory functions prohibited. fix: bounded fgets, strncpy, or snprintf."
    languages: [c, cpp]
    severity: ERROR

  - id: hiss-02-go-http-without-context
    pattern-either:
      - pattern: http.Get(...)
      - pattern: http.Post(...)
    message: "[HISS-02] Direct http.Get/Post lacks context timeout. fix: http.NewRequestWithContext."
    languages: [go]
    severity: ERROR
