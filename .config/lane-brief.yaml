# Lane briefs for this repository (read by the lane launcher's brief check before a lane starts).
# Fix and implementation lanes must run the pre-push gate's own checks, so a lane result never
# reaches the gate untested on them: gosec, the permissions semgrep rules, the caveman inventory
# of agent-facing text (register.sources in .standards.yaml) and the documentation references.
# Review, audit and research lanes stay free of these requirements.
required_by_stage:
  fix:
    - "gosec"
    - "semgrep scan"
    - "caveman check --configured-sources"
    - "docs references --path=."
  impl:
    - "gosec"
    - "semgrep scan"
    - "caveman check --configured-sources"
    - "docs references --path=."
