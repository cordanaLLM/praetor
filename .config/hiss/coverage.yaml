# Declared enforcement evidence for the HISS invariants (HISS-20).
#
# Every claim here is replayed against .config/hiss/testdata by `praetorctl hiss coverage
# --verify`, which runs inside verify-all. A claim is only as good as the fixture that
# demonstrates it.
#
# The check runs in BOTH directions. A state claiming detection must report each of its
# positive fixtures; a state claiming none must leave its gap fixtures undetected. So the
# catalog fails when it becomes too optimistic AND when it becomes too pessimistic: the day a
# rule gains coverage, the gap fixture it was supposed to miss fires and this file must be
# updated to say so.
#
# States:
#   enforced       every shape the corpus describes is reported
#   partial        some shapes reported; gap/ names the rest
#   unsupported    nothing reported for this language; gap/ records what goes undetected
#   not_applicable the axiom does not apply to this language
#   manual         upheld by review, not by a runnable check -- never report it as a gate
#
# This file is deliberately incomplete. It covers the invariants whose behaviour has been
# measured directly; the remaining rules and languages are being added with their fixtures
# rather than declared ahead of the evidence. An absent claim is honest; an unbacked one is
# the defect this mechanism exists to prevent.
version: 1
rules:
  - id: HISS-01
    title: Acyclic Control Flow
    coverage:
      - language: go
        state: partial
        mechanism: internal/hiss go_ast.go checkSelfRecursion and the goto branch
        rationale: >-
          Direct recursion and goto are reported, including a recursive method, a call from
          inside a closure the function declares, and a generic self-call written with an
          explicit type argument. A local that shadows the function name is not reported,
          because the call reaches the local. Mutual and indirect recursion need a
          whole-program call graph and are held as gaps.
      - language: c
        state: partial
        mechanism: internal/hiss rules.go native goto matcher
        rationale: >-
          Only goto is reported. Recursion in native code is not decided by the line scanner
          and is held as a gap.
      - language: rust
        state: unsupported
        mechanism: none
        rationale: No Rust control-flow rule exists; neither recursion nor an equivalent jump is decided.
      - language: python
        state: unsupported
        mechanism: none
        rationale: No Python control-flow rule exists.
  - id: HISS-02
    title: Bounded Loops and I/O Timeouts
    coverage:
      - language: c
        state: partial
        mechanism: internal/hiss rules.go nativeUnboundedLoop
        rationale: >-
          Unbounded loop shapes are reported with arbitrary internal spacing. The I/O-timeout
          half of the axiom has no native check.
      - language: rust
        state: partial
        mechanism: internal/hiss rules.go rustUnboundedLoop
        rationale: >-
          loop and while true are reported, including a labelled loop and a missing space
          before the brace. The I/O-timeout half has no Rust check.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go pythonWhileTrue
        rationale: >-
          while True is reported with arbitrary spacing. Other unbounded shapes such as
          while 1 and the I/O-timeout half are not decided.
  - id: HISS-04
    title: Complexity Bounds
    coverage:
      - language: go
        state: partial
        mechanism: internal/hiss go_ast.go checkFuncLOC, with gocyclo, gocognit and funlen in golangci-lint
        rationale: >-
          The scanner decides function length only. The cyclomatic, cognitive and statement
          caps HISS-04 also declares are golangci-lint's, so fixtures for them are held as
          gaps here rather than counted as scanner coverage.
      - language: rust
        state: partial
        mechanism: internal/hiss rules.go braceTracker
        rationale: >-
          Function length is decided by brace tracking. The other three caps have no Rust
          check at all.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go python indentation tracker
        rationale: >-
          Function length is decided by indentation. The other three caps have no Python
          check, and Python test files carry no length exemption.
      - language: c
        state: partial
        mechanism: internal/hiss rules.go braceTracker
        rationale: >-
          Function length is decided by brace tracking. The other three caps have no native
          check.
  - id: HISS-08
    title: Static Determinism
    coverage:
      - language: c
        state: partial
        mechanism: internal/hiss rules.go hasBannedCall
        rationale: >-
          gets, strcpy and sprintf are refused, with arbitrary spacing before the argument
          list. Other unsafe native primitives are not decided.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go hasBannedCall
        rationale: >-
          eval and exec are refused as bare calls. A method of the same name reached through
          a selector is not a builtin and is not reported. Dynamic import and compile are not
          decided.
      - language: go
        state: unsupported
        mechanism: none in internal/hiss; forbidigo in golangci-lint fences the primitives
        rationale: >-
          The scanner carries no HISS-08 case for Go. plugin.Open, os.StartProcess and the
          syscall exec family are refused by forbidigo in the same gate, so the fixtures are
          held as gaps for the scanner rather than as coverage it does not have.
  - id: HISS-07
    title: Checked Errors
    coverage:
      - language: go
        state: partial
        mechanism: internal/hiss go_ast.go checkBlankAssign, with errcheck in golangci-lint
        rationale: >-
          A discarded call result is reported. Discarding a non-call value is not, because it
          cannot carry an error. A bare call statement that drops an error needs type
          information this syntax scanner does not build and is held as a gap; errcheck
          decides that case with types in the same gate.
      - language: rust
        state: partial
        mechanism: internal/hiss rules.go rustUnwrapCall and rustExpectCall
        rationale: >-
          unwrap and expect are reported in production code with arbitrary spacing. Errors
          discarded by other means are not decided by a line scanner.
  - id: HISS-09
    title: Reference Safety
    coverage:
      - language: rust
        state: partial
        mechanism: internal/hiss rules.go rustUnsafeBlock with hasSafetyComment
        rationale: >-
          An unsafe block without a preceding SAFETY proof is reported, and one with a proof is
          not. Whether the proof is truthful is not decided by any check.
      - language: go
        state: partial
        mechanism: internal/hiss go_ast.go checkUnsafe with a preceding SAFETY proof
        rationale: >-
          An unsafe selector without a SAFETY proof is reported, and a local that shadows the
          package name is not. Whether a proof is truthful is not decided.
      - language: c
        state: unsupported
        mechanism: none
        rationale: No native reference-safety rule exists; the gap fixtures record what goes undetected.
      - language: python
        state: unsupported
        mechanism: none
        rationale: No Python reference-safety rule exists.
