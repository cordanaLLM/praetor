# Declared enforcement evidence for the HISS invariants (HISS-20).
#
# Every claim here is replayed against .config/hiss/testdata by `praetorctl hiss coverage
# --verify`, which runs inside verify-all. A claim is only as good as the fixture that
# demonstrates it.
#
# The check runs in BOTH directions. A state claiming detection must report each of its
# positive fixtures; a state claiming none must leave its gap fixtures undetected. So the
# catalog fails when it becomes too optimistic AND when it becomes too pessimistic: the day a
# rule gains coverage, the gap fixture it was supposed to miss fires and this file must be
# updated to say so.
#
# States:
#   enforced       every shape the corpus describes is reported
#   partial        some shapes reported; gap/ names the rest
#   unsupported    nothing reported for this language; gap/ records what goes undetected
#   not_applicable the axiom does not apply to this language
#   manual         upheld by review, not by a runnable check -- never report it as a gate
#
# A rule's name comes from the HISS rule catalog (internal/hisscatalog); an entry may repeat
# it as `title:` but never differ from it, so this file cannot keep a second list of names.
#
# This file is deliberately incomplete. It covers the invariants whose behaviour has been
# measured directly; the remaining rules and languages are being added with their fixtures
# rather than declared ahead of the evidence. An absent claim is honest; an unbacked one is
# the defect this mechanism exists to prevent.
version: 1
rules:
  - id: HISS-01
    coverage:
      - language: go
        state: partial
        mechanism: internal/hiss go_ast.go checkSelfRecursion, the goto branch, and
          go_callgraph.go reportCallCycles
        rationale: >-
          Direct recursion and goto are reported, including a recursive method, a call from
          inside a closure the function declares, and a generic self-call written with an
          explicit type argument. A local that shadows the function name is not reported,
          because the call reaches the local. Mutual and indirect recursion between plain
          functions are now reported too: the call-graph pass builds each package's graph
          after the walk and names every strongly connected component of two or more
          functions. Package scope is complete rather than convenient, because a call cycle
          spanning two packages would need each to import the other and the compiler rejects
          that. A cycle through methods remains a gap: resolving a method call needs the
          receiver's type, and guessing it would invent edges that do not exist.
      - language: c
        state: partial
        mechanism: internal/hiss cleanup_goto.go nativeGotos, driven by rules.go scanNativeLines
        rationale: >-
          Only goto is reported. Under a declared and documented hiss.exceptions.c_goto_cleanup
          (hiss.CleanupGoto), a forward goto to the sole label of its function, sitting directly
          in the function body under a cleanup name, is not; every other goto still is, which
          cleanup_goto_test.go replays in both directions. The fixtures below scan without a
          manifest, so they replay the undeclared direction. Recursion in native code is not
          decided by the line scanner and is held as a gap.
      - language: rust
        state: partial
        mechanism: internal/hiss selfcall.go rustSelfCalls, driven by scanRustLines
        rationale: >-
          Direct recursion is reported by the spelling that resolves to the function: a free
          function calling its bare name, and, in an inherent impl or a trait body, a method
          calling self.f or Self::f and an associated function calling Self::f. A bare call
          inside an impl or trait body resolves to a free function, a path such as other::f
          names a different item, and a local binding of the same name shadows it, so none of
          those are reported. Shadowing follows Rust's lexical scopes: a let from the end of
          its statement to the end of its block, a for, if-let or while-let pattern inside the
          block it heads, a match arm's pattern in its guard and body, a closure parameter
          inside the closure, and a nested fn or use for the whole body. A struct pattern's
          braces belong to the pattern, and a later arm on the match's line binds as a first
          arm does. An arm ends where rustc ends it: at its comma, or at the brace closing a
          block-like body ({, if, match, loop, ...) unless an else, a method call or ? carries
          it on, so a brace inside an if-else branch or a nested match ends nothing, while a
          -, &, | or < after that brace opens the next arm's pattern. A body that starts on
          the line after the arrow is read at its first token. A closure's body is a whole
          expression and ends only at a comma, a semicolon or its enclosing bracket, and the
          pipe of an or-pattern or a bitwise or is not taken for a closure's opening pipe. A
          call outside that scope, before the let or after the block, loop, arm or closure
          ends, is still reported, and a name followed by a parenthesis is a call rather than
          a binding. A binding is read from one line only: a let pattern or a closure
          parameter list wrapped across lines, or an arm whose guard or arrow sits on a later
          line than the name, is not recognised as binding the name, so a call of that local
          is reported. A match arm's pattern calls nothing; its guard and body are call sites,
          where the arm's own bindings are already in scope. Inside impl Trait for T,
          self.f and Self::f reach an inherent T::f first, which may sit in any file of the
          crate, and Self::f picks among T's impls by argument type, so no function there is
          decided; the header is classified with its attributes, const generic braces and
          array lengths, and a header that ends in a semicolon opens no body. A macro may
          rewrite its input into a call of something else (syscall!(recv(fd)) calls
          libc::recv), so a call inside the input of any macro but the standard expression
          macros (assert!, format!, vec!, ...) is not decided, nor is a function written in a
          macro_rules template, whose signature holds a $metavariable. A function behind any
          header the Rust grammar allows (a visibility such as pub(super), const, async,
          unsafe or extern) is decided like a plain fn. Mutual recursion, recursion inside a
          nested fn, a trait impl, a macro_rules template or a user-defined macro's input, and
          a turbofish or path-qualified self-call are held as gaps.
      - language: python
        state: partial
        mechanism: internal/hiss selfcall.go selfCalls, driven by scanPythonLines
        rationale: >-
          Direct recursion is reported by the spelling that resolves to the function: a plain
          function calling its bare name, including from a nested def, and a method calling
          self.f, cls.f or Owner.f. A bare call inside a method resolves to the module-level
          name, a call through another object is delegation, and a parameter, assignment,
          loop target, import or nested def of the same name shadows the function, so none of
          those are reported. A binding shadows the name only in the function that makes it,
          so a nested def's parameter or local does not hide the enclosing function's own
          self-call, and a call from inside that nested def reaches its local. Mutual and
          indirect recursion and recursion through a lambda are held as gaps.
      - language: javascript
        state: partial
        mechanism: internal/hiss script.go scriptScanner and script_header.go, with selfcall.go selfCalls
        rationale: >-
          Direct recursion is reported by the spelling that resolves to the function: a declared
          function, a named function expression (under either of its names) or a function bound to
          a const, let or var calling its bare name, and a class or object method or a class field
          calling this.name, including from a promise callback inside the body. A bare call inside
          a method reaches the module function, a call through another object is delegation, $f is
          a different identifier, and a local binding of the name (a parameter, a const, let or var
          declarator including destructuring, a nested function or class, a catch parameter, an
          arrow or function-expression parameter) shadows it, so none of those are reported. A
          parameter list holding a destructuring pattern, an object type or a default value is
          read, wrapped or not, so walk({ node }) calling walk is reported. Mutual recursion and a
          function assigned to a prototype or an object property are held as gaps.
      - language: typescript
        state: partial
        mechanism: internal/hiss script.go scriptScanner and script_header.go, with selfcall.go selfCalls
        rationale: >-
          The JavaScript rules apply unchanged. Type annotations, object types such as
          { [key: string]: Field }, generics, access modifiers and a parameter list wrapped one
          parameter per line are read, and the function is decided from the brace that opens its
          body. Mutual recursion is held as a gap.
      - language: svelte
        state: partial
        mechanism: >-
          internal/hiss script.go svelteScriptLines, then the JavaScript rules over each script
          block that opens at the start of a line
        rationale: >-
          Only the component's script blocks are read, with their line numbers kept, so a call from
          the markup is not a call from the function's own body. Recursion in the markup, such as
          a snippet that renders itself, is held as a gap.
      - language: shell
        state: partial
        mechanism: internal/hiss shell.go reportRecursion over the commands shell_commands.go splits
        rationale: >-
          Direct recursion is reported where a function whose body is a brace group runs its own
          name as a command, including on one line, from a header whose brace opens on the next
          line, in a command substitution and in the background. A call through command, builtin
          or exec reaches a program, never a function, so it is not reported, and the name inside
          quotes, comments, here-document bodies and a case pattern is not a call. A .sh or .bash
          file and an
          extensionless file whose interpreter line names sh, bash, dash or ash are read. Mutual
          recursion needs a call graph and is held as a gap.
  - id: HISS-02
    coverage:
      - language: go
        state: partial
        mechanism: >-
          internal/hiss go_ast.go checkUnboundedFor for loops; go_io.go checkContextSink and
          checkContextlessIO for I/O, with package names resolved through go_imports.go
        rationale: >-
          A for statement without a condition is reported. Outside test files and main.main, a
          context without a deadline reaching any call is reported: context.Background or
          context.TODO, directly or through a local variable, a WithCancel, WithValue or
          signal.NotifyContext derivation of one, and context.WithoutCancel of any context. A
          WithTimeout or WithDeadline derivation, the caller's context parameter and a local
          whose block has closed are not reported. exec.Command, net.Dial, DialTCP, DialUDP,
          DialIP, DialUnix and http.Get, Head, Post, PostForm and NewRequest are reported as
          calls that take no context, through an alias or a dot import, unless a local shadows
          the package name; net.DialTimeout is bounded by its own timeout. The language
          server's loop diagnostic reads the same table (ResolveContextlessCall). gap/ keeps
          what needs types or whole-package data flow: a context returned by a helper, held by
          a package variable or kept in a field, a method without a context such as
          http.Client.Get or net.Dialer.Dial, and file I/O whose API takes no context. Measured
          with golangci-lint 2.14.0 on these fixtures: noctx reports the context-less calls
          with types and also http.Client.Get, contextcheck reports none of them, and neither
          reports a deadline-free context, net.Dialer.Dial or os.ReadFile.
      - language: c
        state: partial
        mechanism: internal/hiss rules.go cFamilyUnboundedLoop
        rationale: >-
          Unbounded loop shapes are reported with arbitrary internal spacing. The I/O-timeout
          half of the axiom has no native check.
      - language: rust
        state: partial
        mechanism: internal/hiss rules.go rustUnboundedLoop
        rationale: >-
          loop and while true are reported, including a labelled loop and a missing space
          before the brace. The I/O-timeout half has no Rust check.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go pythonWhileTrue
        rationale: >-
          while True is reported with arbitrary spacing. Other unbounded shapes such as
          while 1 and the I/O-timeout half are not decided.
      - language: javascript
        state: partial
        mechanism: internal/hiss rules.go cFamilyUnboundedLoop, read by script.go checkInvariants
        rationale: >-
          while (true), while (1), for (;;) and the closing while (1) of a do loop are reported
          with arbitrary spacing, and never inside a string, comment, template literal or regular
          expression, which the literal stripper removes first. A loop whose condition is not a
          literal, such as while (!done), and the I/O-timeout half of the axiom (a fetch without
          an AbortSignal deadline) are held as gaps.
      - language: typescript
        state: partial
        mechanism: internal/hiss rules.go cFamilyUnboundedLoop, read by script.go checkInvariants
        rationale: >-
          The JavaScript loop shapes are reported; a counted retry loop is not. A request without
          a deadline is held as a gap.
      - language: svelte
        state: partial
        mechanism: internal/hiss rules.go cFamilyUnboundedLoop over the script blocks script.go extracts
        rationale: >-
          An unbounded loop in a script block is reported. An {#each} block is markup over a
          finite list, and the loop words in markup text are not script. A fetch without a
          deadline in onMount is held as a gap.
      - language: shell
        state: partial
        mechanism: internal/hiss shell_commands.go isUnboundedShellLoop and checkInvocation, shell.go shellForEver
        rationale: >-
          while true, while :, until false and for ((;;)) are reported, in an extensionless script
          too, and so is a curl transfer with no --max-time or -m that no timeout command wraps,
          since curl sets no overall deadline of its own. A counted loop, a loop over input and a
          bounded transfer are not, nor are the words inside quotes, comments or a here-document.
          A loop whose condition always succeeds without being a constant (while sleep 5) and a
          read without -t are held as gaps.
      - language: systemd
        state: partial
        mechanism: internal/hiss systemd.go checkTimeouts and checkRestart
        rationale: >-
          A Type=oneshot service without TimeoutStartSec= or TimeoutSec= is reported, because
          systemd disables the start timeout for oneshot by default (systemd.service(5)); so is a
          service or socket timeout set to infinity, or to 0 where systemd reads 0 as no timeout
          (every one but TimeoutAbortSec=, whose 0 aborts at once), and a
          service with Restart= other than no whose StartLimitIntervalSec= is 0, which turns off
          the rate limit that stops a restart loop (systemd.unit(5)). A bounded oneshot and a
          restarting daemon under a rate limit are not. A drop-in (.conf) that overrides a unit is
          not read and is held as a gap.
  - id: HISS-04
    coverage:
      - language: go
        state: partial
        mechanism: >-
          internal/hiss go_ast.go checkFuncLOC enforces function length; internal/hiss
          complexity.go measures cyclomatic, cognitive and statement counts and reports them
          without enforcing them; gocyclo, gocognit and funlen in golangci-lint run with the
          thresholds .golangci.yml sets.
        rationale: >-
          The scanner enforces function length only, which positive/ replays. The cyclomatic,
          cognitive and statement caps are measured, not enforced: every measured/ fixture
          (cyclomatic 11 and 12, cognitive 16, 17 and 21, statements 51, two of them
          package-level function literals) must yield a HISS-04 measurement and no violation,
          and the negative/ fixtures at the caps (cyclomatic 10, cognitive 15, statements 50)
          must yield neither, so the limits are pinned from both sides. gap/ keeps what no
          mechanism decides: the length of a test function and of a function literal.
      - language: rust
        state: partial
        mechanism: internal/hiss rules.go braceTracker with the rustFnHeader grammar
        rationale: >-
          Function length is decided by brace tracking. A header is any visibility, including
          pub(super) and pub(in path), followed by any run of const, async, unsafe, safe,
          default and extern qualifiers before fn, so const, unsafe and extern "C" functions
          are measured like any other. The other three caps have no Rust check at all.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go python indentation tracker
        rationale: >-
          Function length is decided by indentation. A line that starts inside an open bracket
          or a string (triple-quoted, or carried by a trailing backslash) continues the
          statement above it and never ends the function, so a column-0 list element or
          multi-line string is measured with its body. A bracket depth the scanner misreads
          resets at the next line starting with a statement-only keyword such as def, class or
          return, which no bracket can hold. The other three caps have no Python check, and
          Python test files carry no length exemption.
      - language: c
        state: partial
        mechanism: internal/hiss rules.go braceTracker
        rationale: >-
          Function length is decided by brace tracking. The other three caps have no native
          check.
      - language: javascript
        state: partial
        mechanism: internal/hiss script.go scriptScanner brace tracking, headers from script_header.go
        rationale: >-
          The length of every named function (a declaration, a bound function or arrow, a method,
          a class field or an object property) is measured from the line its body opens on to its
          closing brace, as for C and Rust, so exactly 60 lines passes and 61 fails. That includes
          a function whose parameter list holds a destructuring pattern, an object type or a
          default object, and a method of an object passed to a call written name({. Anonymous
          callbacks are not measured, like Go function literals, and the cyclomatic, cognitive and
          statement caps have no script check. A file with a line longer than 1024 bytes is
          minified output, and a file whose braces the scanner misread does not balance: either is
          declined and reported as unscanned source, never as clean.
      - language: typescript
        state: partial
        mechanism: internal/hiss script.go scriptScanner brace tracking, headers from script_header.go
        rationale: >-
          Methods are measured like functions, and the signature lines of a wrapped parameter list
          lend the function no length, including the destructured props of a React component
          wrapped one per line. An apostrophe or a URL in JSX text is text, not a string or a
          comment, so the component's braces still balance. The complexity caps are held as a gap.
      - language: svelte
        state: partial
        mechanism: internal/hiss script.go scriptScanner over the script blocks svelteScriptLines keeps
        rationale: >-
          A function in a script block is measured; markup lines never join one. A long inline
          handler written in the markup is held as a gap.
      - language: shell
        state: partial
        mechanism: internal/hiss shell.go closeDeeper
        rationale: >-
          A function whose body is a brace group is measured from the line its brace opens on to
          the line it closes on, so a header written above the brace adds nothing; 61 lines is
          reported and 60 is not. A function whose body is a subshell, ( ... ), is not measured
          and is held as a gap, and the complexity caps are not measured for shell.
  - id: HISS-08
    coverage:
      - language: c
        state: partial
        mechanism: internal/hiss rules.go hasBannedCall
        rationale: >-
          gets, strcpy and sprintf are refused, with arbitrary spacing before the argument
          list. Other unsafe native primitives are not decided.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go hasBannedCall
        rationale: >-
          eval and exec are refused as bare calls. A method of the same name reached through
          a selector is not a builtin and is not reported. Dynamic import and compile are not
          decided.
      - language: go
        state: unsupported
        mechanism: none in internal/hiss; forbidigo in golangci-lint fences the primitives
        rationale: >-
          The scanner carries no HISS-08 case for Go. plugin.Open, os.StartProcess and the
          syscall exec family are refused by forbidigo in the same gate, so the fixtures are
          held as gaps for the scanner rather than as coverage it does not have.
      - language: javascript
        state: partial
        mechanism: internal/hiss script.go checkInvariants (hasCall and scriptImpliedEval)
        rationale: >-
          eval, the Function constructor and setTimeout or setInterval given a string are reported
          as calls. A method named eval, a call through a selector (interpreter.eval), $eval and
          the words inside literals are not. Indirect eval through an alias is held as a gap.
      - language: typescript
        state: partial
        mechanism: internal/hiss script.go checkInvariants (hasCall and scriptImpliedEval)
        rationale: >-
          The JavaScript calls are reported; a typed interpreter's eval method is not. The
          indirect (0, eval)(code) is held as a gap.
      - language: svelte
        state: partial
        mechanism: internal/hiss script.go checkInvariants over the script blocks
        rationale: >-
          eval in a script block, including a reactive statement, is reported; the word in markup
          text is not. eval in a markup expression runs code but is held as a gap, since only
          script blocks are read.
      - language: shell
        state: partial
        mechanism: internal/hiss shell_commands.go checkInvocation
        rationale: >-
          eval, text piped into a shell that reads its script from standard input (curl ... | sh,
          including through sudo), and a process substitution sourced or run as a script are
          reported. A function named evaluate, the word in text, a downloaded script that is
          checked and run as a file, and the bars of a case pattern list or of a [[ ]] regular
          expression are not. A command string handed to sh -c is evaluated too but is held as a
          gap.
      - language: ansible
        state: partial
        mechanism: internal/hiss ansible.go checkAnsibleCommand
        rationale: >-
          A command, shell, raw or script task, under its short or ansible.builtin name, that sets
          no changed_when, creates or removes reports a change on every run, whatever the host's
          state, so the play's outcome is not determined by the state it converges (ansible-lint
          no-changed-when); it is reported in a play's tasks, a block's sections and handlers.
          changed_when and a creates or removes argument, as a key or a free-form word, are not
          reported. The Windows command modules, and a task file included from outside a role's
          tasks/ or handlers/ directory, are held as gaps.
  - id: HISS-07
    coverage:
      - language: go
        state: partial
        mechanism: >-
          internal/hiss go_ast.go checkBlankAssign and checkAbort (os.Exit and
          http.ErrAbortHandler resolved through go_imports.go), with errcheck in golangci-lint
        rationale: >-
          A discarded call result is reported. Discarding a non-call value is not, because it
          cannot carry an error. A bare call statement that drops an error needs type
          information this syntax scanner does not build and is held as a gap; errcheck
          decides that case with types in the same gate. The abort policy (owner decision
          Q-014) reports panic and os.Exit, including os.Exit through an alias or dot import,
          outside test files and main.main; os.Exit passed as a value is not a call and is not
          reported. A panic whose single argument is net/http.ErrAbortHandler, reached through
          a plain, aliased or dot import, is not reported, because net/http documents it as
          the way a handler aborts its response and recovers it (AbortsHTTPResponse, issue
          #331). A same-named local, another package's ErrAbortHandler, a package name
          shadowed inside the enclosing declared function and a wrapped sentinel are still
          reported; a parameter of a package-level function literal is not seen as shadowing. The sentinel is recovered only on the
          goroutine net/http runs the handler on, and which goroutine runs a function is not
          visible in syntax, so gap/abort-handler-goroutine.go records the sentinel panicked
          on a goroutine the code started itself, which ends the process unreported.
          log.Fatal and the other wrappers that exit are held as a gap. Measured with
          golangci-lint 2.14.0 and this repository's .golangci.yml: errcheck reports
          gap/bare-call.go as 'Error return value of os.Remove is not checked' and leaves
          gap/log-fatal.go unreported.
      - language: rust
        state: partial
        mechanism: >-
          internal/hiss rules.go rustUnwrapCall, rustExpectCall and checkRustAbort, scoped by
          rustTestScope
        rationale: >-
          unwrap and expect are reported in production code with arbitrary spacing. The abort
          policy (owner decision Q-014) reports panic!, todo!, unimplemented!, unreachable!,
          process::exit and process::abort outside test code and the top-level fn main. Test
          code is a Cargo test path, a file under #![cfg(test)], or exactly the item a
          #[cfg(test)] or #[test] attribute annotates, so code after a closed test module is
          production code again. The assert family is held as a gap, and errors discarded by
          other means are not decided by a line scanner.
      - language: python
        state: partial
        mechanism: internal/hiss rules.go pythonBareExcept and checkPythonAbort
        rationale: >-
          A bare except is reported. The abort policy (owner decision Q-014) reports sys.exit
          outside test files (pytest discovery names, conftest.py, tests/ and test/), a
          package's __main__.py, the top-level if __name__ == "__main__" block and the
          top-level def main. raise SystemExit and an exit imported under another name are
          held as a gap.
      - language: javascript
        state: partial
        mechanism: internal/hiss script.go checkErrors
        rationale: >-
          An empty catch block, on one line or closed on a later line, is reported even when it
          holds only a comment, because a comment handles nothing. A promise .catch whose handler
          is empty is reported, and under the abort policy (owner decision Q-014) so are
          process.exit and process.abort outside a test file (*.test.*, *.spec.*, __tests__,
          test, tests), module scope and a top-level function named main, a function with a
          destructured parameter included. A wrapped rethrow, a reported rejection and an exit in
          the entry point are not. A floating promise and a named no-op handler are held as gaps.
      - language: typescript
        state: partial
        mechanism: internal/hiss script.go checkErrors
        rationale: >-
          A typed catch parameter (catch (error: unknown)) is read like an untyped one, so an
          empty block with a comment is reported and a logged error is not. A floating promise is
          held as a gap.
      - language: svelte
        state: partial
        mechanism: internal/hiss script.go checkErrors over the script blocks
        rationale: >-
          A swallowed rejection in a script block is reported; a rejection shown to the user is
          not. A handler in the markup that drops a promise is held as a gap.
      - language: shell
        state: partial
        mechanism: internal/hiss shell.go reportStrictMode, shell_commands.go checkCommand
        rationale: >-
          A script with an interpreter line that never enables errexit and nounset, and under
          Bash pipefail, is reported once at its first line, whether the options are given to set
          as -euo pipefail or as long names, or on the interpreter line. POSIX sh is not required
          to set pipefail, which shells still deployed do not all support. A failure discarded by
          || true or || : is reported. A library without an interpreter line runs under the
          options of the script that sources it and is not required to set them. set +e around
          an unchecked command and a failure discarded through a brace group are held as gaps.
      - language: systemd
        state: partial
        mechanism: internal/hiss systemd.go checkExec
        rationale: >-
          An Exec*= command of a service or socket whose prefix holds "-" is reported, alone or
          combined with other prefixes, because systemd records its failure but treats it as
          success (systemd.service(5)); a "-" inside an argument and a commented setting are not.
          Shell inside an Exec command is not read and is held as a gap.
      - language: ansible
        state: partial
        mechanism: internal/hiss ansible.go checkAnsibleFailure and pipesWithoutPipefail
        rationale: >-
          ignore_errors: true and failed_when: false on a task or block that does not register
          its result discard the failure and are reported (ansible-lint ignore-errors), and so is
          a shell task that pipes without set -o pipefail, whose status is the last command's
          (ansible-lint risky-shell-pipe). A registered result, a pipe inside quotes or Jinja and
          a PowerShell executable are not. A task file included from outside a role's tasks/ or
          handlers/ directory is not recognised and is held as a gap.
  - id: HISS-09
    coverage:
      - language: rust
        state: partial
        mechanism: >-
          internal/hiss rust_safety.go checkRustUnsafe: rustUnsafeBlock and rustUnsafeFnHeader,
          proven by hasSafetyComment on the line, above it or above the first line of its
          statement (rustProofScope), or for an unsafe fn by a rustdoc # Safety section
        rationale: >-
          Follows clippy's undocumented_unsafe_blocks and missing_safety_doc. An unsafe block
          without a SAFETY proof on its line, directly above it or directly above the statement
          rustfmt wrapped it in (a let, an assignment, call arguments, a method chain) is
          reported; a proof above a match, an if condition, a struct literal field or the
          previous statement does not reach it. An unsafe fn of any visibility or qualifier
          without a rustdoc # Safety section or a SAFETY comment is reported, including a trait
          method declaration; a method implementing a trait is not, since the trait documents the
          contract. The marker must be upper-case SAFETY: and a blank line detaches it, both
          stricter than clippy. unsafe impl, unsafe trait and unsafe extern blocks are not
          checked (gap fixtures). Whether a proof is truthful is not decided by any check.
      - language: go
