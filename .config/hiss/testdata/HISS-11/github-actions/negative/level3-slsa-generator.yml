# HISS-11 negative: the provenance comes from the SLSA GitHub generator's reusable workflow,
# called by a release tag, which isolates it from the build job: Build Level 3. The build
# signs its checksums with cosign. A policy declaring Level 3 and enforce_cosign passes the
# supply-chain audit (internal/adopt.AuditSupplyChain).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
      - run: make dist
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - id: hash
        run: echo "hashes=$(sha256sum dist/*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
