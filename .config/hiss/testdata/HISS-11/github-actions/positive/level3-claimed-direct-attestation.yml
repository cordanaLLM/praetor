# HISS-11 positive: the release is built and its provenance attested in one job. GitHub
# documents an artifact attestation made this way as SLSA Build Level 2, so a policy that
# declares Level 3 fails the supply-chain audit (internal/adopt.AuditSupplyChain, #330).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
