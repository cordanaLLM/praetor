# HISS-11 gap: the workflow attests and signs a file it never releases, and uploads the
# archives unattested. The audit reads which steps run, not what they cover or what the
# release published, so it measures Level 3 and cosign signing here and passes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
      - run: make dist
      - run: cosign sign-blob --yes --bundle README.md.sigstore.json README.md
      - id: hash
        run: echo "hashes=$(sha256sum README.md | base64 -w0)" >> "$GITHUB_OUTPUT"
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
