# HISS-10 negative: the workflow denies rustc warnings for every cargo step through RUSTFLAGS,
# clippy with -D warnings, and runs go vet beside the Go build. The build-warnings audit
# (internal/adopt.AuditBuildWarnings) passes.
name: CI

on:
  pull_request:

env:
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: go vet ./...
      - run: go test -race ./...
