# golangci-lint v2 configuration for cordanaLLM/praetor.
#
# HISS-10 ("zero warnings") is only real if the linters that produce the warnings
# actually run. This configuration is executed by `make lint`, the CI lint step and the
# lefthook pre-push hook, always through
#   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run
# because a binary installed with an older Go toolchain refuses this Go 1.27 tree.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - govet
    - staticcheck
    - errcheck # HISS-07: every error is handled
    - errorlint # HISS-07: %w wrapping and errors.Is/As
    - nilerr # HISS-07: never return nil after a non-nil error
    - unused
    - ineffassign
    - wastedassign
    - copyloopvar
    - bodyclose # leaked response bodies
    - noctx # HISS-02: no request without a context
    - contextcheck # HISS-02: no context.Background() inside a context-carrying call tree
    # Complexity: the HISS-04 caps
    - gocyclo
    - gocognit
    - funlen
    # Structure
    - gochecknoinits # no hidden init() side effects
    - forbidigo # unaudited exec / http entry points
    - nolintlint # HISS-10: a suppressed warning is a hidden warning

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    # min-complexity is the value a function must EXCEED to be reported: the message reads
    # "is high (> N)". Setting it to the declared cap therefore permits exactly one step past
    # the cap, so these two lines currently allow cyclomatic 11 and cognitive 16 while
    # HISS-04 declares 10 and 15. Verified with boundary fixtures: at min-complexity 11 a
    # function at cyclomatic 11 produced no finding and only 12 was reported.
    #
    # Correcting them to 10 and 15 reports 57 existing functions (50 cyclomatic, 7
    # cognitive) that sit exactly on the boundary, so the correction lands with that
    # refactor rather than ahead of it. Tracked as BUG-830.
    gocyclo:
      min-complexity: 11 # HISS-04: McCabe cyclomatic <= 10 (off by one, see above)
    gocognit:
      min-complexity: 16 # HISS-04: cognitive <= 15 (off by one, see above)
    funlen:
      lines: 75 # HISS-04: function LOC <= 75
      statements: 50 # HISS-04: statements <= 50
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    # HISS-10 is only real if suppressions are visible. A bare `//nolint` disables every
    # enabled linter for its scope, and since HISS-04's complexity caps and half of HISS-07
    # exist only inside golangci-lint, one unexplained comment can remove three invariants.
    # Each suppression must therefore name the linters it disables and say why, and a
    # suppression that no longer suppresses anything is itself reported.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      analyze-types: true
      forbid:
        # `pkg` is matched against the import path and only honoured with analyze-types,
        # so these rules fire on the real os/exec and net/http symbols, not on any
        # local identifier that happens to be spelled the same way.
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: use internal/util.RunCommand, RunGit or RunGitBytes, or RunGitProbe for a read-only inspection of a repository Praetor does not own; they enforce a context deadline (HISS-02) and are the single audited exec entry point
        - pattern: ^http\.DefaultClient$
          pkg: ^net/http$
          msg: http.DefaultClient has no timeout; build an http.Client with an explicit timeout (HISS-02)
        - pattern: ^http\.(Get|Post|Head|PostForm)$
          pkg: ^net/http$
          msg: these helpers use http.DefaultClient and carry no context or timeout; use http.NewRequestWithContext with an explicit client (HISS-02)
        # HISS-08 had no Go rule at all: the invariant bans dynamic code loading and unsafe
        # primitives, and the scanner implemented that only for C (gets/strcpy/sprintf) and
        # Python (eval/exec). These are Go's equivalents. None is used in this tree today,
        # so the rules are a fence rather than a cleanup.
        - pattern: ^plugin\.Open$
          pkg: ^plugin$
          msg: loading a Go plugin executes code chosen at runtime, which HISS-08 forbids; link the capability in or dispatch through an audited interface
        - pattern: ^os\.StartProcess$
          pkg: ^os$
          msg: os.StartProcess bypasses the audited exec boundary and carries no context; use internal/util.RunCommand (HISS-08, HISS-02)
        - pattern: ^syscall\.(Exec|ForkExec)$
          pkg: ^syscall$
          msg: direct syscall execution replaces or forks the process outside the audited exec boundary (HISS-08)

  exclusions:
    generated: lax
    rules:
      # internal/util owns the audited exec wrapper that everything else must use.
      - path: internal/util/
        linters:
          - forbidigo
      # Tests build sandboxed git and PATH fixtures, and table-driven 3D tests are long
      # by construction; the complexity caps target production control flow.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - forbidigo
          - noctx

formatters:
  enable:
    - gofmt
