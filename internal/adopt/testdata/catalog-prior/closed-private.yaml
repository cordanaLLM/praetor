id: "closed-private"
name: "Closed Source & Confidential Systems"
description: "Proprietary internal systems with strict confidentiality, leak prevention, IP isolation, and multi-party review requirements"
runtime: "polyglot"

complexity:
  max_cyclomatic: 10
  max_cognitive: 15
  max_func_loc: 75
  max_statements: 50

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 2
  dismiss_stale_reviews: true

supply_chain:
  slsa_level: 3
  enforce_cosign: true
  require_sbom: true

linters:
  - "gitleaks"
  - "semgrep"
  - "trivy"
  - "govet"

devcontainer_features:
  - "ghcr.io/devcontainers/features/common-utils:2"
