---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    # Every cargo step builds with rustc warnings as errors (HISS-10), the test
    # build included; praetorctl audit fails a cargo lane without it.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      # rustup ships on the hosted runner image, so the toolchain needs no
      # third-party action.
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
