---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # jvm-service matches Maven and Gradle builds alike, so the step runs
      # whichever the repository carries, preferring a checked-in wrapper over
      # the runner's own install.
      - name: Build and verify
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B verify
          elif [ -f ./mvnw ]; then
            sh ./mvnw -B verify
          elif [ -f pom.xml ]; then
            mvn -B verify
          elif [ -x ./gradlew ]; then
            ./gradlew check
          elif [ -f ./gradlew ]; then
            sh ./gradlew check
          elif [ -f build.gradle ] || [ -f build.gradle.kts ] ||
            [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            if command -v gradle >/dev/null 2>&1; then
              gradle check
            else
              echo "Gradle build has no gradlew wrapper and the runner" \
                "no gradle; commit one: gradle wrapper" >&2
              exit 1
            fi
          else
            echo "no Maven or Gradle build found" >&2
            exit 1
          fi
