# gitleaks configuration for cordanaLLM/praetor (HISS-12).
#
# Extends the upstream default rules; nothing is disabled. These rules add the
# forge token shapes the defaults lack (Gitea, Forgejo); GitHub and GitLab come
# from the defaults.
[extend]
useDefault = true

[[rules]]
id = "gitea-access-token"
description = "Gitea, Forgejo or Codeberg access token or personal secret"
regex = '''(?i)(?:gitea|forgejo|codeberg)[\w.-]{0,30}?(?:token|pat|secret|password|key)[\w.-]{0,10}["']?\s*(?:[:=]|:=|=>)\s*["']?([0-9a-f]{40})\b'''
secretGroup = 1
keywords = [
    "gitea",
    "forgejo",
    "codeberg",
]

[[rules]]
id = "forge-token-authorization-header"
description = "Forge token in authorization header"
regex = '''(?i)authorization["']?\s*[:=]\s*["']?token\s+([0-9a-f]{40})\b'''
secretGroup = 1
keywords = [
    "authorization",
]

[[rules]]
id = "forge-token-in-url"
description = "Forge token in URL"
regex = '''https?://[^\s/:@]{1,100}:([0-9a-f]{40})@'''
secretGroup = 1
keywords = [
    "http",
]

# The HISS-12 corpus demonstrates that gitleaks catches leaked secrets, so its positive
# fixtures must contain strings that look exactly like leaked secrets. Scanning them reports
# the evidence as the defect, and every push carrying the corpus would fail.
#
# The exemption is a path rather than a set of fingerprints because this repository
# squash-merges: a fingerprint binds the commit that introduced the finding, so every one of
# them would stop matching the moment the branch is squashed and main would fail instead.
#
# The cost is stated rather than hidden: a real credential committed under this path would not
# be reported. The path is therefore as narrow as it can be -- one rule's fixture directory,
# which holds nothing but deliberately fake secrets, and whose contents the coverage gate
# replays on every run.
[[allowlists]]
description = "HISS-12 fixture corpus: deliberately fake secrets that exist to prove the rule fires"
paths = ['''^\.config/hiss/testdata/HISS-12/''']
