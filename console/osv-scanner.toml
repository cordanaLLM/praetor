reason = "Category C (10 days from 2026-11-06; first entered 2026-10-28 in the root file, which never covered console/pnpm-lock.yaml). deepmerge 4.3.1, prototype poisoning in mergeObject (low), no patched release (4.3.1 is still the latest and the advisory lists no patched version, re-checked 2026-11-06); reached only through @sveltejs/vite-plugin-svelte 7.3.1 (latest, still requires deepmerge ^4.3.1), a build-time devDependency of console/, never shipped to a browser. The vulnerable path is closed in-tree: console/patches/deepmerge@4.3.1.patch refuses an own __proto__ key (console/pnpm-workspace.yaml), pinned by console/scripts/deepmerge-patch.test.ts. The entry stays only because the scanner matches the version, not the patch. Re-check trigger: a deepmerge release above 4.3.1, a patched version on the advisory, or a vite-plugin-svelte release without deepmerge; then remove entry, patch and test. Order engine-minimatch-reissued-alerts-20261106."
