# cordanaLLM/praetor Canonical Configuration Manifest
# Schema: https://standards.cordana.ai/schemas/v1/standards.json
version: 1
repository:
  owner: "cordanaLLM"
  name: "praetor"
  visibility: "public"
  description: "Enterprise Fleet Governance, Repository-as-Code & Universal AI Agent Engineering Engine"
  homepage: "https://standards.cordana.ai"
  topics:
    - "governance"
    - "repository-as-code"
    - "ai-agent-governance"
    - "mcp-server"
    - "hiss-16"
    - "devcontainers"
    - "slsa-level-3"
    - "renovate-presets"

# Ed25519 Exit-0 receipt trust anchor.
#
# `praetorctl gate run` signs .standards-receipt.json with the private key resolved from
# PRAETOR_RECEIPT_KEY or ~/.config/praetor/receipt.key, and `praetorctl gate verify`
# accepts a receipt only when it was signed by the key pinned here. Generate the pair with
# `praetorctl gate keygen` and paste the printed public key below; until it is pinned,
# `gate verify` fails closed with "no pinned receipt public key".
receipt:
  public_key: "213f9534a662075308e2087694985eff7590386760a19609b08437412b46e9d8"

profiles:
  - "framework"

facets:
  - "security:high"
  - "api:public-contract"
  - "docs:seo-portal"
  - "agent:sandboxed"
  - "tooling:vscode-extension"

# Standard overrides only increase strictness. The explicit review mode below
# temporarily permits single-maintainer operation; all other gates stay enforced.
overrides:
  complexity:
    max_cyclomatic: 10
    max_cognitive: 15
    max_func_loc: 75
    max_statements: 50
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    # Owner-approved 2026-09-13: restore independent when a maintainer or review
    # bot can approve. Keep the required count so restoration retains the minimum.
    review_mode: single_maintainer
    dismiss_stale_reviews: true
  supply_chain:
    slsa_level: 3
    enforce_cosign: true
    require_sbom: true
  ci:
    diff_aware_filtering: true
    skip_heavy_gates_on_docs_or_state: true

# Text register per audience surface and task class (ADR-0010). Task keys are target_tasks
# labels of .config/models/routing.yaml; every label without a row writes in the register
# of surfaces.agent. No output budget (max_tokens) is set: a budget comes from measured
# dispatch data. `praetorctl compile-context` renders this section into AGENTS.md.
register:
  surfaces:
    forge: social
    docs: docs
    agent: internal
  tasks:
    architecture_synthesis: docs
    function_docstrings: docs
    commit_message_synthesis: social
    waiver_signoff: social
  evidence:
    inline_max_lines: 58
    inline_max_tokens: 1500

# Framework capability demand declarations towards upstream Golusoris
needs:
  required:
    - "config.yaml"
  optional:
    - "clikit.cli"
    - "mcp.server"
    - "crypto.receipt"
    - "git.worktree"
    - "ast.analyzer"
    - "telemetry.logging"
