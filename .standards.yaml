# cordanaLLM/praetor Canonical Configuration Manifest
# Schema: the Manifest type in internal/config/config.go; LoadManifest rejects unknown keys.
version: 1
repository:
  owner: "cordanaLLM"
  name: "praetor"
  # Forge hosting the repository (github, forgejo or gitlab): selects the Paperclip push rows.
  forge: "github"
  visibility: "public"
  description: "Enterprise Fleet Governance, Repository-as-Code & Universal AI Agent Engineering Engine"
  homepage: "https://cordanallm.github.io/praetor/"
  topics:
    - "governance"
    - "repository-as-code"
    - "ai-agent-governance"
    - "mcp-server"
    - "hiss"
    - "devcontainers"
    - "slsa-level-3"
    - "renovate-presets"

# Ed25519 Exit-0 receipt trust anchor.
#
# `praetorctl gate run` signs .standards-receipt.json with the private key resolved from
# PRAETOR_RECEIPT_KEY or ~/.config/praetor/receipt.key, and `praetorctl gate verify`
# accepts a receipt only when it was signed by the key pinned here. Generate the pair with
# `praetorctl gate keygen` and paste the printed public key below; until it is pinned,
# `gate verify` fails closed with "no pinned receipt public key".
receipt:
  public_key: "213f9534a662075308e2087694985eff7590386760a19609b08437412b46e9d8"

profiles:
  - "framework"

facets:
  - "security:high"
  - "api:public-contract"
  - "docs:seo-portal"
  - "agent:sandboxed"
  - "tooling:vscode-extension"

# Editors this repository dogfoods: `praetorctl adopt` and `praetorctl editors generate|verify`
# resolve this list, and `make editors-verify` checks it on every heavy CI run (BUG-439).
# Neovim is left out although .nvim.lua and lua/standards.lua are tracked: its module is
# compared byte for byte, and its language-server block exists only when bin/standards-lsp is
# built, so a fresh checkout and a built one would disagree. The Neovim reference module under
# editors/ is generator output that `make editors-reference-verify` checks instead.
editors:
  - "universal"
  - "vscode"

# Standard overrides only increase strictness. The explicit review mode below
# temporarily permits single-maintainer operation; all other gates stay enforced.
overrides:
  complexity:
    max_cyclomatic: 10
    max_cognitive: 15
    max_func_loc: 75
    max_statements: 50
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    # Owner-approved 2026-09-13: restore independent when a maintainer or review
    # bot can approve. Keep the required count so restoration retains the minimum.
    review_mode: single_maintainer
    dismiss_stale_reviews: true
  supply_chain:
    slsa_level: 3
    enforce_cosign: true
    require_sbom: true
  ci:
    diff_aware_filtering: true
    skip_heavy_gates_on_docs_or_state: true

# Declared per-file exceptions (AGENTS.md rule 14): one rule, one file, a reason and an expiry
# at most 90 days ahead; an expired entry fails its gate like a missing one.
exceptions:
  - rule: "HISS-11"
    path: ".github/workflows/release-binaries.yml"
    reason: "release provenance not yet built by an isolated Level 3 builder; the release job reaches Level 2 (#799)"
    expires: "2027-01-04"

# Text register per audience surface and task class (ADR-0010). Task keys are target_tasks
# labels of .config/models/routing.yaml; every label without a row writes in the register
# of surfaces.agent. No output budget (max_tokens) is set: a budget comes from measured
# dispatch data. `praetorctl compile-context` renders this section into AGENTS.md.
register:
  surfaces:
    forge: social
    docs: docs
    agent: internal
  tasks:
    architecture_synthesis: docs
    function_docstrings: docs
    commit_message_synthesis: social
    waiver_signoff: social
  evidence:
    inline_max_lines: 58
    inline_max_tokens: 1500
  # This repository's own forge conventions, rendered after the engine-universal social
  # form: .github/pull_request_template.md, its receipt fence and the changelog.d lane.
  conventions:
    social: PR template, receipt fence and changelog fragment unchanged
  # Non-Markdown agent text coverage. Expected count + aggregate digest bind the
  # complete prompt, hook-diagnostic, and MCP runtime inventory selected below;
  # deleting one value or selector fails the gate.
  sources:
    expected: 249
    not_applicable: 127
    sha256: "sha256:0f97a15469258ce8c9e6a550829eafb2c26367514d115727b2d5d0bee72758e1"
    inputs:
      - path: ".paperclip/harness.json"
        surface: prompts
        kind: message
        format: json
        selector: "operating_contract.*"
      - path: ".paperclip/harness.json"
        surface: prompts
        kind: message
        format: json
        selector: "invariants.*"
      - path: ".config/semgrep/hiss-invariants.yml"
        surface: hooks
        kind: message
        format: yaml
        selector: "rules.*.message"
      - path: ".config/agent/hooks"
        surface: hooks
        kind: message
        format: python
      - path: ".config/lefthook/scripts"
        surface: hooks
        kind: message
        format: python
      - path: "cmd/standards-mcp"
        surface: mcp
        kind: message
        format: go
        selector: "mcp.descriptions"
      - path: "cmd/standards-mcp"
        surface: mcp
        kind: message
        format: go
        selector: "mcp.outputs"

# User-discoverable surfaces and the guide that describes each one. A change that touches a
# surface without editing its guide fails `praetorctl docs references --base=<rev>` unless it
# carries a waiver (docs/guides/documentation-drift.md). Everything unlisted is internal: keep
# the list narrow, so a finding is worth reading.
docs_surfaces:
  - name: "archetype catalog"
    paths:
      - ".config/archetypes/*.yaml"
    docs:
      - "docs/guides/archetype-authoring.md"
  - name: "facet catalog"
    paths:
      - ".config/archetypes/facets/*.yaml"
    docs:
      - "docs/guides/archetype-authoring.md"
  - name: "flavor definitions"
    paths:
      - "internal/flavor/definitions.go"
    docs:
      - "docs/guides/archetype-authoring.md"
      - "docs/guides/onboarding.md"
  - name: "effective policy resolution"
    paths:
      - "internal/config/effective*.go"
    exclude:
      - "internal/config/*_test.go"
    docs:
      - "docs/guides/effective-policy.md"
  - name: "text register policy"
    paths:
      - "internal/config/register*.go"
    exclude:
      - "internal/config/*_test.go"
    docs:
      - "docs/guides/text-register.md"
  - name: "HISS rule matchers"
    paths:
      - "internal/hiss/rules.go"
      - "internal/hiss/go_callgraph.go"
    docs:
      - "docs/standards/**"
  - name: "HISS-20 coverage engine"
    paths:
      - "internal/hisscoverage/**"
    docs:
      - "docs/guides/**"
      - "docs/standards/**"
  - name: "git hook scripts"
    paths:
      - ".config/lefthook/scripts/*.py"
    exclude:
      - ".config/lefthook/scripts/test_*.py"
    docs:
      - "docs/guides/git-hooks.md"
  - name: "hook configuration"
    paths:
      - "lefthook.yml"
    docs:
      - "docs/guides/git-hooks.md"
  - name: "development MCP server"
    paths:
      - "cmd/standards-mcp/**"
    docs:
      - "docs/guides/development-mcp.md"
  - name: "gating pipeline"
    paths:
      - "internal/gating/pipeline.go"
    docs:
      - "docs/guides/adoption-verification.md"
  - name: "managed README governance contract"
    paths:
      - "internal/readmegovernance/**"
      - "internal/adopt/governance.go"
      - "cmd/standardsctl/audit_readme.go"
    docs:
      - "docs/guides/adoption-verification.md"
  - name: "wish ledger"
    paths:
      - "internal/wishes/**"
    docs:
      - "docs/guides/wishes-and-polls.md"
  - name: "state ledger"
    paths:
      - "internal/state/**"
    docs:
      - "docs/guides/state-ledger-integrity.md"
  - name: "agent-hook entrypoint"
    paths:
      - "internal/agenthook/*.go"
      - "cmd/standardsctl/hook.go"
    exclude:
      - "internal/agenthook/*_test.go"
    docs:
      - "docs/guides/agent-hooks.md"
  - name: "platform neutrality gate"
    paths:
      - ".github/workflows/portability.yml"
      - "scripts/portability_selftest.py"
    docs:
      - "docs/standards/hiss-21-platform-neutrality.md"
  - name: "workstation install/status"
    paths:
      - "internal/workstation/**"
      - "cmd/standardsctl/workstation.go"
      - "scripts/dev_install.py"
    docs:
      - "docs/guides/workstation-update.md"
  - name: "Markdown documentation governance"
    paths:
      - "tools/markdownlint/**"
      - "tools/docsurface/**"
      - "internal/adopt/documentation.go"
      - "internal/cifilter/filter.go"
      - ".github/workflows/praetor-docs.yml"
    docs:
      - "docs/guides/documentation-governance.md"
  - name: "Go API compatibility gate"
    paths:
      - "tools/apicompat/**"
      - "internal/adopt/api_compat.go"
      - "cmd/standardsctl/audit_api_compat.go"
      - ".github/workflows/praetor-api.yml"
    exclude:
      - "tools/apicompat/*_test.go"
    docs:
      - "docs/guides/api-compatibility.md"
  - name: "documentation reference and drift gate"
    paths:
      - "internal/docsref/*.go"
      - "internal/config/docs_surfaces.go"
      - "cmd/standardsctl/docs_references.go"
    exclude:
      - "internal/docsref/*_test.go"
    docs:
      - "docs/guides/documentation-drift.md"
  - name: "clang-tidy coverage gate and exceptions list"
    paths:
      - "internal/tidycoverage/*.go"
      - "internal/config/exceptions.go"
      - "internal/config/clang_tidy.go"
      - "cmd/standardsctl/tidy_coverage.go"
    exclude:
      - "internal/tidycoverage/*_test.go"
    docs:
      - "docs/guides/clang-tidy-coverage.md"
  - name: "Go vulnerability gate"
    paths:
      - "internal/govuln/*.go"
      - "internal/config/security_policy.go"
      - "cmd/standardsctl/security.go"
    exclude:
      - "internal/govuln/*_test.go"
    docs:
      - "docs/guides/adoption-verification.md"
  - name: "generated artefacts"
    paths:
      - "internal/generated/*.go"
      - "internal/config/generated.go"
      - "cmd/standardsctl/ci_generated.go"
      - "cmd/standardsctl/docs_readme.go"
    exclude:
      - "internal/generated/*_test.go"
    docs:
      - "docs/guides/generated-artefacts.md"

# Framework capability demand declarations
needs:
  required:
    - "config.yaml"
  optional:
    - "clikit.cli"
    - "mcp.server"
    - "crypto.receipt"
    - "git.worktree"
    - "ast.analyzer"
    - "telemetry.logging"
