# cordanaLLM/praetor Canonical Configuration Manifest
# Schema: https://standards.cordana.ai/schemas/v1/standards.json
version: 1
repository:
  owner: "cordanaLLM"
  name: "praetor"
  visibility: "public"
  description: "Enterprise Fleet Governance, Repository-as-Code & Universal AI Agent Engineering Engine"
  homepage: "https://standards.cordana.ai"
  topics:
    - "governance"
    - "repository-as-code"
    - "ai-agent-governance"
    - "mcp-server"
    - "hiss-16"
    - "devcontainers"
    - "slsa-level-3"
    - "renovate-presets"

profiles:
  - "framework"

facets:
  - "security:high"
  - "api:public-contract"
  - "docs:seo-portal"
  - "agent:sandboxed"

# Overrides (strictness can only be increased, never reduced)
overrides:
  complexity:
    max_cyclomatic: 10
    max_cognitive: 15
    max_func_loc: 75
    max_statements: 50
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    dismiss_stale_reviews: true
  supply_chain:
    slsa_level: 3
    enforce_cosign: true
    require_sbom: true
  ci:
    diff_aware_filtering: true
    skip_heavy_gates_on_docs_or_state: true

# Framework capability demand declarations towards upstream Golusoris
needs:
  required:
    - "config.yaml"
  optional:
    - "clikit.cli"
    - "mcp.server"
    - "crypto.receipt"
    - "git.worktree"
    - "ast.analyzer"
    - "telemetry.logging"


