apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: praetor-fleet-sentinel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cordanaLLM/praetor.git
    targetRevision: HEAD
    path: deploy/helm/praetor
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: praetor-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
