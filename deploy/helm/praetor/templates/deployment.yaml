apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "praetor.fullname" . }}
  labels:
    {{- include "praetor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "praetor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "praetor.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "praetor.serviceAccountName" . }}
      # The binary has no Kubernetes client, so it never reads a service account
      # token; mounting one would hand the container a credential it cannot use.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "praetor.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http-probes
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.tmpfs.enabled }}
          volumeMounts:
            - name: tmpfs
              mountPath: {{ .Values.tmpfs.mountPath }}
          {{- end }}
      {{- if .Values.tmpfs.enabled }}
      volumes:
        - name: tmpfs
          emptyDir:
            medium: Memory
      {{- end }}
