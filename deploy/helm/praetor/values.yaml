replicaCount: 1

image:
  repository: ghcr.io/cordanallm/praetor
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

# Secrets used to pull the image, rendered on the pod spec:
# imagePullSecrets:
#   - name: ghcr-credentials
imagePullSecrets: []
# Replaces the chart name inside every generated resource name and label.
nameOverride: ""
# Replaces the generated "<release>-<chart>" resource name outright.
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Empty means the release-scoped name, so two releases in one namespace do
  # not collide. With create=false and no name, the pod uses "default".
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /livez
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 2
  periodSeconds: 5

tmpfs:
  enabled: true
  mountPath: /tmp
