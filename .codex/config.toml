# Resolve the active worktree from Codex's session directory, including nested starts.
# See docs/guides/development-mcp.md.
[mcp_servers.praetor-dev]
command = "sh"
args = ["-c", 'exec python3 "$(git rev-parse --show-toplevel)/scripts/dev_mcp.py" serve']
startup_timeout_sec = 120
tool_timeout_sec = 120
