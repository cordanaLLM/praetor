type: fixed
title: util.RunCommand and util.RunGit return standard output only and carry a failure's standard error in the error, strip the git repository variables (GIT_DIR, GIT_INDEX_FILE and the rest git itself clears) from inherited child environments so a hook's repository cannot be written through the gate's test stage or git fixtures, cap each stream at 16 MiB, and run the child in a process group of its own that cancellation asks to stop with SIGTERM before killing it and that is killed on return; when SIGINT, SIGTERM or SIGHUP ends praetorctl, that signal is forwarded to every command group so git still removes its locks and partial clones or worktrees, and groups still running after a 5 s grace are killed (serve keeps its own graceful drain); on Linux the kernel also kills each command when praetorctl dies, even by SIGKILL, and the git hooks, the development MCP client and the repair runner stop a praetor process group with SIGTERM (SIGINT for Ctrl-C) and kill it only after 10 s, so the commands in groups of their own stop too
breaking: false
