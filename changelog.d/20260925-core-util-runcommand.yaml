type: fixed
title: util.RunCommand and util.RunGit return standard output only and carry a failure's standard error in the error, strip the git repository variables (GIT_DIR, GIT_INDEX_FILE and the rest git itself clears) from inherited child environments so a hook's repository cannot be written through the gate's test stage or git fixtures, cap each stream at 16 MiB, and run the child in a process group of its own that cancellation asks to stop with SIGTERM before killing it and that is killed on return; when SIGINT, SIGTERM or SIGHUP ends praetorctl, that signal is forwarded to every command group so git still removes its locks and partial clones or worktrees, and groups still running after a 5 s grace are killed (serve keeps its own graceful drain)
breaking: false
