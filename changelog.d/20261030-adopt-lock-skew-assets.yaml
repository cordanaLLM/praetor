type: fixed
title: "Audit kept printing 'Managed assets match locked Praetor' on a catalog lock because v0.0.0+catalog.<hex> was read as an engine build; a catalog lock now names no engine and plain adoption refreshes an earlier managed text. Adopt --force exited 1 on the size cap of an agent client that agent_clients does not select; only selected clients are capped now. The emitted figure VENDOR.md named the engine-only player directory and bundle step; it now reads true in an adopting repository and in the engine. A declared coverage mechanism no longer inlines its prose into the always-loaded harness, which could carry it past the cap of a selected client: the row gives the state per language and the catalog path."
