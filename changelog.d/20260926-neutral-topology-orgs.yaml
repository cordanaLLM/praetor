type: changed
title: "Stop hard-coding organisation folders: topology audit and clean recognise the built-in containers (upstream, local, stacks, worktrees, scratch), the operator's topology.org_containers read through --fleet-config, --workstation-config and --manifest, and any dev-root directory that is not a repository but holds a child repository; cleanup never deletes a directory holding a repository; adopt validation uses the same built-in names plus structural detection; praetor's own Python command guard carries only the generic dev-root rule. Migration: an audit may reclassify dev-root directories, and folders the guard used to refuse by name now pass, so list your organisation folders in topology.org_containers and add hooks.command_policy.deny patterns for any folder root agents must not target"
breaking: true
