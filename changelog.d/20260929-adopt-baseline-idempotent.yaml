type: fixed
title: "The explicit baseline re-record, praetorctl adopt --rerecord-baseline, keeps .standards-baseline.json byte for byte when the rescan records the same debt for the same repository and reports Rescanned; baseline unchanged, so a repeated re-record leaves no diff of generated_at; it rewrites the file when an infraction or the repository identity changed, or when the file records no commit yet. A re-adoption without that flag never rewrites the file"
breaking: false
