type: fixed
title: Pin both documentation presets and build them in CI; the MkDocs preset installs a hashed lock compiled from requirements.in with pip --require-hashes (the Pages deploy installs the same lock), the Starlight preset pins exact versions with a committed package-lock.json installed by npm ci, Renovate keeps both pinned, a new docs-presets CI job builds both on every docs/presets change, and the site URL both presets emit comes from DOCS_SITE_URL instead of an unresolvable placeholder host
breaking: false
