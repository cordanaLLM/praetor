type: fixed
title: On Windows every command praetor runs that resolves to a batch file (.bat or .cmd, such as the npm shim pnpm.cmd) now starts through cmd.exe with one command line quoted for cmd.exe, script path included, so praetor's own command line no longer splits at a cmd.exe metacharacter in the shim's directory (such as C:\Users\Tom&Jerry; a shim that re-reads its own path unquoted can still fail inside itself), and arguments reach the program behind the shim unchanged however often it re-reads them; bump no longer escapes carets itself, and an argument holding a quote or a line break is refused before anything starts
issue: "#538"
breaking: false
