type: fixed
title: "A HISS ratchet rejection no longer hides violations or blames an upgrade on unchanged code: each class it cuts at three lines says how many it hid and names the read-only listing, 'praetorctl baseline --verify --all-violations' or 'praetorctl audit --all-violations', which prints every violation without writing .standards-baseline.json; audit, baseline --verify and the standards_audit MCP tool scan the violations' files as the baseline's commit_sha holds them, tag a finding that commit already carried '(check added or changed since the baseline)' instead of '(new)', tag one the baseline records at another line '(recorded in the baseline at line N)' with the plain 'praetorctl baseline --record' as its remedy, keep 'introduced' only for code that changed, describe anything untraced, such as a baseline without commit_sha, as '(not in the baseline)' with the reason, and name 'praetorctl baseline --record --allow-increase --reason=<why>'; the verdict does not change"
breaking: false
