type: added
title: "praetorctl profile set [<profile>] [--facets=...] --lock-source-root=<praetor> [--dry-run] changes an adopted repository's declared profile or facets, or re-pins it to a newer catalog, without adopt --force: it rewrites only the profiles and facets lists of .standards.yaml (every other line kept), .standards.lock and the vendored catalog texts the new lock pins, checks everything before the first write, backs up a replaced lock or catalog text and previews each change as a diff in a dry run, then runs the audit gates for the files adoption derives from the declaration (README block, documentation gate, DevContainer, branch protection ruleset), which it does not rewrite, and names the adopt --force refresh when one fails; an existing lock that no longer matches now names the declared texts whose values the source changes and this command, a source bundle that lacks a declared id is named with its catalog version, a rescan without a resolved identity keeps the baseline's recorded repository, and adopt --help states the default facets and that --facets applies only when adoption creates .standards.yaml"
breaking: false
