type: fixed
title: "astmerge: merge grouped const, var and type blocks per spec and render each block once, keep free-floating and leading comments in place (a comment inside a block stays next to its block-mates), report divergent build-constraint, package-doc and free-comment edits as conflicts (#392), merge an import only one side renames, and fail closed: a clean merge is re-checked with go/types and becomes a conflict when it adds a type error, drops or keeps a declaration against the 3-way expectation, changes a const value, reorders var initialization, or runs two variables each side added at one place in an order no side wrote; a block whose values follow position (iota or implicit repetition) merges as one unit once both sides change it, and an ambiguous var block order conflicts"
breaking: false
