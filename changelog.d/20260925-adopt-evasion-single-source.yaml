type: fixed
title: "The evasion rules now also deny LEFTHOOK=false, core.hooksPath set with a space or to any path, bundled short skip flags such as -an, git -C dir commit -n, lefthook uninstall and chmod, mv, cp, tee, sed -i, find -delete or redirects on the hooks directory; the Git global-option prefix parses one way only, so a run of -C options no longer stalls Python's re; the interceptor adopt writes is rendered from the engine's rules instead of an older copy, and it blocks with exit 2 on empty, non-object, oversized or unrecognised input instead of allowing it or crashing. Migration: the adopted interceptor now exits 2 on empty stdin, a terminal or a payload without tool_input.command, and refuses a command over 65,536 characters or with a line over 2,048 characters, as praetor's own guard does; wire it only where the harness passes one JSON object with tool_input.command on stdin, route other clients through `praetorctl hook`, and split long commands or write their content to a file first"
breaking: true
