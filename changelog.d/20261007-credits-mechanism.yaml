type: added
title: "One curated credits list, docs/credits.yaml, renders the tables of the credits page and credits every dependency, tool, action, image, integration, specification, font and icon praetor uses; the credits gate fails on an inventory item without an entry, an entry path that no longer uses its item, a persona or skill neither derived nor marked original, and an unknown license without an unexpired credits exception, the declared exceptions list gains the rule credits, and THIRD-PARTY-NOTICES.md lists the embedded devcontainer CLI lock; praetorctl ci filter classes a dependency or build manifest under docs/ (package.json and its lock, tsconfig*.json, a pip requirements*.in) as configuration, the light CI run of a documentation-only pull request runs the credits and notices tests (make credits-check), and package.json and PEP 508 requirement lines have one reader each (nodemanifest.ParseManifest, pymanifest.ParseRequirement): the needs analyzer, the bump scanner and the documentation scanner now refuse a package.json that repeats a member name, and the needs analyzer records a direct-reference requirement (name @ url) by its name"
breaking: false
