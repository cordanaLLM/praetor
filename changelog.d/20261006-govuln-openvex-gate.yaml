type: added
title: 'Add the Go vulnerability gate, praetorctl security govuln: govulncheck at symbol level, where a called vulnerable symbol fails, a vulnerable package or module present but not called fails unless the OpenVEX v0.2.0 document named by security.go_vex in .standards.yaml (default security/vex/go.openvex.json) holds a not_affected statement for it with a justification and an impact statement reviewed within 90 days, a vulnerable_code_not_present or component_not_present statement covers a module-level finding only, and a scan that did not complete or a document that does not validate exits 2, never a pass; gate run''s security stage, the pre-push security job adoption writes (earlier renderings migrate without --force), this repository''s security workflow and make vuln all run it, and the gate treats the document as a subtractive input. Migration: a Go repository whose build holds a vulnerable package or module it does not call now fails gate run and the generated pre-push job until the document covers each such advisory or the dependency is updated; run praetorctl security govuln to list them and re-run praetorctl adopt to move an unedited lefthook.yml. The standard library counts too: govulncheck reports it as the module stdlib at the version of the Go toolchain that scans, so after a Go security release the gate fails on every run until that toolchain is upgraded to the fixed patch release, with a not_affected statement as the stopgap; in CI, set check-latest: true on the actions/setup-go step of each job that runs the gate, as this repository''s CI and security workflows now do'
issue: "#778"
breaking: true
