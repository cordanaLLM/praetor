type: added
title: Add praetorctl admit, which holds a heavy local step until the host reports at least 12 GiB MemAvailable, 15 GiB SwapFree and a fitting load, then runs it in its own systemd scope with MemoryHigh, MemoryMax and MemorySwapMax so a step that outgrows its limit is killed alone; the sentinel now reads SwapTotal and SwapFree
issue: '#1131'
