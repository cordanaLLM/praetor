type: changed
title: "Compiled context files keep a stable prompt-cache prefix: AGENTS.md band markers (head, config, tail) make compile-context emit the static head first, so a register or client edit no longer shifts every byte after it, and compile-context --verify-stable, --verify and audit fail on a head band that holds a timestamp, digest, absolute path or run counter or that renders differently under another clock or visit order. Migration: praetorctl adopt now writes the three markers into the harness; for a hand-written AGENTS.md add the three markers named in docs/guides/context-cache-bands.md to AGENTS.md; an unmarked file compiles in source order and earns a warning for this release, and the next release fails the audit without the markers"
issue: "#853"
breaking: false
