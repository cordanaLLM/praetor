type: fixed
title: "The framework migration's Go source and go.mod reads and the Exit-0 receipt loader now go through the same bounded, root-anchored read as every manifest reader: a FIFO at a migration target or a receipt path fails instead of blocking, a link resolving outside the repository is refused, and an oversize file is refused instead of read in full. Generated files below a repository or output root (needs manifests and demand files, the migration rewrite, the receipt, the baseline, init and sync companions, the Paperclip harness, operational sync overlays, funding surfaces, the documentation cache, worktree and devsync directories, framework kit assets and dogfood evidence) are now written through a pinned handle on that root, so a symlinked ancestor directory cannot redirect them; a generated file that is itself a symbolic link is refused instead of written through, an ancestor link that resolves outside the root is refused instead of followed, and an output path ending in a separator is refused instead of written as a file of the same name inside it"
breaking: true
