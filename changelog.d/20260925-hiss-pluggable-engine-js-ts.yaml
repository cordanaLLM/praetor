type: added
title: "The HISS scanner runs every language behind one languageScanner engine and now reads JavaScript, TypeScript and the script blocks of Svelte components (.js, .jsx, .mjs, .cjs, .ts, .tsx, .mts, .cts, .svelte) for HISS-01 direct recursion, HISS-02 unbounded loops, HISS-04 function length, HISS-07 swallowed errors and process.exit, and HISS-08 eval, the Function constructor and string timers, each replayed by hiss coverage --verify. audit names the languages its PASS covers and reports source in any other language as [UNSCANNED] instead of passing it; minified files, and files whose braces the line scanner misread, are declined and counted as unscanned without making gate run incomplete. Destructured, object-typed and defaulted parameter lists are read, and an apostrophe or URL in JSX text no longer unbalances a component. The Markdown governance scripts adoption ships (tools/markdownlint/verify.mjs, no-private-scratch-links.mjs) now hold these rules themselves, so adoption refreshes them from their prior digests and adds no debt to an adopter. Migration: existing debt in a repository's own script files now counts as HISS infractions, so fix it or record it with `praetorctl baseline --record --allow-increase --reason=<why>`, and parsers of the audit invariant line must accept `verified for <languages>:` and the new [UNSCANNED] lines"
breaking: true
