type: fixed
title: Count every declared Go and Node dependency as scanned, whether or not it has an upgrade, so bump audit's total_scanned no longer depends on network state and an online modernization score is no longer inverted (an offline audit still sees no upgrade targets, so it cannot count pending upgrades); drop phantom upgrade candidates from bump scan, update --all and train; let bump unify compare every declared dependency, so one already at its upstream latest release is still raised to, or reported ahead of, its catalog pin, while the package.json scan no longer reduces a comparator range such as <9.0.0, >=5.0.0 or =5.0.0 to the version it names, so unify reports it as not SemVer-comparable instead of raising it past its cap (only a bare, caret or tilde range is read as its version); and fail the audit instead of scoring 100 percent when Cargo, Python or native manifests were not examined
breaking: false
