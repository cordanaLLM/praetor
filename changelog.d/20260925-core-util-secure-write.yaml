type: fixed
title: util.ConfinePath accepts paths under a root of "/" or a Windows volume root and refuses a parent directory outside the root; the new util.WriteFileConfined and util.MkdirConfined resolve every path component through a pinned os.Root, and the milestone, project-cache and onboarding writers use them, so a directory swapped for an escaping link after the confinement check is refused instead of followed; WriteFileNoFollow writes atomically through a pinned directory handle, so a failed or interrupted write leaves the previous milestones.json, BACKLOG.md or project.json intact, and a hard link at the destination or a symbolic link planted after the check is replaced instead of written through; onboarding no longer narrows the permissions of the repository root itself
breaking: false
