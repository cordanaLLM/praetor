type: fixed
title: Claude Code hook registrations spawn the guard directly from ${CLAUDE_PROJECT_DIR} with no shell, and Gemini CLI's run from its workspace root, so a session whose cwd drifted out of the checkout (or into another repository) no longer fails every Bash, Edit and Write call closed; the batch-scope hook passes out-of-repository paths and cwds until a checkpoint is due; the never-loaded .claude/mcp.json and .gemini/mcp_config.json are removed and praetor-dev is registered in .gemini/settings.json
breaking: false
