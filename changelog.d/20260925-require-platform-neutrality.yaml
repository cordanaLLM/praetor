type: fixed
title: "Every pull request of the canonical repository waits for the three Platform Neutrality legs, now locked by a test on the rendered and the committed ruleset; sync --remote adds to GitHub only the required checks whose jobs report in the repository it writes to, so an operational fork, whose repository guard is false and whose guarded matrix never expands, is no longer given checks that leave every pull request waiting; it reads the live ruleset back and names each check it left off, with a warning for one the live ruleset still requires because an earlier sync added it, since sync never removes a live required check; a pull request job whose condition is a disjunction with github.event_name != 'schedule' now counts as reporting on every pull request, which keeps the security scan required in a fork. Migration: a committed ruleset rendered before this change for a workflow job with such a condition fails the audit as drift; re-render it with `praetorctl adopt --force`, or delete it and run `praetorctl sync`; an operational fork that ran `sync --remote` since #258 still requires the Platform Neutrality legs on GitHub, so remove the checks the `[WARN] Still required on GitHub` line names from its `praetor-main-protection` ruleset by hand"
breaking: true
