type: fixed
title: "Every pull request of the canonical repository waits for the three Platform Neutrality legs, now locked by a test on the rendered and the committed ruleset; sync --remote writes to GitHub only the required checks whose jobs report in the repository it writes to, so an operational fork, whose repository guard is false and whose guarded matrix never expands, is no longer given checks that leave every pull request waiting, and it names the checks it left off; a pull request job whose condition is a disjunction with github.event_name != 'schedule' now counts as reporting on every pull request, which keeps the security scan required in a fork. Migration: a committed ruleset rendered before this change for a workflow job with such a condition fails the audit as drift; re-render it with `praetorctl adopt --force`, or delete it and run `praetorctl sync`"
breaking: true
