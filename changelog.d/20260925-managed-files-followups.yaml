type: fixed
title: "The README governance block links only by absolute URL: its HISS Adopted badge links AGENTS.md on the default branch of the repository the manifest names (blob/HEAD, the fork's own for a fork) and renders unlinked without an identity, so a documentation portal that includes the README builds under mkdocs build --strict. `praetorctl adopt` also adds one packageRules entry with enabled: false for the managed documentation-gate files to an existing Renovate configuration, so an adopter's Renovate no longer edits byte-locked files; it never creates a Renovate configuration and reports JSON5, JSONC and package.json configurations with the entry to add by hand. Migration: audit reports a block with the earlier relative AGENTS.md link as stale until plain `praetorctl adopt` re-renders it; no --force is needed"
issue: "#506"
breaking: true
