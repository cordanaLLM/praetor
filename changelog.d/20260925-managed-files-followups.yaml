type: fixed
title: "The README governance block links only by absolute URL: its HISS Adopted badge links AGENTS.md on the default branch of the repository the manifest names, on the forge its origin remote names (github.com blob/HEAD, gitlab.com /-/blob/HEAD, gitea.com and codeberg.org src/branch/HEAD; the fork's own after operational sync), and renders unlinked on any other host, so a documentation portal that includes the README builds under mkdocs build --strict. `praetorctl adopt` also adds one packageRules entry with enabled: false for the managed documentation-gate files to an existing Renovate configuration, so an adopter's Renovate no longer edits byte-locked files; it never creates a Renovate configuration and reports JSON5, JSONC, package.json, symlinked and unreadable configurations with the entry to add by hand. Migration: audit reports a block with the earlier relative AGENTS.md link as stale until plain `praetorctl adopt` re-renders it; no --force is needed"
issue: "#506"
breaking: true
