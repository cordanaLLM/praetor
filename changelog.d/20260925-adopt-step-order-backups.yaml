type: fixed
title: "adopt runs the git-ignore step right after the manifest step, before every step that can replace a file, so a first adoption keeps a backup under .workingdir/adopt-backups of every file it replaces (the lock, the pinned catalog, vendor context files, editor merges) and a dry run plans the same backups without writing; when git still does not ignore the backup root, for example with git-ignore declined, the reason is warned once per run with the remedy instead of once per file. A register.tasks entry that is no target_tasks label now fails adopt in preflight, before the lock or any other file is written. A replace that only reorders lines reports the lines that moved (-0/+0 lines, N moved) instead of every reordered line as removed and added"
breaking: false
