type: fixed
title: "adopt runs the git-ignore step right after the manifest step, before every step that can replace a file, so a first adoption keeps a backup under .workingdir/adopt-backups of every file it replaces (the lock, the pinned catalog, vendor context files, editor merges) and a dry run plans the same backups without writing; when git still does not ignore the backup root, for example with git-ignore declined, the reason is warned once per run with the remedy instead of once per file. A register.tasks entry that is no target_tasks label now fails adopt in preflight, before the lock or any other file is written. A vendor context file that is the projection of AGENTS.md as HEAD holds it (AGENTS.md edited after the last compile-context) is synchronized, not reported as a replaced hand edit. A re-run lists existing persona copies and the installed pre-commit hook as reconciled instead of created, and a hand-edited persona copy is reported as replaced with a backup. A replace that only reorders lines reports the lines that moved (-0/+0 lines, N moved) instead of every reordered line as removed and added"
breaking: false
