type: added
title: 'The commit message policy (forge check-message, check-commits) and the pull request body check (forge validate-pr) now treat closing keywords (close, fix, resolve and their forms) by scope: CI resolves each reference and allows issues plus pull requests opened by the checked pull request author, refuses pull requests opened by anyone else unless ''Closes-own: <reference>'' marks the closure as intended, and fails closed on unresolvable references; offline hooks warn for ambiguous #N and owner/repo#N references while still refusing explicit /pull/ and /pulls/ URLs'
