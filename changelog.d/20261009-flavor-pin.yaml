type: fixed
title: "A Go service declaring app-service now resolves to the go-service flavor (flavors can name a secondary profile through flavor.MultiProfile, tried after the flavors built for it), and a flavors list in .standards.yaml pins one or more flavors, each optionally scoped to a repository-relative path, for flavor audit, flavor apply, adopt, the Hindsight distiller, gate run and the pre-push hook through one resolver (flavor.ResolveTargets); a directory-scoped pin audits its stack templates in that directory and the repository-level files (workflows, ruleset, hooks, editor settings, standards files) at the root, so a conforming repository passes; flavor apply refuses and adopt skips a pin that is not one root flavor; an unknown pinned flavor, a missing directory or a path leaving the repository through a symlink is refused, an unreadable .standards.yaml now fails flavor resolution instead of being read as having no pins, a repository matching no flavor still fails and names the pin setting, and flavor list and inspect show the secondary profile"
