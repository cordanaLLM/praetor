type: fixed
title: Mint and accept Exit-0 receipts only for a working tree that matches HEAD. `gate run` without --dry-run refuses, before any stage and with no receipt, a tree with modified, staged or untracked files (the receipt file excepted), an assume-unchanged or skip-worktree index entry, or a .standards-baseline.json or .gosec.json that is ignored or is a symbolic link or other non-regular file, and re-checks the tree and HEAD before signing; `gate verify`, `forge validate-pr` and paperclip dispositions reject a receipt whose signed gate output does not record worktree_clean true; the gate, paperclip verify and release preparation read cleanliness through one git status probe that status.showUntrackedFiles, submodule ignore settings, fsmonitor, hooks and optional locks cannot sway, and that refuses repository-configured clean or process filters instead of running them
