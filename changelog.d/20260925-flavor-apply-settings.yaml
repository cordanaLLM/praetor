type: fixed
title: "flavor apply now writes the branch protection ruleset (.github/rulesets/main.json) that the flavor audit requires, using adopt's renderer and the effective policy; an edited ruleset is kept unless --force is passed, adoption.decline branch-ruleset is honoured, and lefthook.yml and .vscode/settings.json are listed with the command that writes them. Adoption and flavor apply refresh, without --force, only the ruleset that was current for the repository's policy and workflows before the run, so running flavor apply before adopt no longer leaves a ruleset the audit rejects; a ruleset with any value edited (review count, signature rule, status check) is kept and reported. adopt --dry-run, on the CLI and through the MCP standards_adopt tool, now previews the ruleset it would write as create, update, unchanged or keep, with the rendered content or a diff, counting the workflows the run would scaffold. flavor apply alone passes the flavor audit only for flavors whose other required settings (lefthook.yml, .vscode/settings.json) are already in place; it lists those with their producer and does not render them. Migration: flavor apply exits non-zero when .standards.yaml cannot be read or its policy cannot be resolved; fix the manifest or lock, or decline branch-ruleset"
breaking: true
