type: added
title: "Licence gates for adopters (docs/guides/licensing-gates.md): a root carrying REUSE.toml or LICENSES/ gets a reuse-lint pre-commit job in lefthook.yml and a hosted .github/workflows/reuse.yml (REUSE lint), both at the one REUSE pin fsfe/reuse-action@v6 that bump and praetor's own Compliance workflow read too; the hook job skips where reuse is not installed and fails on another reuse major, a lefthook.yml adoption wrote before the root gained or lost the markers is migrated without --force, and the harness names the actions a workflow without commands of its own uses. praetorctl audit fails a REUSE.toml annotation whose path a later annotation matches whole, since REUSE applies only the last matching annotation whatever its precedence, and, where LICENSES/ exists, a root LICENSE that is missing or differs from LICENSES/<id>.txt of the declared licence (line endings aside) and every other root file named like a licence (COPYING, LICENSE.md, LICENCE, LICENSE-*) unless an exceptions entry of the new rule root-license-notice keeps it. Migration: in a repository that declares REUSE, re-adopting adds a pre-commit job and a required REUSE lint check that fail on any file reuse lint finds without licensing information; label those files before re-adopting, or decline reuse-gate in .standards.yaml to skip the workflow. Move every REUSE.toml override after the default table it overrides, make LICENSE a copy of LICENSES/<id>.txt, and rename, merge or keep (exceptions rule root-license-notice) every other licence-named root file, or audit fails"
breaking: true
