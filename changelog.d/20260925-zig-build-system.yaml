type: added
title: "Zig builds are recognised: the native needs analyzer detects build.zig and build.zig.zon, reports the language zig and reads its demands from the build.zig.zon dependencies (url packages, and path packages vendored under a pruned directory), refusing a malformed manifest with its line and reason; the adoption verification plan runs zig build ahead of every language build and, with no language test command beside it, is unavailable naming the missing native test step for build.zig; the pre-migration epic no longer phrases C/C++ steps for a Zig build without C/C++ markers, and the dogfood discovery policy counts the Zig markers as native; every repository walker (needs discovery, adoption verification, the HISS audit scan, dedupe and the editor language scan) skips the trees Zig writes inside a checkout (zig-pkg, zig-out, .zig-cache), so fetched packages are no sub-projects, demands or C sources of the repository, and the editor plan gives a pure-Zig repository zig without C/C++ tooling"
breaking: false
