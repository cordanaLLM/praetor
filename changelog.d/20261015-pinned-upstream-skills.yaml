type: added
title: "Pinned upstream skills can be declared in .standards.yaml under skills.upstream with a repository URL, tag, mandatory 40-hex commit, and skill names. A new subcommand, praetorctl skills pin-sync, clones each upstream repository at its tag, verifies the clone HEAD matches the pinned commit, copies the skill directories into .agents/skills alongside any folder or repository LICENSE, and writes a .pin.json record with file SHA-256 digests. Pinned skills whose file digests match their record are scoped out of the 600-prose-word caveman lint ceiling, while unpinned skills and tampered pinned skills are refused. praetorctl compile-context projects pinned skills into client skill folders (such as .claude/skills) for all active clients, and compile-context --verify and audit verify that projected copies match canonical sources without drift."
breaking: false
