title: "audit reads the live GitHub Actions state when the origin remote names the manifest's repository on github.com and a token is found: it compares the repository's workflow permissions with overrides.actions and fails on drifted-by-organisation, drifted-at-repository, blocked-by-organisation or drifted, and reports each workflow's latest runs on the default branch (failure streak with the latest failed run, never-run workflows with their triggers) without failing on them; workflow_runs.expected declares a workflow failing or unexercised with a reason; plan previews the permission verdict; --offline on audit and plan skips every forge read, and every check the forge did not answer prints [SKIP] with its reason; a declared overrides.actions must set default_workflow_permissions to read or write; the generated pre-commit audit and the fallback pre-commit hook pass --offline, so no commit asks the forge, while the pre-push audit and CI read it, and adoption migrates an earlier generated lefthook.yml without --force"
