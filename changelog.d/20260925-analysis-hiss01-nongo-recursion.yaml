type: fixed
title: HISS-01 now reports direct recursion in Rust and Python by the spelling that resolves to the function (bare name, self./Self::, cls., Owner.) and leaves self-calls inside a Rust impl Trait for T undecided because they may reach an inherent method, follows each language's shadowing scope (Rust bindings by lexical scope, a let from its semicolon to the end of its block, a for, if-let, match-arm or closure binding only inside its construct; a Python binding only in the function that makes it; a Rust match arm's pattern is never a call), leaves a call inside the input of a Rust macro other than the standard expression macros undecided because the macro may rewrite it, classifies trait-impl headers with same-line attributes, const generic braces and trait aliases, the literal stripper carries a backslash-continued string to the next line and no longer closes a triple-quoted string at an escaped quote, the Python scanner no longer ends a function at a continuation line that starts in an open bracket or triple-quoted string and resets a misread bracket depth at the next statement-only line, and standards_explain_rule states per language which recursion shapes are decided instead of claiming a universal call-graph analyzer
breaking: false
