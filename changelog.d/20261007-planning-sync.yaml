type: added
title: "Reconcile planning state on the forge (first slice of #837; the planning-state audit, the scheduled milestone sync, ledger-row resolution on landing and adoption of the workflow follow). `praetorctl issue reconcile` now also ticks a parent's task-list box when its child closes, closes an open epic or tracking parent once every child (task item and sub-issue) is closed and an open milestone once it holds closed issues and no open one, never unticks or reopens anything, and reports the drift it leaves as [DRIFT] lines; every run is a dry run that prints each intended write unless --apply is passed, every write is logged with its outcome, and --max-planning-writes caps one run's writes (default 50, at most 500) with the rest reported as deferred. `needs epic --publish` writes a `- [ ] #N` task-list line per child into the parent once the children exist, and generated epics carry the repository's active milestone. `milestone close` refuses while the cached store or, with --publish, the forge reports open issues unless --force, and computes progress from the issue counts. `.github/workflows/planning-sync.yml` runs `issue reconcile --apply` on this repository when an issue closes and daily. The Forge interface gains EditIssueBody"
issue: "#837"
