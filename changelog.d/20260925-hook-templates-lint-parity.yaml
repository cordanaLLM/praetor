title: The lefthook.yml and .config/agent/hooks/block_evasion.py that adoption renders now pass black, flake8 at 100 columns and yamllint's default strict policy, so an adopter whose hooks lint the whole tree no longer fails on files Praetor wrote; lefthook.yml opens with a document start and folds long run lines without changing the commands, an earlier unfolded rendering is still recognised and migrated, and make hooks-lint lints both renderings from committed fixtures that a Go test keeps equal to what adoption writes. The Go hook engine, praetor's own Python guard and the adopted interceptor now refuse in one wording owned by internal/agenthook, including the scan-bound refusal, and the parity tests compare the full refusal text of every case instead of only the exit code and marker, so the engines cannot drift apart silently
