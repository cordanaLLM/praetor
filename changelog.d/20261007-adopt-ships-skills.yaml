type: fixed
title: "The text register block named social-text and caveman skills an adopter never received: adopt now installs them, compile-context copies them for Claude Code, and the block and the Paperclip harness name only the skills a repository carries. Migration: in a repository without .agents/skills/social-text and .agents/skills/caveman the block no longer names them, so compile-context --verify and audit report it out of sync until praetorctl compile-context re-splices it; run praetorctl adopt --lock-source-root=<praetor checkout> instead to install the skills and keep the names. A repository that carries social-text, caveman or adhd-format and selects Claude Code fails the same checks until compile-context writes its .claude/skills copy. A .claude/skills that is a symlink (for example to ../.agents/skills) is refused there, and by adoption with --lock-source-root while agent_clients selects claude: replace it with a real directory, which compile-context then fills, or leave claude out of agent_clients. Since the audit compares .paperclip/harness.json with this release's synthesis, a harness an earlier release wrote naming the caveman skill in a repository without .agents/skills/caveman fails the audit as out of date until praetorctl adopt refreshes it"
issue: "#235"
breaking: true
