type: changed
title: "praetorctl gate run runs the Cargo toolchain where a Cargo.lock is committed (cargo fetch --locked in the prefetch stage, cargo audit in the security stage when cargo-audit is installed, cargo test --workspace --locked and cargo clippy --workspace --all-targets -- -D warnings in the isolated test worktree), reports a missing cargo or cargo-audit as not run with its install hint instead of a pass, and names each language's outcome in the stage reason; a repository without a Cargo.lock runs and records exactly what it did before. The gate now refuses to sign an Exit-0 receipt when the prefetch, security and test stages all ran nothing for any language, and names the unsupported languages it found. Migration: a repository with neither a go.mod nor a Cargo.lock no longer receives a receipt, so its pre-push gate job fails; commit the Cargo.lock of a Cargo workspace, and re-run praetorctl adopt to pick up the lefthook.yml header that states the rule"
breaking: true
