type: fixed
title: "Every Git hook spelled its interpreter python3, a name that on Windows is missing or is the Microsoft Store alias; every job now starts through the launcher .config/lefthook/python.sh, which tries python3, python and py -3 and runs the first that answers a version probe as Python 3.10 or newer, no environment variable selects the interpreter, praetorctl adopt installs the launcher with the checkpoint scripts and the lefthook.yml it writes calls it, and the development install checks the same candidates. Migration: a repository that vendors .config/lefthook copies python.sh, tool-floors.txt and scripts/toolchain.py with the policy, because every job of praetor.yml starts through python.sh and fails without it; a host needs Python 3.10 or newer as python3, python or py -3; run praetorctl adopt --lock-source-root=<praetor checkout> to migrate a generated lefthook.yml whose checkpoint jobs name python3 and to install the launcher they call"
issue: "#339"
