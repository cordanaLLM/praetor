title: "Pin the locked documentation gate's actions by full commit SHA with the release as a trailing comment (checkout v7.0.1, setup-node v7.0.0), so repositories that require SHA pinning can run it, and keep the pins current through Renovate, which now updates the template and the workflow copy in one branch; praetor-docs.yml and markdownlint-cli2.yaml pass yamllint --strict under its default rules; the README governance block fits markdownlint's 80-column MD013, strict mode and tables included, with reference-style badge links and one paragraph per gate; `praetorctl bump audit` compares an action pinned by full commit SHA with its release comment at that release instead of reporting it as drift. Migration: audit fails on the previous praetor-docs.yml, markdownlint-cli2.yaml and README block until `praetorctl adopt` runs; plain adopt now refreshes a managed file that holds an earlier Praetor text unedited and rewrites the README block, and only an edited copy still needs `praetorctl adopt --force`; keep praetor-docs.yml excluded from your own update bots, because Praetor ships each pin update and a copy bumped first fails the byte lock"
