type: added
title: "praetorctl provenance checks every artifact's bytes against the file type its name declares before attesting it, over the same bytes the digest reads: a .deb, .udeb or .ddeb must be an ar archive of debian-binary (format 2.x), control.tar and data.tar with no member cut off, an .efi file a complete PE/COFF image with an EFI subsystem, and an .efi named as a kernel (a vmlinuz, linux, kernel or uki word, or directly in an EFI/Linux directory; never a systemd-stub .addon.efi) a Unified Kernel Image with a .linux section; a mismatch exits 1 naming the file, the expected format and the reason, -content-check=report attests it with an UNVERIFIED warning instead, and a file type without a rule is listed as unchecked on stderr rather than passed as verified"
issue: "#616"
breaking: true
