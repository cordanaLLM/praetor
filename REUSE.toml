version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@proton.me>"
SPDX-License-Identifier = "EUPL-1.2"


# The vendored interfig engine keeps its upstream MIT terms. REUSE 3.3 applies only the
# last matching annotation table, so this override must stay after the "**" table above;
# moved before it, the EUPL table would relabel the vendored files and `reuse lint` would
# still pass. VENDOR.md and vendor.json sit outside upstream/ and stay EUPL-1.2
# (docs/adr/0015-interactive-figures-from-vendored-interfig.md).
[[annotations]]
path = ["tools/figures/third_party/interfig/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

# The committed figure player bundles this repository's loader and player code (EUPL-1.2) with
# interfig, React, react-dom and scheduler (MIT). dist/THIRD-PARTY-LICENSES.txt carries the full
# MIT texts (docs/adr/0016-figures-for-adopters.md, section 11). Like the table above, this one
# must stay after the "**" table.
[[annotations]]
path = ["tools/figures/dist/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Lusoris <lusoris@proton.me>",
  "2025 Vectorize AI, Inc.",
  "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT"

# The register skills adapted from MIT-licensed upstreams carry that upstream's licence text as a
# LICENSE file beside each skill, copied byte for byte (docs/credits.yaml names the upstream
# commit): the file keeps the upstream holder and the MIT identifier, in the checkout and in the
# plugin and client copies compile-context projects. The skill texts themselves stay EUPL-1.2 with
# their own header. Like the tables above, these must stay after the "**" table.
[[annotations]]
path = [
  ".agents/skills/caveman/LICENSE",
  ".agents/plugins/praetor/skills/caveman/LICENSE",
  ".claude/skills/caveman/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julius Brussee"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/adhd-format/LICENSE",
  ".agents/skills/social-text/LICENSE",
  ".agents/plugins/praetor/skills/adhd-format/LICENSE",
  ".agents/plugins/praetor/skills/social-text/LICENSE",
  ".claude/skills/adhd-format/LICENSE",
  ".claude/skills/social-text/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ayoub Ghriss"
SPDX-License-Identifier = "MIT"
