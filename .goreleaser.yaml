# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for cordanaLLM/praetor
version: 2

project_name: standards

before:
  hooks:
    - go mod tidy

builds:
  # The binary ships as praetorctl because that is the name every governed repository
  # invokes: AGENTS.md, the lefthook jobs and the generated harness all call praetorctl,
  # while a release archive used to contain only standardsctl. An adopter who installed a
  # release and followed the harness got "command not found" (#118).
  #
  # The standardsctl build below keeps the old name working for anyone already installing
  # it. Same source, same flags; the two names are the same program.
  - id: praetorctl
    main: ./cmd/standardsctl
    binary: praetorctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

  # Compatibility alias: the pre-rename name, same program. Kept so a release does not
  # break an existing install or script that calls standardsctl.
  - id: standardsctl
    main: ./cmd/standardsctl
    binary: standardsctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: standards-mcp
    main: ./cmd/standards-mcp
    binary: standards-mcp
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: standards-lsp
    main: ./cmd/standards-lsp
    binary: standards-lsp
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    # Renamed from the singular `format` in goreleaser v2.6, which now takes a list and
    # is reported as deprecated by `goreleaser check`.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=${document}"]
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=${document}"]

signs:
  - id: cosign-keyless
    cmd: cosign
    # cosign v3 dropped --output-signature/--output-certificate from sign-blob; a Sigstore
    # bundle now carries the signature, the Fulcio certificate and the transparency-log
    # entry in one file. ${signature} names that bundle so GoReleaser publishes it.
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum

# The container image the Helm chart in deploy/helm/praetor installs. It is built from the
# praetorctl binaries above, not from source, so the image and the archives ship one build
# (ADR-0013). buildx pushes the linux/amd64 and linux/arm64 manifest list in the publish
# phase, with an SBOM attestation (sbom defaults to true) and the provenance attestation
# buildx adds to every pushed build; the release job fails when either is missing. The only
# tag is the release version without its "v", because that is the appVersion the release
# job stamps into the packaged chart and the chart's default image tag.
# internal/forge/workflow_guard_test.go holds the image name equal to the lowercased
# .standards.yaml identity; GHCR accepts lowercase names only.
dockers_v2:
  - id: praetor
    ids:
      - praetorctl
    dockerfile: Dockerfile
    images:
      - ghcr.io/cordanallm/praetor
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # The OCI metadata is written down once: buildx sets it as labels on each platform's
    # image configuration and, through the alias, as annotations on the manifest list.
    labels: &oci-metadata
      "org.opencontainers.image.title": "praetor"
      "org.opencontainers.image.description": "Autonomous Fleet Governance & Workstation Sentinel Engine"
      "org.opencontainers.image.vendor": "cordanaLLM"
      "org.opencontainers.image.source": "https://github.com/cordanaLLM/praetor"
      "org.opencontainers.image.licenses": "EUPL-1.2"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
    annotations: *oci-metadata

# Keyless cosign signature over the pushed manifest-list digest, never over a tag, so the
# signature names exactly what buildx pushed. The default artifacts filter selects the
# dockers_v2 images; the release job verifies this signature before it publishes.
docker_signs:
  - id: cosign-keyless-image
    cmd: cosign
    ids:
      - praetor
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

checksum:
  name_template: "checksums.txt"

# The release stays a draft until .github/workflows/release-binaries.yml has attached the
# signed provenance and verified both bundles; that job then publishes it. Publishing here
# would lock the release on a repository with immutable releases before the provenance
# could be uploaded (#43). A rerun replaces the earlier run's draft instead of adding one.
release:
  draft: true
  replace_existing_draft: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
