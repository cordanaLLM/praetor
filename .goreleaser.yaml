# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for cordanaLLM/praetor
version: 2

project_name: praetor

before:
  hooks:
    - go mod tidy

builds:
  - id: praetorctl
    main: ./cmd/praetorctl
    binary: praetorctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # praetorctl declares its version as a constant; -X cannot rewrite it.
    ldflags:
      - -s -w

  - id: praetor-mcp
    main: ./cmd/praetor-mcp
    binary: praetor-mcp
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.mcpVersion={{.Version}}

  - id: praetor-lsp
    main: ./cmd/praetor-lsp
    binary: praetor-lsp
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # praetor-lsp declares its version as a constant; -X cannot rewrite it.
    ldflags:
      - -s -w

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=${document}"]
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=${document}"]

signs:
  - id: cosign-keyless
    cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
