#
# actionlint carries a hard-coded table of GitHub-hosted runner labels
# (rule_runner_label.go) and rejects anything absent from it. Measured against
# actionlint v1.7.12 by deleting this file and re-running it:
#
#   .../ci.yml:26:14: label "ubuntu-26.04" is unknown. available labels are
#   ... "ubuntu-24.04", ... "macos-26-intel", ... "macos-26", ...
#   if it is a custom label for self-hosted runner, set list of labels in
#   actionlint.yaml config file [runner-label]
#
# So the table stops at ubuntu-24.04 for Ubuntu while already carrying macos-26 and
# macos-26-intel, which is why only the Ubuntu label needs declaring. The error text
# names self-hosted-runner.labels itself; actionlint offers no other way to teach it a
# label, and the declaration suppresses nothing else.
#
# That release is the floor .config/lefthook/tool-floors.txt declares for actionlint,
# and the hook refuses an older one before it runs (scripts/toolchain.py, #343), so the
# measurement holds for every actionlint a commit or push here is checked with.
# TestInstalledHookLintersSatisfyTheDeclaredFloors (internal/forge) fails when this
# header and the floor name different releases. A newer release passes the floor:
# wherever actionlint is on PATH, TestActionlintStillRejectsTheDeclaredLabels
# (internal/adopt/actionlint_test.go) re-runs the measurement on every workflow adoption
# writes and fails once actionlint knows ubuntu-26.04; then upstream has shipped the
# label, and this file can go once no other workflow here needs it. Adopting
# repositories get the same declaration from the actionlint-labels adoption step
# (internal/adopt/actionlint.go, #593, #622), which leaves this file as it is because it
# already declares the label.
#
# Only labels a workflow in this tree actually uses are declared. ubuntu-26.04-arm was
# declared and used nowhere, which is a claim about the repository that was not true.
self-hosted-runner:
  labels:
    - ubuntu-26.04
