# Rendered by internal/ghworkflow.RenderReviewHoldReleaseWorkflow.
# Review events process only their PR; newer reviews supersede that PR's reviews.
# Scan events process all open PRs; the scan continues after a per-PR read failure.
# Release jobs use non-cancelling per-PR groups and a separate scan group.
# Different PR releases cannot evict each other from a pending concurrency slot.
name: Review hold release
on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed]
  status:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment') && format('review-hold-release-pr-{0}', github.event.pull_request.number) || 'review-hold-release-scan' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
jobs:
  release:
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') && (github.event_name != 'check_run' || (contains(github.event.check_run.name, 'coderabbit') || contains(github.event.check_run.app.slug, 'coderabbit') || contains(github.event.check_run.name, 'codacy') || contains(github.event.check_run.app.slug, 'codacy') || contains(github.event.check_run.name, 'sourcery') || contains(github.event.check_run.app.slug, 'sourcery'))) && (github.event_name != 'status' || (github.event.state != 'pending' && (contains(github.event.context, 'coderabbit') || contains(github.event.sender.login, 'coderabbit') || contains(github.event.context, 'codacy') || contains(github.event.sender.login, 'codacy') || contains(github.event.context, 'sourcery') || contains(github.event.sender.login, 'sourcery'))))
    concurrency:
      group: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment') && format('review-hold-release-mutation-pr-{0}', github.event.pull_request.number) || 'review-hold-release-mutation-scan' }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Release answered review holds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -Eeuo pipefail
          REVIEW_BOTS='coderabbit|codacy|sourcery'
          REVIEW_QUERY=$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                headRefOid
                reviewThreads(first: 100, after: $cursor) {
                  nodes { isResolved }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          GRAPHQL
          )
          HOLD_TITLE='Gate held: review open'
          HOLD_CAUSE='review read failed'
          review_error() {
            local message="$HOLD_CAUSE" title="$HOLD_TITLE" cr=$'\r' lf=$'\n'
            # Bash 3.2 preserves quotes inside substitution patterns and replacements.
            title=${title//%/%25}
            title=${title//:/%3A}
            title=${title//,/%2C}
            title=${title//$cr/%0D}
            title=${title//$lf/%0A}
            message=${message//%/%25}
            message=${message//$cr/%0D}
            message=${message//$lf/%0A}
            echo "::error title=$title::$message" >&2
            printf '%s\n' "$HOLD_TITLE: $HOLD_CAUSE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          trap review_error ERR
          HOLD_CAUSE='temporary directory creation failed'
          REVIEW_TMP=$(mktemp -d "${RUNNER_TEMP:-/tmp}/review-hold.XXXXXXXXXX")
          trap 'rm -rf -- "$REVIEW_TMP"' EXIT
          # Return a validated REST collection's file path. API data stays off argv.
          review_pages() {
            local endpoint="$1" key="$2" dir count page
            local -a files=()
            dir=$(mktemp -d "$REVIEW_TMP/pages.XXXXXXXXXX")
            for ((page=1; page<=20; page++)); do
              HOLD_CAUSE="read failed: $endpoint page $page"
              gh api --method GET "$endpoint" -F per_page=100 -F page="$page" > "$dir/response.json"
              jq --binary -ce --arg key "$key" '
                (if $key == "" then . else .[$key] end) |
                if type == "array" then . else error("expected API collection") end' "$dir/response.json" > "$dir/$page.json"
              files+=("$dir/$page.json")
              count=$(jq --binary 'length' "$dir/$page.json")
              if ((count < 100)); then
                jq --binary -cs 'add // []' "${files[@]}" > "$dir/result.json"
                printf '%s\n' "$dir/result.json"
                return
              fi
            done
            HOLD_CAUSE="pagination bound reached: $endpoint (20 pages)"
            review_error
          }
          review_count() {
            local cursor='' page more count checks statuses
            local data="$REVIEW_TMP/thread-response.json" threads="$REVIEW_TMP/threads.json" pending="$REVIEW_TMP/pending.json"
            REVIEW_THREADS=0
            REVIEW_PENDING=0
            REVIEW_NAMES=''
            for ((page=1; page<=20; page++)); do
              HOLD_CAUSE="thread read failed: pull request $PR_NUMBER page $page"
              gh api graphql -f query="$REVIEW_QUERY" \
                -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PR_NUMBER" -F cursor="${cursor:-null}" > "$data"
              jq --binary -ce --arg head "$HEAD_SHA" '
                if ((.errors // []) | length) > 0 then error("GraphQL errors") else . end |
                .data.repository.pullRequest |
                if .headRefOid != $head then error("pull request head changed") else .reviewThreads end |
                if (.nodes | type) != "array" or (.pageInfo.hasNextPage | type) != "boolean"
                  or any(.nodes[]; (.isResolved | type) != "boolean")
                then error("invalid thread response") else . end' "$data" > "$threads"
              count=$(jq --binary '[.nodes[] | select(.isResolved == false)] | length' "$threads")
              REVIEW_THREADS=$((REVIEW_THREADS + count))
              more=$(jq --binary -r '.pageInfo.hasNextPage' "$threads")
              if [[ "$more" == false ]]; then break; fi
              HOLD_CAUSE='thread pagination bound reached (20 pages)'
              if ((page == 20)); then review_error; fi
              cursor=$(jq --binary -er '.pageInfo.endCursor | select(type == "string" and length > 0)' "$threads")
            done
            HOLD_CAUSE='check-run read failed'
            checks=$(review_pages "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest" check_runs)
            HOLD_CAUSE='commit-status read failed'
            statuses=$(review_pages "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" '')
            HOLD_CAUSE='invalid bot check/status response'
            jq --binary -cn --arg bots "$REVIEW_BOTS" --slurpfile checks "$checks" --slurpfile statuses "$statuses" '
              $checks[0] as $checks | $statuses[0] as $statuses |
              if any($checks[]; (.name | type) != "string" or (.status | type) != "string")
                or any($statuses[]; (.context | type) != "string" or (.state | type) != "string" or (.id | type) != "number")
              then error("invalid bot response") else
                [$checks[] | select(.status != "completed") |
                  select(([.name, (.app.slug // "")] | join(" ")) | test($bots; "i")) | .name] +
                [$statuses | sort_by(.id) | reverse | unique_by(.context) | .[] |
                  select(.state == "pending") |
                  select(([.context, (.creator.login // "")] | join(" ")) | test($bots; "i")) | .context]
              end' > "$pending"
            REVIEW_PENDING=$(jq --binary 'length' "$pending")
            REVIEW_NAMES=$(jq --binary -r 'join(", ")' "$pending")
            HOLD_CAUSE="unresolved threads=$REVIEW_THREADS; pending bot reviews=$REVIEW_PENDING; bots=$REVIEW_NAMES"
          }
          RELEASE_TITLE='Review hold release read failed'
          trap 'HOLD_TITLE="$RELEASE_TITLE"; review_error' ERR
          # Empty run associations need a unique fork repository/SHA across all open PRs,
          # including on review events that otherwise read only their target PR.
          review_release_unique_head() {
            local peers matches
            if [[ $(jq --binary '.pull_requests == []' "$run") != true ]]; then return; fi
            HOLD_CAUSE="fork association read failed: pull request $PR_NUMBER"
            peers=$(review_pages "repos/$GITHUB_REPOSITORY/pulls?state=open&sort=created&direction=asc" '')
            matches=$(jq --binary -r --arg repo "$HEAD_REPOSITORY" --arg head "$HEAD_SHA" --argjson number "$PR_NUMBER" '
              [.[] | select(.number != $number and .head.repo.full_name == $repo and .head.sha == $head) |
                .number | tostring] | join(", ")' "$peers")
            if [[ -n "$matches" ]]; then
              printf 'PR %s: ambiguous fork run for %s at %s; also open PR(s): %s; manual rerun required\n' \
                "$PR_NUMBER" "$HEAD_REPOSITORY" "$HEAD_SHA" "$matches" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          }
          # Keep errexit active inside each scan; a conditional function call disables it.
          review_release_pr() (
            set -Ee
            # Only the parent owns cleanup of the directory shared by these serial scans.
            trap - EXIT
            trap 'HOLD_TITLE="$RELEASE_TITLE"; HOLD_CAUSE="pull request $PR_NUMBER: $HOLD_CAUSE"; review_error' ERR
            HOLD_CAUSE="pull request metadata read failed: index $pr_index"
            PR_NUMBER=$(jq --binary -er --argjson i "$pr_index" '.[$i].number' "$prs")
            HEAD_SHA=$(jq --binary -er --argjson i "$pr_index" '.[$i].head.sha' "$prs")
            HEAD_REPOSITORY=$(jq --binary -r --argjson i "$pr_index" '.[$i].head.repo.full_name // ""' "$prs")
            HOLD_CAUSE="workflow run read failed: pull request $PR_NUMBER"
            runs=$(review_pages "repos/$GITHUB_REPOSITORY/actions/workflows/portability.yml/runs?head_sha=$HEAD_SHA" workflow_runs)
            run="$REVIEW_TMP/run.json"
            # Explicit associations take precedence; empty associations require both head
            # fields here and the open-PR uniqueness check below before any release.
            jq --binary -c --arg head "$HEAD_SHA" --arg repo "$HEAD_REPOSITORY" --argjson number "$PR_NUMBER" '
              [.[] | select(.head_sha == $head and (.event == "pull_request" or .event == "pull_request_review")) |
                select(any(.pull_requests[]; .number == $number) or
                  (.pull_requests == [] and $repo != "" and .head_repository.full_name == $repo))] |
              max_by(.run_number) // {}' "$runs" > "$run"
            # Busy runs keep their hold annotations. Every scheduled pass rescans open PRs,
            # so defer them until completion without cancelling another active leg.
            if [[ $(jq --binary -r '.status' "$run") != completed || $(jq --binary -r '.conclusion' "$run") != failure ]]; then exit 0; fi
            review_release_unique_head
            run_id=$(jq --binary -er '.id' "$run")
            attempt=$(jq --binary -er '.run_attempt' "$run")
            HOLD_CAUSE="job read failed: run $run_id attempt $attempt"
            jobs=$(review_pages "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs" jobs)
            failed="$REVIEW_TMP/failed.json"
            jq --binary -c '[.[] | select(.conclusion == "failure")]' "$jobs" > "$failed"
            failed_count=$(jq --binary 'length' "$failed")
            held=false
            for ((job_index=0; job_index<failed_count && job_index<2000; job_index++)); do
              check_url=$(jq --binary -er --argjson i "$job_index" '.[$i].check_run_url' "$failed")
              check_id="${check_url##*/}"
              [[ "$check_id" =~ ^[0-9]+$ ]]
              HOLD_CAUSE="annotation read failed: check $check_id"
              annotations=$(review_pages "repos/$GITHUB_REPOSITORY/check-runs/$check_id/annotations" '')
              if [[ $(jq --binary --arg title "$HOLD_TITLE" 'any(.[]; .title == $title and .annotation_level == "failure")' "$annotations") == true ]]; then
                held=true
              fi
            done
            if [[ "$held" != true ]]; then exit 0; fi
            review_count
            printf 'PR %s: %s\n' "$PR_NUMBER" "$HOLD_CAUSE" >> "$GITHUB_STEP_SUMMARY"
            if ((REVIEW_THREADS > 0 || REVIEW_PENDING > 0)); then exit 0; fi
            # Revalidate immediately before mutation: another release/manual rerun or a
            # head update during the recount must not rerun an obsolete attempt.
            HOLD_CAUSE="run revalidation failed: $run_id"
            current="$REVIEW_TMP/current-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$current"
            if [[ $(jq --binary -r '.status' "$current") != completed || $(jq --binary -r '.run_attempt' "$current") != "$attempt" ]]; then exit 0; fi
            HOLD_CAUSE="head revalidation failed: $PR_NUMBER"
            current_pr="$REVIEW_TMP/current-pr.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$current_pr"
            if [[ $(jq --binary -r '.head.sha' "$current_pr") != "$HEAD_SHA" || $(jq --binary -r '.state' "$current_pr") != open ]]; then exit 0; fi
            if [[ $(jq --binary '.pull_requests == []' "$run") == true && $(jq --binary -r '.head.repo.full_name' "$current_pr") != "$HEAD_REPOSITORY" ]]; then exit 0; fi
            # Recount after the run/head reads: a new thread or bot hold must defer release.
            review_count
            if ((REVIEW_THREADS > 0 || REVIEW_PENDING > 0)); then exit 0; fi
            review_release_unique_head
            HOLD_CAUSE="rerun failed: $run_id"
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
            printf 'Released PR %s: run %s attempt %s\n' "$PR_NUMBER" "$run_id" "$attempt" >> "$GITHUB_STEP_SUMMARY"
          )
          HOLD_CAUSE='open pull request read failed'
          if [[ -n "${REVIEW_PR_NUMBER:-}" ]]; then
            HOLD_CAUSE='event pull request number invalid'
            [[ "$REVIEW_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            HOLD_CAUSE="event pull request read failed: $REVIEW_PR_NUMBER"
            event_pr="$REVIEW_TMP/event-pr.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$REVIEW_PR_NUMBER" > "$event_pr"
            prs="$REVIEW_TMP/prs.json"
            jq --binary -ce '[select(.state == "open")]' "$event_pr" > "$prs"
          else
            prs=$(review_pages "repos/$GITHUB_REPOSITORY/pulls?state=open&sort=created&direction=asc" '')
          fi
          pr_count=$(jq --binary 'length' "$prs")
          read_failed=0
          for ((pr_index=0; pr_index<pr_count && pr_index<2000; pr_index++)); do
            # The child owns its fatal trap; the parent records failure and keeps scanning.
            trap - ERR
            set +e
            review_release_pr
            pr_status=$?
            set -e
            trap 'HOLD_TITLE="$RELEASE_TITLE"; review_error' ERR
            if ((pr_status != 0)); then read_failed=1; fi
          done
          exit "$read_failed"
