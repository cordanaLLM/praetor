name: Release Binaries

# One flow builds, catalogues, signs and publishes a release: GoReleaser uploads the archives,
# their per-archive Syft SBOMs and the keyless checksums bundle into a draft release, the job
# signs SLSA v1.0 provenance over every checksummed file and verifies both bundles against
# this workflow's identity, and only then publishes. Nothing is uploaded after publication,
# so a repository with immutable releases accepts every asset (#43), and every SBOM
# describes a released archive rather than the source tree (#315).
#
# SLSA Build Level 3 is not claimed: the provenance is generated and signed in the job that
# ran the build steps, and Level 3 requires signing isolated from them (#330).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Build, SBOMs, Signed Provenance & Publish (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: release-binaries
          go-version: '1.27'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      # A deprecated key still builds, but only until the next major of goreleaser drops
      # it, at which point the release breaks with no earlier warning. check fails on it.
      - name: Check GoReleaser Configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      # .goreleaser.yaml sets release.draft, so this leaves the release unpublished.
      - name: Build Archives, SBOMs And The Checksums Bundle Into A Draft Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify The Checksums Bundle Against This Workflow
        env:
          SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-binaries.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Generate SLSA Provenance Over Every Checksummed File
        env:
          SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-binaries.yml@${{ github.ref }}
        run: |
          go run ./cmd/standardsctl provenance \
            -checksums dist/checksums.txt \
            -builder "$SIGNER" \
            -out dist/provenance.intoto.json

      - name: Sign The Provenance As An In-Toto Attestation
        run: |
          cosign attest-blob --yes \
            --statement dist/provenance.intoto.json \
            --bundle dist/provenance.intoto.json.sigstore.json

      - name: Verify The Provenance For Every Released File
        env:
          SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-binaries.yml@${{ github.ref }}
        run: |
          while read -r _ name; do
            cosign verify-blob-attestation \
              --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --type slsaprovenance1 \
              --bundle dist/provenance.intoto.json.sigstore.json \
              "dist/${name#\*}"
          done < dist/checksums.txt

      - name: Attach The Provenance And Publish The Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            dist/provenance.intoto.json \
            dist/provenance.intoto.json.sigstore.json
          gh release edit "$TAG" --draft=false
