name: Release Binaries (SLSA Level 3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Build, SBOM Generation & Keyless Signing (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: release-binaries
          go-version: '1.27'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Run GoReleaser (Multi-Arch Binaries & Syft SBOMs)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Repository CycloneDX SBOM
        run: syft dir:. -o cyclonedx-json=cordana-standards-cyclonedx.json

      - name: Generate Repository SPDX SBOM
        run: syft dir:. -o spdx-json=cordana-standards-spdx.json

      - name: Cosign Keyless Sign Repository SBOMs via OIDC (SLSA Level 3)
        run: |
          cosign sign-blob --yes \
            --bundle cordana-standards-cyclonedx.json.sigstore.json \
            cordana-standards-cyclonedx.json
          cosign sign-blob --yes \
            --bundle cordana-standards-spdx.json.sigstore.json \
            cordana-standards-spdx.json

      - name: Upload Signed SBOM Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            cordana-standards-cyclonedx.json \
            cordana-standards-cyclonedx.json.sigstore.json \
            cordana-standards-spdx.json \
            cordana-standards-spdx.json.sigstore.json \
            --clobber
