name: Security Scan

on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    branches:
      - main
      - 'lts-*'
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    # Push and pull request legs run everywhere: verification follows the code. Only the
    # schedule leg is engine-only and is skipped outside the canonical repository (#189).
    # The name is a required status context and therefore carries no skip reason.
    name: Go Vulnerability & AST Security Scan
    if: github.event_name != 'schedule' || github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: security-scan
          go-version: '1.27'

      - name: Install Toolchains
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Vulnerability Scan (govulncheck)
        run: govulncheck ./...

      - name: Run AST Security Scan (gosec)
        run: python3 -B .config/lefthook/scripts/security_scope.py -- gosec -conf .gosec.json
