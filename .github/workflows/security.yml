name: Security Scan

on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    branches:
      - main
      - 'lts-*'
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    # Push and pull request legs run everywhere: verification follows the code. Only the
    # schedule leg is engine-only and is skipped outside the canonical repository (#189).
    # A Renovate pull request skips the scan: the update is taken over on a signed-off branch
    # whose own pull request runs it. github.head_ref is empty on push and schedule runs, so
    # those are unchanged, and the leading term keeps the check required (renovateBranchSkip in
    # internal/forge/workflow_guard.go).
    # The name is a required status context and therefore carries no skip reason.
    name: Go Vulnerability & AST Security Scan
    if: "!startsWith(github.head_ref, 'renovate/') && (github.event_name != 'schedule' || github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor'))"
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: security-scan
          go-version: '1.27'

      # tools/go/go.mod is the one version source for both scanners; Renovate keeps it current.
      - name: Install Toolchains
        run: go install -modfile=tools/go/go.mod golang.org/x/vuln/cmd/govulncheck github.com/securego/gosec/v2/cmd/gosec

      - name: Run Vulnerability Scan (govulncheck)
        run: govulncheck ./...

      - name: Run AST Security Scan (gosec)
        run: python3 -B .config/lefthook/scripts/security_scope.py -- gosec -conf .gosec.json

      # The npm locks Praetor ships or builds from are audited from the lock alone, without an
      # install; the schedule leg catches an advisory published after a lock last changed.
      # docs/presets/starlight stays out until #647 clears its critical astro advisory, and the
      # step says so rather than reporting it as audited.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit npm Locks (npm audit, high and critical)
        run: |
          status=0
          for dir in tools/markdownlint tools/figures editors/vscode; do
            echo "npm audit --package-lock-only --audit-level=high: $dir"
            (cd "$dir" && npm audit --package-lock-only --audit-level=high) || status=1
          done
          echo "npm audit skipped: docs/presets/starlight (cordanaLLM/praetor#647, astro 7 upgrade)"
          exit "$status"
