name: Security Scan

# The hosted gate shape (internal/ghworkflow/hostedgate.go, docs/guides/workflow-triggers.md): a
# pull request runs on every activity that can change what merges, and the job fails a draft in
# its first step and runs once the draft is marked ready (ready_for_review). The schedule leg
# stays.
on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'lts-*'
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    # Push and pull request legs run everywhere: verification follows the code. Only the
    # schedule leg is engine-only and is skipped outside the canonical repository (#189).
    # A Renovate pull request, one the Renovate app opened from a renovate/ branch, skips the scan:
    # the update is taken over on a signed-off branch whose own pull request runs it. A person's
    # branch named renovate/... runs it. github.head_ref is empty on push and schedule runs, so
    # those are unchanged, and the leading term keeps the check required (renovateBranchSkip in
    # internal/forge/workflow_guard.go).
    # The name is a required status context and therefore carries no skip reason.
    name: Go Vulnerability & AST Security Scan
    if: "!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]') && (github.event_name != 'schedule' || github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor'))"
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      # The hosted gate's draft step, as ghworkflow.HostedGateDraftStep renders it: on a draft the
      # job fails here with the annotation the checkpoint planner reads as draft pending. Every
      # later step carries no condition, so it is skipped after this failure.
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Go vulnerability gate below reports every standard library advisory against the
      # toolchain that scans. go.mod's toolchain directive is the one source of that version:
      # go-version-file reads it, and an exact version missing from the actions/go-versions
      # manifest (which lags a release) is downloaded from go.dev instead. A range plus
      # check-latest resolves through the manifest and stayed on a vulnerable patch release while
      # the manifest job was failing. Renovate keeps the directive current.
      - name: Setup Go Toolchain
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: security-scan
          go-version: ${{ steps.setup-go.outputs.go-version }}

      # tools/go/go.mod is the one version source for both scanners; Renovate keeps it current.
      - name: Install Toolchains
        run: go install -modfile=tools/go/go.mod golang.org/x/vuln/cmd/govulncheck github.com/securego/gosec/v2/cmd/gosec

      # The Go vulnerability gate (internal/govuln) runs the pinned govulncheck above at symbol
      # level and judges each uncalled advisory against security/vex/go.openvex.json, the check
      # gate run's security stage makes; exit 2 means the scan gave no verdict.
      - name: Run Vulnerability Scan (govulncheck)
        run: go run ./cmd/standardsctl security govuln

      - name: Run AST Security Scan (gosec)
        run: python3 -B .config/lefthook/scripts/security_scope.py -- gosec -conf .gosec.json

      # Go modules nested below the root (NESTED_GO_MODULES in the Makefile) are outside ./...,
      # so the two scans above never reach them; these targets run the same scanners there.
      - name: Run Vulnerability Scan On Nested Modules
        run: make vuln-nested

      - name: Run AST Security Scan On Nested Modules
        run: make sec-nested

      # The npm locks Praetor ships or builds from are audited from the lock alone, without an
      # install; the schedule leg catches an advisory published after a lock last changed.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A high or critical advisory fails unless .config/security/npm-audit-exceptions.json
      # names it for that lock with a reason and an unexpired date (scripts/npm_audit_gate.py;
      # scripts/test_npm_audit_gate.py pins this step).
      - name: Audit npm Locks (npm audit, high and critical)
        run: python3 -B scripts/npm_audit_gate.py tools/markdownlint tools/figures editors/vscode docs/presets/starlight
