name: Praetor Fast Adoption Bot

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "Target path to adopt"
        required: false
        default: "."
      dry_run:
        description: "Dry run simulation"
        required: false
        default: "false"
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  adopt:
    name: Execute Fast Adoption
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/adopt')) ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/dogfood'))
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
          check-latest: true

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: adopt
          go-version: '1.27'

      - name: Build Praetor CLI
        run: |
          go build -o /usr/local/bin/standardsctl ./cmd/standardsctl

      - name: Execute Dogfood Benchmark
        if: contains(github.event.comment.body, '/dogfood')
        run: |
          standardsctl dogfood --path=.

      - name: Execute Fast Adoption
        if: "!contains(github.event.comment.body, '/dogfood')"
        run: |
          standardsctl adopt --path=. --force --record-baseline
          standardsctl compile-context --verify

      # HISS-13: a re-recorded baseline must not grow versus the default branch. The audit
      # fails before anything is committed when --record-baseline absorbed new debt without
      # a recorded rationale.
      - name: Enforce Monotonic Debt Ratchet
        if: "!contains(github.event.comment.body, '/dogfood')"
        env:
          CI: "true"
        run: |
          standardsctl audit --base=origin/${{ github.event.repository.default_branch }}

      - name: Commit & Push Adoption Changes
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          git config --global user.name "cordana-standards[bot]"
          git config --global user.email "standards-bot@cordana.ai"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(governance): adopt repository into Praetor baseline"
            git push
          fi
