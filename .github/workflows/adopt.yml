name: Praetor Fast Adoption Bot

# A dispatch is an operator with write access asking for an adoption to be committed.
# Only this job holds contents: write, and only its commit step is handed the token.
#
# internal/forge/workflow_permissions.go audits the permission split on every test run, and
# internal/forge/adopt_workflow_test.go pins the dispatch and comment entry points.
on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "Target path to adopt"
        required: false
        default: "."
      dry_run:
        description: "Dry run: plan the adoption on the runner without writing a file; no ratchet, no commit"
        required: false
        default: "false"
        type: boolean

permissions: {}

jobs:
  adopt:
    name: Execute Fast Adoption
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # This job builds standardsctl and adopts one repository; a finite bound replaces GitHub's
    # 360-minute default for a run that hangs on the network.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The adoption step builds and runs praetor from this checkout, so the checkout keeps no
      # credential for it to find; the commit step is handed the token on its own.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Go is set up here, before the action sets it up again, so the job keeps a build cache
      # of its own and stays inside AuditGoBuildCaches (internal/forge/go_cache_checks.go),
      # which reads the setup-go steps of workflow jobs and not those inside an action. The
      # action's own setup-go cache is off for the same reason.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: adopt
          go-version: ${{ steps.setup-go.outputs.go-version }}

      # target_path reaches standardsctl through the action's path input, which the action
      # passes through env as one argument (.github/actions/praetor-adopt/action.yml).
      - name: Execute Fast Adoption
        id: praetor
        uses: ./.github/actions/praetor-adopt
        with:
          path: ${{ inputs.target_path }}
          mode: adopt
          # The action runs its own setup-go with check-latest; pass the exact version resolved
          # above so it finds that toolchain in the tool cache instead of the lagging manifest.
          go-version: ${{ steps.setup-go.outputs.go-version }}
          dry-run: ${{ inputs.dry_run }}
          force: "true"
          record-baseline: "true"
          cache: "false"

      # HISS-13: adoption records a first baseline and keeps an existing one, so the run above
      # cannot absorb new debt into it. When the repository carries debt the kept baseline does
      # not record, that run exits 0 and its report, in the job summary, ends with
      # "not ready yet: Debt Baseline" in place of the success line; this audit is the step that
      # fails on the same verdict, before anything is committed. It also fails when the baseline
      # grew versus the default branch without a recorded rationale. A dry run records no
      # baseline and writes no .standards.yaml, so there is nothing to ratchet and, on a
      # repository not yet adopted, no manifest to read.
      - name: Enforce Monotonic Debt Ratchet
        if: inputs.dry_run != true
        shell: bash
        env:
          CI: "true"
          PRAETOR_BIN: ${{ steps.praetor.outputs.binary }}
          TARGET_PATH: ${{ inputs.target_path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          "$PRAETOR_BIN" audit
          "--config=$TARGET_PATH/.standards.yaml"
          "--base=origin/$DEFAULT_BRANCH"

      # The token travels in the environment of the one git command that pushes, as the
      # authorization header actions/checkout would have persisted, so it is never written to
      # the repository config and never appears in an argument vector. The commit is signed
      # off because the compliance gate checks DCO 1.1 on direct pushes as well.
      - name: Commit & Push Adoption Changes
        if: inputs.dry_run != true
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ${{ vars.PRAETOR_BOT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.PRAETOR_BOT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A
          if git diff-index --quiet --cached HEAD; then
            echo "adopt: the adoption changed nothing; nothing to commit"
            exit 0
          fi
          git commit --signoff -m "chore(governance): adopt repository into Praetor baseline"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "HEAD:$GITHUB_REF"
