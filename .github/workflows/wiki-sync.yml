---
name: Wiki Sync

'on':
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
      - 'scripts/sync_github_wiki.sh'
      # The sync renders figure fences from these (node tools/figures/build.mjs portable --wiki).
      - 'docs/assets/figures/**'
      - 'tools/figures/build.mjs'
      - 'tools/figures/checks.mjs'
      - 'tools/figures/core.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Mirror docs/wiki to GitHub Wiki (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The sync renders figure fences with tools/figures/build.mjs, which needs Node 22.18 or
      # later and no npm package.
      - name: Setup Node Toolchain
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Sync Wiki
        env:
          WIKI_TOKEN: ${{ github.token }}
          WIKI_GIT_TIMEOUT_SECONDS: '60'
        run: >-
          scripts/sync_github_wiki.sh
          "$GITHUB_WORKSPACE/docs/wiki"
          "https://github.com/${GITHUB_REPOSITORY}.wiki.git"
