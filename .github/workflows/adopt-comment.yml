name: Praetor Pull Request Comment Adoption

# A `/adopt` or `/dogfood` comment on a pull request asks for a report on that pull
# request's head. issue_comment runs this default-branch file with the base repository's
# token for anyone who can comment, so the job admits trusted commenters only, holds read
# scopes only, runs only heads pushed to this repository, and saves no Go cache.
#
# internal/forge/workflow_permissions.go audits the permission split on every test run, and
# internal/forge/adopt_workflow_test.go pins the rest of this shape and executes the head
# lookup's shell body against a stub gh.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  adopt-comment:
    name: Execute Pull Request Comment Adoption
    # The author_association conjunct keeps strangers out: OWNER, MEMBER and COLLABORATOR are
    # the associations the repository granted, and every other value is within reach of any
    # account (trustedAssociation in internal/forge/workflow_permissions.go).
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/adopt') || contains(github.event.comment.body, '/dogfood')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # An issue_comment payload carries the issue, not the pull request, so the event has no
      # pull_request object to read a head from, and a checkout without a ref takes the default
      # branch. The head is asked for by number instead.
      #
      # The steps below build and run the head, and load ./.github/actions/praetor-adopt from
      # it, inside the default branch's context. Read scopes do not make that harmless: code in
      # the job can still save entries to the Actions cache in the default branch's scope,
      # which the dispatch job and every other branch restore. So only a head pushed to this
      # repository runs. Pushing here takes write access, and an account with write access can
      # start this job by commenting anyway, so a push that lands between the comment and the
      # lookup lets in no one the commenter gate keeps out. A fork head is refused, and so is a
      # head whose repository was deleted. The head is read when the job starts, and the
      # repository and the commit come from one answer, so the check covers the commit that
      # runs, not the one the comment saw.
      #
      # Every payload value reaches the script through env, never spliced into it;
      # GITHUB_REPOSITORY is the runner's own default variable.
      - name: Resolve Pull Request Head
        id: pr-head
        # One API call; it answers in seconds or not at all.
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            '' | *[!0-9]*)
              echo "adopt: the comment names no pull request number (got '$PR_NUMBER')" >&2
              exit 1
              ;;
          esac
          query='.head.repo.full_name // "", .head.sha // ""'
          if ! answer="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq "$query")"; then
            echo "adopt: could not read pull request #$PR_NUMBER of $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          # Two lines: the head's repository, then its commit. Any further line stays in sha
          # and fails the commit id check.
          repo="${answer%%$'\n'*}"
          sha="${answer#*$'\n'}"
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "adopt: pull request #$PR_NUMBER's head lives in '${repo:-a deleted repository}'," \
              "not in $GITHUB_REPOSITORY; this job builds and runs the head, so it runs only heads" \
              "pushed to this repository" >&2
            exit 1
          fi
          if [[ ! "$sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "adopt: pull request #$PR_NUMBER resolved to head '$sha', which is not a commit id" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # This is the pull request's code, and the steps below build and run it, so no
      # credential is left in the checkout for it to find.
      - name: Checkout Pull Request Head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-head.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The head's go.mod toolchain directive names the Go release, as in the adopt job above.
      # The action runs its own setup-go with check-latest, which resolves a range through the
      # lagging setup-go manifest; an exact release missing there is downloaded from go.dev.
      # This job keeps no Go cache, so it reads the release from go.mod instead of running a
      # setup-go step of its own (AuditGoBuildCaches would ask that step for a cache).
      - name: Resolve Go Release
        id: go-release
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          release="$(sed -n 's/^toolchain go\([0-9][0-9a-z.]*\)$/\1/p' go.mod)"
          if [ -z "$release" ]; then
            echo "adopt: go.mod at the pull request head names no toolchain directive" >&2
            exit 1
          fi
          echo "go-version=$release" >> "$GITHUB_OUTPUT"

      # cache: "false" keeps setup-go from saving what this job built into the default
      # branch's cache scope; the job restores no cache either.
      - name: Execute Dogfood Benchmark
        if: contains(github.event.comment.body, '/dogfood')
        uses: ./.github/actions/praetor-adopt
        with:
          mode: dogfood
          cache: "false"
          go-version: ${{ steps.go-release.outputs.go-version }}

      - name: Execute Fast Adoption
        id: praetor
        if: "!contains(github.event.comment.body, '/dogfood')"
        uses: ./.github/actions/praetor-adopt
        with:
          mode: adopt
          force: "true"
          record-baseline: "true"
          cache: "false"
          go-version: ${{ steps.go-release.outputs.go-version }}

      - name: Enforce Monotonic Debt Ratchet
        if: "!contains(github.event.comment.body, '/dogfood')"
        shell: bash
        env:
          CI: "true"
          PRAETOR_BIN: ${{ steps.praetor.outputs.binary }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          "$PRAETOR_BIN" audit
          "--base=origin/$DEFAULT_BRANCH"
