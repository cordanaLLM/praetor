name: Sync Moving Flavor Tags

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-tags:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Reconcile Moving Flavor Tags (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: sync-flavors
          go-version: '1.27'

      # One step moves and publishes every flavor declared in .config/flavors.yaml. A
      # flavor whose source does not exist yet (latest before the first v* tag, lts before
      # the first lts-* branch) is reported as pending and left untouched, so it no longer
      # blocks the flavors that can move, and latest is never aliased to main (#205).
      - name: Reconcile And Publish Declared Flavors
        run: go run ./cmd/standardsctl flavors sync --push --remote=origin
