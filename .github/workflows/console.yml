name: Console

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'
  push:
    branches: [main]
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'

permissions:
  contents: read

concurrency:
  # Pull request runs replace an older run of the same pull request; a push or scheduled run
  # gets its own group and is never cancelled, so every main commit gets its verdict (#1566:
  # a run per merge cancelled the 60 to 100 minute Windows job of the commit before).
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  console:
    # Playwright 1.56.1 installs its Chromium on Ubuntu 24.04 but refuses ubuntu26.04-x64
    # ("does not support chromium"); move to ubuntu-26.04 with the Playwright update that
    # supports it.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      # The hosted gate's draft step (see the verify job in ci.yml).
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        working-directory: .
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check
      # Includes a real fixture build importing a large module, refused by the budget CLI.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm fixtures:copy
      - run: pnpm budget
      - run: pnpm test:a11y
      - run: pnpm test:a11y:planted
