name: Console

on:
  pull_request:
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'
  push:
    branches: [main]
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'

permissions:
  contents: read

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check
      # Includes a real fixture build importing a large module, refused by the budget CLI.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm fixtures:copy
      - run: pnpm budget
      - run: pnpm test:a11y
      - run: pnpm test:a11y:planted
