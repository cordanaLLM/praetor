name: CI Enforcement

on:
  push:
    branches:
      - main
      - 'lts-*'
      - 'checkpoint/**'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'lts-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Standards & Invariant Verification Gate
    runs-on: ubuntu-latest
    # Full verification routinely takes 14-15 minutes; main run 35516836823
    # passed every gate but was canceled during cache cleanup at the 15-minute
    # ceiling. Keep a finite bound with headroom for normal runner variance.
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: ci-verify
          go-version: '1.27'

      - name: Detect Changed Paths & Evaluate CI Filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          go run ./cmd/standardsctl ci filter --base="$BASE_REF" --head=HEAD --env

      - name: Setup Node Toolchain
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install Security Toolchains (govulncheck & gosec)
        if: steps.filter.outputs.run_security != 'false' || github.event_name == 'push'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Install Pinned Git Hook Toolchain
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: |
          go install github.com/evilmartians/lefthook/v2@v2.1.12
          lefthook version

      # The venv itself is not cached: it embeds absolute paths and a Python patch bump
      # would restore a broken one. The wheel cache is what the install time actually goes
      # on, and it is keyed on the pinned requirements, so it is exact rather than rolling.
      - name: Restore Python Wheel Cache
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: praetor-pip-${{ runner.os }}-${{ hashFiles('.config/semgrep/requirements.txt') }}
          restore-keys: |
            praetor-pip-${{ runner.os }}-

      - name: Install Pinned HISS Rule Test Engine
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: |
          python3 -m venv "$RUNNER_TEMP/praetor-semgrep"
          "$RUNNER_TEMP/praetor-semgrep/bin/python" -m pip install -r .config/semgrep/requirements.txt
          echo "$RUNNER_TEMP/praetor-semgrep/bin" >> "$GITHUB_PATH"

      - name: Verify Go Formatting (gofmt)
        if: steps.filter.outputs.run_linters != 'false' || github.event_name == 'push'
        run: |
          # testdata is fixture input, not source: a HISS-10 fixture is deliberately
          # unformatted because that is what it demonstrates. Go never builds testdata
          # either, and the pre-commit hook applies the same exclusion.
          UNFORMATTED=$(git ls-files -z '*.go' ':!:*testdata/*' | xargs -0 --no-run-if-empty gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "Formatting error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "Go formatting clean."

      - name: Enforce Linear History (HISS & Branch Protection)
        if: github.event_name == 'pull_request'
        run: |
          MERGE_COMMITS=$(git rev-list --min-parents=2 HEAD ^origin/${{ github.base_ref }} || true)
          if [ -n "$MERGE_COMMITS" ]; then
            echo "::error::Merge commits detected in PR branch. Linear history is enforced by .standards.yaml policy."
            echo "$MERGE_COMMITS"
            exit 1
          fi
          echo "Linear history verified: zero merge commits."

      # The gate runs unconditionally: an empty PR body is the one input the validator
      # treats as a hard failure, so skipping the step for it would disable the gate
      # exactly where it matters. The body is passed through the environment, never
      # interpolated into the shell script.
      - name: Validate PR Governance Checklist & Exit-0 Receipts
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          go run ./cmd/standardsctl forge validate-pr \
            --config=.standards.yaml \
            --head-sha="$PR_HEAD_SHA" \
            "$RUNNER_TEMP/pr_body.txt"

      # Backported from VMAFx/vmafx, which built this first and runs it as a blocking gate.
      # compile-context --verify proves the agent instructions stay in sync with AGENTS.md, and
      # docs sync harvests dependency documentation; neither checks whether this repository's own
      # docs still describe what its code does. Nothing did, so documentation drifted silently.
      - name: Documentation Drift (user-discoverable surfaces)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BASE_SHA}"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${HEAD_SHA}"
          python3 -B scripts/docs_drift.py

      - name: Enforce HISS-14 Migration Footers (Commit Lint)
        if: github.event_name == 'pull_request'
        run: go run ./cmd/standardsctl forge check-commits --base="origin/${{ github.base_ref }}" --head=HEAD

      - name: Verify Cross-Agent Context Synchronization (HISS-16)
        if: steps.filter.outputs.skip_heavy_gates == 'true' && steps.filter.outputs.run_context_sync != 'false' && github.event_name != 'push'
        run: go run ./cmd/standardsctl compile-context --verify

      - name: Documentation Integrity Audit
        if: steps.filter.outputs.docs_only == 'true' && github.event_name == 'pull_request'
        run: |
          echo "Pure documentation change detected. Running MkDocs verification."
          python3 -m pip install -r docs/presets/mkdocs/requirements.txt
          mkdocs build --strict

      # Heavy changes use the complete local authority once, including race tests,
      # context, audit, all configured linters, vulnerability and AST security scans.
      # Lightweight changes retain their selective governance checks below.
      - name: Full Verification Harness Gate
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        env:
          TEST_COVERPROFILE: ${{ runner.temp }}/praetor-coverage.out
        run: make verify-all

      - name: Enforce Statement Coverage Floor (HISS-15 coverage gate)
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        env:
          TEST_COVERPROFILE: ${{ runner.temp }}/praetor-coverage.out
          # HISS-15 is advertised as a CI coverage gate: the total statement coverage
          # must not fall below this floor (the tree sits above it; raise it as
          # coverage grows, never lower it).
          COVERAGE_FLOOR: "65"
        run: |
          TOTAL=$(go tool cover -func="$TEST_COVERPROFILE" | awk '/^total:/ { sub("%", "", $3); print $3 }')
          if [ -z "$TOTAL" ]; then
            echo "::error::Could not read total statement coverage from $TEST_COVERPROFILE"
            exit 1
          fi
          echo "Total statement coverage: ${TOTAL}% (floor ${COVERAGE_FLOOR}%)"
          awk -v total="$TOTAL" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (total + 0 < floor + 0) {
              printf "::error::Statement coverage %.1f%% is below the HISS-15 floor of %s%%\n", total, floor
              exit 1
            }
          }'

      - name: Run Repository Governance Audit (HISS Invariants & Rulesets)
        if: steps.filter.outputs.skip_heavy_gates == 'true' && steps.filter.outputs.run_audit != 'false' && github.event_name != 'push'
        run: go run ./cmd/standardsctl audit

      - name: Verify Binary Compilation
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: make build

  # The release pipeline and the update bot are configured in files that nothing else
  # compiles or executes, so a key that a tool stopped accepting rots silently until a
  # release or a bot run fails. Both validators are run against the files themselves.
  # Linux-only by nature: they are CI configuration checks, not a gate over host
  # behaviour, so there is nothing for a macOS or Windows runner to prove (HISS-21).
  config-validation:
    name: Release & Bot Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # The two configuration files are the whole input of this job, so a change that
      # touches neither skips it (HISS-18).
      - name: Detect Configuration Changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- .goreleaser.yaml renovate.json .github/workflows/ci.yml)
          if [ -n "$CHANGED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Validating: $CHANGED"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No release or bot configuration changed."
          fi

      - name: Validate GoReleaser Configuration
        if: steps.changed.outputs.run == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Setup Node Toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # --strict fails on a configuration the bot would silently migrate, which is how a
      # renamed option is caught: without it the validator reports the migration and still
      # exits 0.
      # --no-global validates renovate.json as repository config. A file named on the
      # command line is otherwise read as global self-hosted config, which accepts
      # global-only options (allowedCommands, onboarding) that the hosted bot rejects.
      - name: Validate Renovate Configuration
        if: steps.changed.outputs.run == 'true'
        run: npx --yes --package renovate@44 renovate-config-validator --strict --no-global renovate.json
