name: CI Enforcement

on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'lts-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Standards & Invariant Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Detect Changed Paths & Evaluate CI Filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          go run ./cmd/standardsctl ci filter --base="$BASE_REF" --head=HEAD --env

      - name: Install Security Toolchains (govulncheck & gosec)
        if: steps.filter.outputs.run_security != 'false' || github.event_name == 'push'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Verify Go Formatting (gofmt)
        if: steps.filter.outputs.run_linters != 'false' || github.event_name == 'push'
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Formatting error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "Go formatting clean."

      - name: Enforce Linear History (HISS-16 & Branch Protection)
        if: github.event_name == 'pull_request'
        run: |
          MERGE_COMMITS=$(git rev-list --min-parents=2 HEAD ^origin/${{ github.base_ref }} || true)
          if [ -n "$MERGE_COMMITS" ]; then
            echo "::error::Merge commits detected in PR branch. Linear history is enforced by .standards.yaml policy."
            echo "$MERGE_COMMITS"
            exit 1
          fi
          echo "Linear history verified: zero merge commits."

      - name: Validate PR Governance Checklist & Exit-0 Receipts
        if: github.event_name == 'pull_request' && github.event.pull_request.body != ''
        run: |
          cat << 'EOF' > /tmp/pr_body.txt
          ${{ github.event.pull_request.body }}
          EOF
          go run ./cmd/standardsctl forge validate-pr /tmp/pr_body.txt

      - name: Verify Cross-Agent Context Synchronization (HISS-16)
        if: steps.filter.outputs.run_context_sync != 'false' || github.event_name == 'push'
        run: go run ./cmd/standardsctl compile-context --verify

      - name: Documentation Integrity Audit
        if: steps.filter.outputs.docs_only == 'true' && github.event_name == 'pull_request'
        run: |
          echo "Pure documentation change detected. Running docs verification."
          go run ./cmd/standardsctl docs audit --all

      - name: Run Race Detection & Unit Tests (HISS-15)
        if: steps.filter.outputs.run_tests != 'false' || github.event_name == 'push'
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      # HISS-15 names a "CI coverage gate" as its enforcement mechanism. This is that gate:
      # without it, `go test` measures nothing and a package whose tests were deleted still
      # passes. MIN_COVERAGE is a floor, not a target; raise it as coverage improves.
      - name: Enforce Statement Coverage Threshold (HISS-15)
        if: steps.filter.outputs.run_tests != 'false' || github.event_name == 'push'
        env:
          MIN_COVERAGE: '65.0'
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::coverage.out was not produced by the test step."
            exit 1
          fi
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "Total statement coverage: ${TOTAL}% (minimum ${MIN_COVERAGE}%)"
          awk -v total="$TOTAL" -v min="$MIN_COVERAGE" 'BEGIN {
            if (total + 0 < min + 0) {
              printf "::error::Statement coverage %.1f%% is below the required %.1f%% (HISS-15).\n", total, min
              exit 1
            }
            printf "Coverage gate passed: %.1f%% >= %.1f%%.\n", total, min
          }'

      - name: Run Repository Governance Audit (HISS Invariants & Rulesets)
        if: steps.filter.outputs.run_audit != 'false' || github.event_name == 'push'
        run: go run ./cmd/standardsctl audit

      - name: Run Linter & Static Analysis (HISS-10)
        if: steps.filter.outputs.run_linters != 'false' || github.event_name == 'push'
        run: |
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run

      - name: Run AST Security Scan (gosec, zero exclusions)
        if: steps.filter.outputs.run_security != 'false' || github.event_name == 'push'
        run: gosec -conf .gosec.json ./...

      - name: Full Verification Harness Gate
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: make verify-all

      - name: Verify Binary Compilation
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: make build
