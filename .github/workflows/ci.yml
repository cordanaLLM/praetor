name: CI Enforcement

on:
  push:
    branches:
      - main
      - 'lts-*'
      - 'checkpoint/**'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'lts-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Standards & Invariant Verification Gate
    # Skipped on a Renovate pull request, one the Renovate app (renovate[bot]) opened from a
    # renovate/ branch: the update is taken over on a signed-off branch whose own pull request runs
    # this job, and a rebase of every open Renovate branch would otherwise fill every runner. A
    # person's pull request from a branch named renovate/... runs it. github.head_ref is empty on
    # push, so push runs are unchanged. The skip keeps the check required (renovateBranchSkip in
    # internal/forge/workflow_guard.go).
    if: "!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]')"
    runs-on: ubuntu-26.04
    # Keep a finite bound with headroom for normal runner variance. The job has outgrown its
    # limit twice: at 14-15 minutes it was cancelled during cache cleanup at a 15-minute
    # ceiling (main run 35516836823), and at 26-29 minutes on six consecutive pull requests a
    # slow runner cancelled a clean change at the 30-minute one (#729). 45 leaves headroom
    # until the job is made faster or split.
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # make verify-all runs the Go vulnerability gate (make vuln), which reports every standard
      # library advisory against the toolchain that scans. check-latest takes the newest 1.27
      # patch release instead of the one the runner image has cached, so a Go security release
      # stops failing the gate as soon as the runner can download it.
      - name: Setup Go Toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
          check-latest: true

      - name: Restore Go Module And Build Caches
        id: gocache
        uses: ./.github/actions/go-cache
        with:
          job: ci-verify
          go-version: '1.27'

      - name: Detect Changed Paths & Evaluate CI Filter
        id: base
        uses: ./.github/actions/changed-paths
      - name: Evaluate CI Filter
        id: filter
        run: go run ./cmd/standardsctl ci filter --base="${{ steps.base.outputs.base_ref }}" --head=HEAD --env

      - name: Setup Node Toolchain
        if: steps.filter.outputs.skip_heavy_gates != 'true' || steps.filter.outputs.run_docs == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            editors/vscode/package-lock.json
            tools/figures/package-lock.json
            tools/markdownlint/package-lock.json

      # tools/go/go.mod is the one version source for the security scanners (Renovate keeps
      # it current); the Makefile runs them through `go tool` from the same file, and the
      # installed binaries serve the hook self-tests that call gosec from PATH.
      - name: Install Security Toolchains (govulncheck & gosec)
        if: steps.filter.outputs.run_security != 'false' || github.event_name == 'push'
        run: go install -modfile=tools/go/go.mod golang.org/x/vuln/cmd/govulncheck github.com/securego/gosec/v2/cmd/gosec

      - name: Install Pinned Git Hook Toolchain
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: |
          go install github.com/evilmartians/lefthook/v2@v2.1.14
          lefthook version

      # Pinned, not inherited. Three steps below run `python3` -- the semgrep venv, the
      # docs-drift check and the MkDocs install -- and without this the interpreter is
      # whatever the runner image ships: ubuntu-24.04 shipped 3.12 and ubuntu-26.04 ships
      # 3.14.4, so the OS bump alone changed all three. It also takes the mkdocs
      # `pip install` off a PEP-668 system interpreter. Unconditional because those three
      # steps are gated on three different conditions. Keep it equal to the setup-python
      # version pages.yml and portability.yml pin.
      - name: Setup Python Toolchain
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The venv itself is not cached: it embeds absolute paths and a Python patch bump
      # would restore a broken one. The wheel cache is what the install time actually goes
      # on, and it is keyed on the pinned requirements, so it is exact rather than rolling.
      #
      # The key carries the resolved interpreter version because runner.os is the literal
      # "Linux" on every Ubuntu image: without it an entry populated under 3.12 restores
      # onto a 3.14 job and hands it wheels built for the wrong ABI tag. It carries the
      # runner image for the same reason the Go keys do, read off the go-cache action's
      # own output rather than resolved a second time here: a wheel built against the
      # 24.04 C library must not restore onto 26.04.
      - name: Restore Python Wheel Cache
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: praetor-pip-${{ runner.os }}-${{ steps.gocache.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.config/semgrep/requirements.txt', '.config/hook-lint/requirements.txt') }}
          restore-keys: |
            praetor-pip-${{ runner.os }}-${{ steps.gocache.outputs.image }}-py${{ steps.python.outputs.python-version }}-

      - name: Install Pinned HISS Rule Test Engine
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: |
          python3 -m venv "$RUNNER_TEMP/praetor-semgrep"
          "$RUNNER_TEMP/praetor-semgrep/bin/python" -m pip install -r .config/semgrep/requirements.txt
          echo "$RUNNER_TEMP/praetor-semgrep/bin" >> "$GITHUB_PATH"

      # make hooks-lint (part of verify-all) lints the canonical hook sources with the
      # tools from this hash-locked lock. The venv stays off PATH so its packages cannot
      # shadow another step's python3; PRAETOR_HOOK_LINT_BIN points the gate at it and makes a
      # missing or mismatched tool fail the gate instead of skipping it.
      - name: Install Pinned Hook Lint Toolchain
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: |
          python3 -m venv "$RUNNER_TEMP/praetor-hook-lint"
          "$RUNNER_TEMP/praetor-hook-lint/bin/python" -m pip install --require-hashes -r .config/hook-lint/requirements.txt
          echo "PRAETOR_HOOK_LINT_BIN=$RUNNER_TEMP/praetor-hook-lint/bin" >> "$GITHUB_ENV"

      - name: Verify Go Formatting (gofmt)
        if: steps.filter.outputs.run_linters != 'false' || github.event_name == 'push'
        # make fmt-check is the one gofmt check (testdata fixtures stay out of scope); the
        # pre-commit hook runs the same check on the staged set.
        run: make fmt-check

      - name: Enforce Linear History (HISS & Branch Protection)
        if: github.event_name == 'pull_request'
        run: |
          MERGE_COMMITS=$(git rev-list --min-parents=2 HEAD ^origin/${{ github.base_ref }})
          if [ -n "$MERGE_COMMITS" ]; then
            echo "::error::Merge commits detected in PR branch. Linear history is enforced by .standards.yaml policy."
            echo "$MERGE_COMMITS"
            exit 1
          fi
          echo "Linear history verified: zero merge commits."

      # The gate runs unconditionally: an empty PR body is the one input the validator
      # treats as a hard failure, so skipping the step for it would disable the gate
      # exactly where it matters. The body is passed through the environment, never
      # interpolated into the shell script.
      - name: Validate PR Governance Checklist & Exit-0 Receipts
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          go run ./cmd/standardsctl forge validate-pr \
            --config=.standards.yaml \
            --head-sha="$PR_HEAD_SHA" \
            "$RUNNER_TEMP/pr_body.txt"

      # Backported from a downstream adopter's blocking gate.
      # compile-context --verify proves the agent instructions stay in sync with AGENTS.md, and
      # docs sync harvests dependency documentation; neither checks whether this repository's own
      # docs still describe what its code does. Nothing did, so documentation drifted silently.
      # The surfaces are the docs_surfaces of .standards.yaml, the same declaration an adopter
      # writes, and the check is the one adopters run (docs/guides/documentation-drift.md). The
      # body is passed through the environment into a file, never interpolated into the script.
      - name: Documentation Drift (user-discoverable surfaces)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BASE_SHA}"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${HEAD_SHA}"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/docs_drift_body.txt"
          go run ./cmd/standardsctl docs references --path=. \
            --base="$BASE_SHA" --head="$HEAD_SHA" \
            --pr-body-file="$RUNNER_TEMP/docs_drift_body.txt"

      - name: Enforce HISS-14 Migration Footers (Commit Lint)
        if: github.event_name == 'pull_request'
        run: go run ./cmd/standardsctl forge check-commits --base="origin/${{ github.base_ref }}" --head=HEAD

      - name: Verify Cross-Agent Context Synchronization (HISS-16)
        if: steps.filter.outputs.skip_heavy_gates == 'true' && steps.filter.outputs.run_context_sync != 'false' && github.event_name != 'push'
        run: go run ./cmd/standardsctl compile-context --verify

      - name: Documentation Integrity Audit
        if: steps.filter.outputs.run_docs == 'true' && github.event_name == 'pull_request'
        run: |
          echo "Documentation change detected. Running MkDocs verification."
          python3 -m pip install --require-hashes -r docs/presets/mkdocs/requirements.txt
          # A documentation-only pull request skips verify-all, so its figure gate runs here: the
          # engine's own tests and typecheck and the committed player (`bundle.mjs --check`: a
          # byte-for-byte rebuild from the lock within its budget) in docs-figures-check, then
          # the managed docs-figures target every adopter runs: `check` (a hand-edited committed
          # SVG, static SVG or JSON no longer matches its spec) and `sources` (ADR-0015,
          # ADR-0016). The site serves that committed player through the MkDocs hook, so nothing
          # is bundled before the build.
          make -s docs-figures-check
          make -s docs-figures
          mkdocs build --strict
          # A strict build still passes when a ```figure fence does not become a figure. The root
          # site renders figures only, so this also fails any Mermaid fence it builds, and every
          # figure SVG must embed the props the player mounts.
          node tools/figures/build.mjs site --config mkdocs.yml --docs docs --site site
          python3 -B scripts/test_docs_seo_presets.py
          go run ./cmd/standardsctl seo audit site
          # The preset's own mkdocs.yml lists the figure hook an adopted repository holds, so the
          # docs-presets job builds and figure-checks it in an adopted fixture on every change
          # under docs/presets/, tools/figures/ or the adoption code that writes the engine, not
          # only on documentation-only pull requests.

      - name: Markdown Documentation Governance
        if: steps.filter.outputs.run_docs == 'true' && steps.filter.outputs.skip_heavy_gates == 'true' && github.event_name != 'push'
        run: make docs-lint

      # BUG-992: a guide naming a removed command, flag or file is drift no diff shows, because
      # the guide itself did not change. Heavy runs reach the same target through verify-all;
      # this step covers the light documentation runs that skip it.
      - name: Documentation References (commands, flags, repository paths)
        if: steps.filter.outputs.run_docs == 'true' && steps.filter.outputs.skip_heavy_gates == 'true' && github.event_name != 'push'
        run: make docs-references

      # docs/credits.yaml, the docs/credits.md page rendered from it, THIRD-PARTY-NOTICES.md and
      # the canonical personas and skills are inputs of the internal/supplychain tests, but the
      # filter classes them as documentation or agent text, and both select run_docs. Heavy runs
      # reach those tests through verify-all; this step covers the light runs that skip it, so an
      # edit the credits gate refuses cannot land through a documentation or agent-only pull request.
      - name: Credits and Notices Gate (internal/supplychain)
        if: steps.filter.outputs.run_docs == 'true' && steps.filter.outputs.skip_heavy_gates == 'true' && github.event_name != 'push'
        run: make credits-check

      # #338: how far the committed .devcontainer bundle is behind the source it was cut from.
      # The step prints the commit count and age and fails only past the devcontainer.freshness
      # bounds in .standards.yaml. Heavy runs reach the same target through verify-all; this step
      # covers the light runs that skip it, because every landed change, documentation included,
      # moves the bundle one commit further behind. The checkout above fetches full history,
      # which the commit count needs.
      - name: DevContainer Bundle Freshness
        if: steps.filter.outputs.skip_heavy_gates == 'true' && github.event_name != 'push'
        run: make devcontainer-freshness

      # Heavy changes use the complete local authority once, including race tests,
      # context, audit, all configured linters, vulnerability and AST security scans.
      # Lightweight changes retain their selective governance checks below.
      - name: Full Verification Harness Gate
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        env:
          TEST_COVERPROFILE: ${{ runner.temp }}/praetor-coverage.out
        run: make verify-all

      - name: Enforce Statement Coverage Floor (HISS-15 coverage gate)
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        env:
          TEST_COVERPROFILE: ${{ runner.temp }}/praetor-coverage.out
          # HISS-15 is advertised as a CI coverage gate: the total statement coverage
          # must not fall below this floor (the tree sits above it; raise it as
          # coverage grows, never lower it).
          COVERAGE_FLOOR: "65"
        run: |
          TOTAL=$(go tool cover -func="$TEST_COVERPROFILE" | awk '/^total:/ { sub("%", "", $3); print $3 }')
          if [ -z "$TOTAL" ]; then
            echo "::error::Could not read total statement coverage from $TEST_COVERPROFILE"
            exit 1
          fi
          echo "Total statement coverage: ${TOTAL}% (floor ${COVERAGE_FLOOR}%)"
          awk -v total="$TOTAL" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (total + 0 < floor + 0) {
              printf "::error::Statement coverage %.1f%% is below the HISS-15 floor of %s%%\n", total, floor
              exit 1
            }
          }'

      - name: Run Repository Governance Audit (HISS Invariants & Rulesets)
        if: steps.filter.outputs.skip_heavy_gates == 'true' && steps.filter.outputs.run_audit != 'false' && github.event_name != 'push'
        run: go run ./cmd/standardsctl audit

      - name: Verify Binary Compilation
        if: steps.filter.outputs.skip_heavy_gates != 'true' || github.event_name == 'push'
        run: make build

  # The release pipeline and the update bot are configured in files that nothing else
  # compiles or executes, so a key that a tool stopped accepting rots silently until a
  # release or a bot run fails. Both validators are run against the files themselves.
  # Linux-only by nature: they are CI configuration checks, not a gate over host
  # behaviour, so there is nothing for a macOS or Windows runner to prove (HISS-21).
  # Unlike the verify job it also runs on Renovate pull requests: it runs no tool unless one of
  # the files changed, and Renovate's configuration migration pull request edits renovate.json.
  config-validation:
    name: Release & Bot Configuration Validation
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect Configuration Changes
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: ".goreleaser.yaml renovate.json .github/workflows/ci.yml"

      - name: Validate GoReleaser Configuration
        if: steps.changed.outputs.run == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Setup Node Toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # --strict fails on a configuration the bot would silently migrate, which is how a
      # renamed option is caught: without it the validator reports the migration and still
      # exits 0.
      # --no-global validates renovate.json as repository config. A file named on the
      # command line is otherwise read as global self-hosted config, which accepts
      # global-only options (allowedCommands, onboarding) that the hosted bot rejects.
      # The validator is pinned to an exact release, and Renovate moves the pin (the regex manager
      # for this file in renovate.json), so a release that cannot be installed fails on its own
      # pull request. A floating major broke every pull request that touched renovate.json when
      # renovate 44.131.1 picked up a dependency npm cannot resolve (#709). npm names no cause
      # for that failure, so a failed install prints the end of npm's debug log.
      - name: Install The Pinned Renovate Validator
        if: steps.changed.outputs.run == 'true'
        env:
          RENOVATE_VERSION: '44.142.1'
        run: |
          if ! npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/renovate" "renovate@${RENOVATE_VERSION}"; then
            tail -n 40 "$HOME"/.npm/_logs/*-debug-0.log
            exit 1
          fi

      - name: Validate Renovate Configuration
        if: steps.changed.outputs.run == 'true'
        run: '"$RUNNER_TEMP/renovate/node_modules/.bin/renovate-config-validator" --strict --no-global renovate.json'

  # Both documentation presets ship to adopters, and nothing else builds them: before this
  # job the Starlight preset had never been built in CI and the MkDocs preset only on
  # documentation pull requests. Each preset installs from its committed lock, so an
  # unpinned or unhashed entry fails the install (pip --require-hashes; npm ci refuses a
  # package.json the lock does not match). Each is built three times: without DOCS_SITE_URL,
  # where the output must name no site URL (the URL is operator configuration, never a shipped
  # domain); with a root host; and with a URL that has a path, as a GitHub project page does,
  # where every site URL and every root-absolute link must keep that path.
  # Both builds with a site URL then go through `praetorctl seo audit`, the check an adopter
  # runs on their own build, so a template change that breaks the JSON-LD or a sitemap fails
  # here; a change to the audit itself (internal/seo, cmd/standardsctl/seo.go) re-runs it.
  # Both fixtures are set up by `praetorctl adopt`, so a change to the adoption code that writes
  # the engine, the Makefile block and the documentation gate (internal/adopt,
  # internal/managedasset, tools/markdownlint, cmd/standardsctl) re-runs it too.
  # Linux-only: the builds are pure Python and Node, and the platform-specific inputs are
  # the locks, which already record every platform (uv --universal markers; npm lock
  # entries for each OS's optional binaries), so a macOS or Windows runner would repeat
  # the same resolution; the audit is platform-neutral Go whose tests run in the verify
  # job (HISS-21).
  docs-presets:
    name: Documentation Preset Builds
    # Skipped on a Renovate pull request for the reason the verify job states.
    if: "!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]')"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # Reserved .invalid host (RFC 2606), so no build can reach a real site.
      PRESET_ROOT_URL: https://docs.example.invalid/
      PRESET_SUBPATH_URL: https://docs.example.invalid/preset/

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect Preset Changes
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: "docs/presets .github/workflows/ci.yml internal/seo internal/adopt internal/managedasset tools/markdownlint cmd/standardsctl tools/figures"

      - name: Setup Python Toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Renovate's pip-compile manager re-runs the command recorded in the lock header and
      # skips the lock, with only a log warning, when an option takes its argument after a
      # space or uses a short form (extractHeaderCommand in Renovate's
      # lib/modules/manager/pip-compile/common.ts). uv accepts both forms, so only this
      # check notices a lock Renovate would never update.
      - name: Check MkDocs Lock Header Is Renovate-Parseable
        if: steps.changed.outputs.run == 'true'
        run: |
          HEADER=$(sed -n '2s/^#    //p' docs/presets/mkdocs/requirements.txt)
          read -r -a ARGS <<< "$HEADER"
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "::error file=docs/presets/mkdocs/requirements.txt,line=2::no compile command recorded in the lock header"
            exit 1
          fi
          for arg in "${ARGS[@]}"; do
            case "$arg" in
              --universal|--generate-hashes|--no-strip-extras|--emit-index-url|--all-extras|--*=*) ;;
              -*)
                echo "::error file=docs/presets/mkdocs/requirements.txt,line=2::header option '$arg' must be a bare flag or '--option=value'; recompile with the command in docs/presets/mkdocs/README.md"
                exit 1
                ;;
            esac
          done

      # The preset's diagram check below is a Node command (tools/figures/build.mjs site), so Node
      # is set up before the MkDocs build; the Starlight build uses the same toolchain. The npm
      # cache holds both installs the job runs, tools/figures (the smoke test's playwright) and the
      # Starlight preset, so both locks key it.
      - name: Setup Node Toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            docs/presets/starlight/package-lock.json
            tools/figures/package-lock.json

      - name: Setup Go Toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        if: steps.changed.outputs.run == 'true'
        uses: ./.github/actions/go-cache
        with:
          job: docs-presets
          go-version: '1.27'

      # Both fixture builds below run praetorctl adopt, and their smoke tests drive Chromium through
      # the playwright pin in tools/figures/package-lock.json, so both are set up once here; the SEO
      # audit reuses the same binary.
      - name: Build praetorctl And Install The Figure Smoke Test
        if: steps.changed.outputs.run == 'true'
        run: |
          go build -o "$RUNNER_TEMP/praetorctl" ./cmd/standardsctl
          npm ci --prefix tools/figures --ignore-scripts --no-audit --no-fund
          npx --prefix tools/figures playwright install --with-deps chromium

      # The MkDocs preset's mkdocs.yml lists the figure hook that `praetorctl adopt` writes to
      # tools/figures/ under docs:seo-portal, so the preset does not build in place. It is set up as
      # its README's Quickstart tells an adopter: a temporary repository adopted with that facet,
      # mkdocs.yml, docs/ and overrides/ copied into its root and the Python lock into docs/, where
      # the preset's exclude_docs keeps it out of the site (docs/adr/0016-figures-for-adopters.md,
      # section 9). `build` must reproduce the committed example figure byte for byte, and the
      # managed docs-figures target (`check`, `sources`) holds it to its spec, the engine and its
      # evidence in the preset's files. A strict build still passes when a ```figure fence does not
      # become a figure, so `site` checks every build.
      - name: Build MkDocs Preset From Its Hashed Lock
        if: steps.changed.outputs.run == 'true'
        run: |
          praetor="$PWD"
          fixture="$RUNNER_TEMP/preset-mkdocs-fixture"
          git init -q "$fixture"
          "$RUNNER_TEMP/praetorctl" adopt --path "$fixture" --facets docs:seo-portal --lock-source-root "$praetor"
          cp -R docs/presets/mkdocs/{mkdocs.yml,docs,overrides} "$fixture/"
          cp docs/presets/mkdocs/{requirements.in,requirements.txt} "$fixture/docs/"
          cd "$fixture"
          python -m pip install --require-hashes -r docs/requirements.txt
          node tools/figures/build.mjs build
          if ! diff -r "$praetor/docs/presets/mkdocs/docs/assets/figures" docs/assets/figures; then
            echo "::error file=docs/presets/mkdocs/docs/figures/site-build.ts::the committed example figure differs from a fresh render; rebuild it in an adopted fixture (docs/guides/documentation-governance.md, Site build and diagrams)"
            exit 1
          fi
          make -s docs-figures
          unset DOCS_SITE_URL
          mkdocs build --strict -d "$RUNNER_TEMP/preset-mkdocs-unset"
          DOCS_SITE_URL="$PRESET_ROOT_URL" mkdocs build --strict -d "$RUNNER_TEMP/preset-mkdocs-root"
          DOCS_SITE_URL="$PRESET_SUBPATH_URL" mkdocs build --strict -d "$RUNNER_TEMP/preset-mkdocs-subpath"
          for build in unset root subpath; do
            node tools/figures/build.mjs site --config mkdocs.yml --docs docs --site "$RUNNER_TEMP/preset-mkdocs-$build"
            for lock in requirements.in requirements.txt; do
              if [ -e "$RUNNER_TEMP/preset-mkdocs-$build/$lock" ]; then
                echo "::error file=docs/presets/mkdocs/mkdocs.yml::the $build build published docs/$lock; exclude_docs must keep the lock out of the site"
                exit 1
              fi
            done
          done

      # Every figure on the fixture builds must mount the player in Chromium, with and without
      # reduced motion; the subpath build is served under its path. The run blocks every other
      # origin, so the preset's placeholder repository widget does not fail it (tools/figures/smoke.mjs).
      - name: Smoke-Test MkDocs Preset Figures
        if: steps.changed.outputs.run == 'true'
        run: |
          node tools/figures/smoke.mjs --site "$RUNNER_TEMP/preset-mkdocs-root" --require-browser
          node tools/figures/smoke.mjs --site "$RUNNER_TEMP/preset-mkdocs-subpath" --base /preset/ --require-browser

      # The Starlight preset imports the figure integration from tools/figures/, which `praetorctl
      # adopt` writes with docs:seo-portal, so it is built as an adopter builds it, never in place
      # (docs/adr/0016-figures-for-adopters.md, section 9): a temporary repository adopted with that
      # facet and the preset copied into its root. The preset ships its example spec without
      # outputs, so the managed docs-figures target must first fail and name the render command;
      # after `build` it must pass, and its `sources` must read the pages under src/content/docs,
      # found from astro.config.mjs. Then `npm ci` from the preset's lock and four builds: the
      # preset's three (no DOCS_SITE_URL, a root host, a path), and one whose configuration adds its
      # own mdx() after the preset's integrations. Starlight registers mdx() with static optimization
      # only when the site has none, and Sätteri's MDX compiler without it refuses an HTML node, so
      # the fourth build proves a figure on an .mdx page renders either way. After each build the
      # Node site check and the Chromium smoke test run under the base that build used, so a figure
      # that did not render, an image or loader URL outside /preset/, or a player that does not
      # mount fails the job. smoke.mjs resolves --site against this checkout, so it gets an
      # absolute path.
      - name: Build Starlight Preset In An Adopter Fixture
        if: steps.changed.outputs.run == 'true'
        run: |
          praetor="$PWD"
          fixture="$RUNNER_TEMP/preset-starlight-fixture"
          git init -q "$fixture"
          "$RUNNER_TEMP/praetorctl" adopt --path "$fixture" --facets docs:seo-portal --lock-source-root "$praetor"
          cp -R docs/presets/starlight/. "$fixture/"
          cd "$fixture"
          if first=$(make -s docs-figures 2>&1) || ! grep -qxF 'figures: rebuild with: node tools/figures/build.mjs build' <<< "$first"; then
            echo "$first"
            echo "::error file=tools/figures/build.mjs::before the first build, make docs-figures must fail and name node tools/figures/build.mjs build"
            exit 1
          fi
          node tools/figures/build.mjs build
          checked=$(make -s docs-figures 2>&1) || { echo "$checked"; exit 1; }
          echo "$checked"
          if ! grep -qF 'pages read: src/content/docs (astro.config.mjs).' <<< "$checked"; then
            echo "::error file=tools/figures/checks.mjs::make docs-figures did not read the Starlight pages found from astro.config.mjs"
            exit 1
          fi
          npm ci --no-audit --no-fund
          verify() {
            node tools/figures/build.mjs site --config astro.config.mjs --docs src/content/docs --site dist --base "$2"
            node "$praetor/tools/figures/smoke.mjs" --site "$fixture/dist" --base "$2" --require-browser
            mv dist "$RUNNER_TEMP/preset-starlight-$1"
          }
          unset DOCS_SITE_URL
          npm run build
          verify unset /
          DOCS_SITE_URL="$PRESET_ROOT_URL" npm run build
          verify root /
          DOCS_SITE_URL="$PRESET_SUBPATH_URL" npm run build
          verify subpath /preset/
          # mdx() goes after Starlight, whose expressive-code integration must precede it.
          cat > astro.mdx.config.mjs <<'EOF'
          import mdx from '@astrojs/mdx';
          import config from './astro.config.mjs';

          export default { ...config, integrations: [...config.integrations, mdx()] };
          EOF
          npm run build -- --config astro.mdx.config.mjs
          verify mdx /

      # The presets ship placeholder identities (example-org/example-repo, PlaceholderLang)
      # for an adopter to replace, so --allow-placeholders; every other finding fails. The
      # builds without DOCS_SITE_URL have no sitemap entries, so they are not audited.
      - name: Audit Preset SEO
        if: steps.changed.outputs.run == 'true'
        run: |
          for build in mkdocs-root mkdocs-subpath starlight-root starlight-subpath; do
            "$RUNNER_TEMP/praetorctl" seo audit --allow-placeholders "$RUNNER_TEMP/preset-$build"
          done

      # One check over all six builds. A site URL is a canonical link, an og:url, a JSON-LD
      # "url" or a sitemap entry; MkDocs minifies its HTML, so attributes may be unquoted.
      # Unset, a build must name none: any URL there is one the preset hardcodes. Set, the
      # home page URL must appear, every site URL must start with the configured one, and
      # every root-absolute href or src must start with its path, which is what a project
      # page (https://<owner>.github.io/<repo>/) breaks when the path is dropped.
      # shell: bash adds pipefail, so a failed read on the left of a pipe fails it. Bash
      # clears -e inside a command substitution, so site_urls returns each pipeline's
      # failure itself and every caller checks the substitution's status. matches is grep
      # for which status 1, no match, is an empty result; only status 2, an error, fails.
      - name: Check Preset Site URLs
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }
          matches() { grep -hoE "$@" || [ $? -eq 1 ]; }
          site_urls() {
            matches -r --include='*.html' '<link[^>]*canonical[^>]*>|<meta[^>]*og:url[^>]*>' "$1" | matches "https?://[^\"' >]+" || return
            matches -r --include='*.html' '"url": ?"[^"]*"' "$1" | cut -d'"' -f4 || return
            find "$1" -maxdepth 1 -name 'sitemap*.xml' -exec cat {} + | matches '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g'
          }
          outside() { awk -v p="$1" 'NF && index($0, p) != 1'; }
          check_unset() {
            [ -d "$1" ] || fail "$1: build output missing"
            found=$(site_urls "$1") || fail "$1: reading the site URLs failed"
            [ -z "$found" ] || fail "$1 names a site URL although DOCS_SITE_URL is unset: $(tr '\n' ' ' <<< "$found")"
          }
          check_set() {
            [ -d "$1" ] || fail "$1: build output missing"
            found=$(site_urls "$1") || fail "$1: reading the site URLs failed"
            grep -qxF "$2" <<< "$found" || fail "$1 names no URL equal to $2"
            stray=$(outside "$2" <<< "$found")
            [ -z "$stray" ] || fail "$1 names site URLs outside $2: $(tr '\n' ' ' <<< "$stray")"
            links=$(matches -r --include='*.html' '(href|src)="?/[^"> ]*' "$1" | sed -E 's/^(href|src)="?//') ||
              fail "$1: reading the links failed"
            stray=$(outside "$3" <<< "$links" | sort -u)
            [ -z "$stray" ] || fail "$1 links outside $3: $(tr '\n' ' ' <<< "$stray")"
          }
          for preset in mkdocs starlight; do
            check_unset "$RUNNER_TEMP/preset-$preset-unset"
            check_set "$RUNNER_TEMP/preset-$preset-root" "$PRESET_ROOT_URL" /
            check_set "$RUNNER_TEMP/preset-$preset-subpath" "$PRESET_SUBPATH_URL" /preset/
          done
