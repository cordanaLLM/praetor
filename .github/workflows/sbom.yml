name: SBOM Generation & Supply Chain Attestation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-and-attest:
    name: SBOM & SLSA Level 3 Attestation Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27 Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: sbom
          go-version: '1.27'

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Generate CycloneDX SBOM
        run: syft dir:. -o cyclonedx-json=praetor-cyclonedx.json

      - name: Generate SPDX SBOM
        run: syft dir:. -o spdx-json=praetor-spdx.json

      - name: Cosign Keyless Sign SBOMs via OIDC (SLSA Level 3)
        run: |
          cosign sign-blob --yes \
            --output-certificate praetor-cyclonedx.json.cert \
            --output-signature praetor-cyclonedx.json.sig \
            praetor-cyclonedx.json
          cosign sign-blob --yes \
            --output-certificate praetor-spdx.json.cert \
            --output-signature praetor-spdx.json.sig \
            praetor-spdx.json

      - name: Upload Signed SBOM Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            praetor-cyclonedx.json \
            praetor-cyclonedx.json.cert \
            praetor-cyclonedx.json.sig \
            praetor-spdx.json \
            praetor-spdx.json.cert \
            praetor-spdx.json.sig \
            --clobber
