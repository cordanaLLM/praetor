name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Build Documentation Site (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Pinned, not floating. Two jobs build this same mkdocs.yml: this one, and the
      # "Documentation Integrity Audit" step in ci.yml, which installs
      # docs/presets/mkdocs/requirements.txt. Unconstrained here, the two resolved different
      # trees, so a PR could go green on the audit and break on deploy. The pins are exactly
      # the floors requirements.txt declares, so both jobs resolve one tree today. They only
      # stay equal if they move together: raising a floor in requirements.txt without raising
      # the pin here re-opens the gap, in the direction where the audit passes on a version
      # this job never builds.
      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'mkdocs-material==9.7.7' 'pymdown-extensions==12.1'

      - name: Build MkDocs Site (Strict Mode)
        run: mkdocs build --strict

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Deploy to GitHub Pages (canonical repository only)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
