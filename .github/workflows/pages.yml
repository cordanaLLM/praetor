name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs_mermaid.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs_mermaid.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the deploy job may write. The workflow also runs on pull_request, and a workflow-level
# write scope would hand every documentation pull request -- a fork branch included -- a token
# that can create a Pages deployment and mint an OIDC identity token it never uses (#292).
permissions:
  contents: read

jobs:
  build:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Build Documentation Site (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned, from one lock. Two jobs build this same mkdocs.yml: this one, and the
      # "Documentation Integrity Audit" step in ci.yml. Both install
      # docs/presets/mkdocs/requirements.txt, the hashed lock compiled from requirements.in,
      # with --require-hashes, so the audit and the deploy install the versions the lock pins
      # and an entry without an exact pin and hash fails the install. Change a version in
      # requirements.in and recompile the lock; there is no second pin list here to update.
      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r docs/presets/mkdocs/requirements.txt

      - name: Build MkDocs Site (Strict Mode)
        run: mkdocs build --strict

      # A strict build passes with every diagram shipped as a code listing: the mermaid custom
      # fence was never declared and nothing looked at the output. This fails the build before
      # the artifact is uploaded when a ```mermaid block is not a <pre class="mermaid">.
      - name: Verify Mermaid Diagrams Render
        run: python3 -B scripts/docs_mermaid.py --config mkdocs.yml --docs docs --site site

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: pages-build
          go-version: '1.27'

      - name: SEO Integrity Audit
        run: go run ./cmd/standardsctl seo audit site

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Deploy to GitHub Pages (canonical repository only)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # actions/deploy-pages requires both scopes on the deploying job: pages:write to create the
    # deployment, id-token:write for the OIDC token that proves where it came from.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
