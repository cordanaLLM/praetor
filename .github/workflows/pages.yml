name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the deploy job may write. The workflow also runs on pull_request, and a workflow-level
# write scope would hand every documentation pull request -- a fork branch included -- a token
# that can create a Pages deployment and mint an OIDC identity token it never uses (#292).
permissions:
  contents: read

jobs:
  build:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Build Documentation Site (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned, not floating. Two jobs build this same mkdocs.yml: this one, and the
      # "Documentation Integrity Audit" step in ci.yml. They do not resolve one tree. That
      # step installs docs/presets/mkdocs/requirements.txt, whose entries are >= floors, so
      # it floats to the newest releases above them, and it runs on the runner's system
      # python3; this job pins mkdocs-material and pymdown-extensions to exactly those floors
      # on setup-python 3.14. A PR can therefore pass the audit on a newer release and a
      # different interpreter than the ones this job deploys with, or the reverse. Raising a
      # floor in requirements.txt without raising the pin here leaves this job building a
      # version requirements.txt no longer admits.
      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'mkdocs-material==9.7.7' 'pymdown-extensions==12.1'

      - name: Build MkDocs Site (Strict Mode)
        run: mkdocs build --strict

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Deploy to GitHub Pages (canonical repository only)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # actions/deploy-pages requires both scopes on the deploying job: pages:write to create the
    # deployment, id-token:write for the OIDC token that proves where it came from.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
