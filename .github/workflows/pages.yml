name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/figures/**'
      - 'internal/seo/**'
      - 'cmd/standardsctl/seo.go'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/figures/**'
      - 'internal/seo/**'
      - 'cmd/standardsctl/seo.go'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the deploy job may write. The workflow also runs on pull_request, and a workflow-level
# write scope would hand every documentation pull request -- a fork branch included -- a token
# that can create a Pages deployment and mint an OIDC identity token it never uses (#292).
permissions:
  contents: read

jobs:
  build:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Build Documentation Site (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned, from one lock. Two jobs build this same mkdocs.yml: this one, and the
      # "Documentation Integrity Audit" step in ci.yml. Both install
      # docs/presets/mkdocs/requirements.txt, the hashed lock compiled from requirements.in,
      # with --require-hashes, so the audit and the deploy install the versions the lock pins
      # and an entry without an exact pin and hash fails the install. Change a version in
      # requirements.in and recompile the lock; there is no second pin list here to update.
      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r docs/presets/mkdocs/requirements.txt

      # Interactive figures (docs/adr/0015-interactive-figures-from-vendored-interfig.md). The
      # player bundle is gitignored, so it is built here from the locked tools/figures install
      # before MkDocs copies docs/ into the site. `check` first proves the committed SVG and JSON
      # still match a fresh render; `bundle` fails when the player chunk exceeds its budget.
      - name: Setup Node Toolchain
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/figures/package-lock.json

      - name: Build Figure Player Bundle
        run: |
          npm ci --prefix tools/figures --ignore-scripts --no-audit --no-fund
          node tools/figures/build.mjs check
          npm --prefix tools/figures run bundle

      - name: Build MkDocs Site (Strict Mode)
        run: mkdocs build --strict

      # A strict build passes with every diagram shipped as a code listing: the mermaid custom
      # fence was once never declared and nothing looked at the output. This fails the build
      # before the artifact is uploaded when a page holds a ```mermaid block (the site renders
      # figures only), when a ```figure fence did not become a figure whose images resolve, or
      # when a committed figure no longer matches its spec, the engine or its evidence anchors.
      - name: Verify Diagrams Render
        run: |
          python3 -B tools/figures/docs_diagrams.py site --config mkdocs.yml --docs docs --site site
          python3 -B tools/figures/docs_diagrams.py sources

      # Proves every figure mounts the interactive player in Chromium, with and without reduced
      # motion. --require-browser makes a missing browser a failure here instead of a skip.
      - name: Smoke-Test Interactive Figures
        run: |
          npx --prefix tools/figures playwright install --with-deps chromium
          npm --prefix tools/figures run smoke -- --site site --require-browser

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: pages-build
          go-version: '1.27'

      - name: SEO Integrity Audit
        run: go run ./cmd/standardsctl seo audit site

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # v4.0.0 dropped dotfiles from the tar; v5 restores them behind
          # this input. True keeps v3 semantics (.git/.github stay excluded)
          # so a future dotfile in site/ cannot vanish without a CI failure.
          include-hidden-files: true

  deploy:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Deploy to GitHub Pages (canonical repository only)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # actions/deploy-pages requires both scopes on the deploying job: pages:write to create the
    # deployment, id-token:write for the OIDC token that proves where it came from.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
