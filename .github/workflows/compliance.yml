name: Compliance & Licensing Verification Gate

on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    branches:
      - main
      - 'lts-*'

# A push run inspects the commits since the previous push's tip, so a push run that never
# finishes leaves its commits inspected by no run at all. Each push run therefore gets a
# group of its own: a shared one would let the next push cancel it while running, or replace
# it while pending, since a group holds one pending run. Pull request runs share one group per
# pull request, and a newer head supersedes the run for the old one, which inspects the whole
# pull request range anyway. scripts/test_dco_check.py pins this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  compliance:
    name: DCO 1.1 & REUSE Compliance Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: compliance
          go-version: '1.27'

      # The workflow runs on push to main and lts-* as well as on pull requests, so the step
      # carries no event condition: a commit that reaches a protected branch directly is
      # inspected too (#292). The script picks the range from the event and is exercised by
      # scripts/test_dco_check.py, whose ComplianceWiringTests pin this step's shape so a
      # re-added condition or a swapped pair of arguments fails a test rather than skipping
      # every push run in silence. The default branch is what a branch-creation push, which
      # reports an all-zero 'before', measures its new commits against. Event values travel
      # through env rather than ${{ }} inside the command, so no payload field is ever
      # expanded into shell source.
      - name: Verify DCO 1.1 Sign-Off on Commits
        env:
          DCO_EVENT_NAME: ${{ github.event_name }}
          DCO_BASE_REF: ${{ github.base_ref }}
          DCO_BEFORE_SHA: ${{ github.event.before }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DCO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          scripts/dco_check.sh
          "$DCO_EVENT_NAME" "$DCO_BASE_REF" "$DCO_BEFORE_SHA" "$DCO_HEAD_SHA"
          "$DCO_DEFAULT_BRANCH"

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5

      - name: Verify Cross-Agent Context Synchronization (HISS-16)
        run: go run ./cmd/standardsctl compile-context --verify

      - name: Verify Governance Audit (HISS Invariants & Rulesets)
        run: go run ./cmd/standardsctl audit
