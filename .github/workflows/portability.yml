name: Platform Neutrality

# HISS-21. This repository's git hooks were unusable on Windows through four stacked
# defects (#84), and each one was hidden behind the one before it. The last of them was
# that the harness self-tests could not build there at all, so the gate could not be
# repaired from the platform it was broken on. Nothing was wrong with the fixes; what was
# missing was a runner that would have failed the day any of them landed.
#
# Enforcement is a matrix rather than a rule, because a rule only catches the defects
# somebody thought to enumerate. This catches the class.
#
# Structure is taken from a downstream adopter's build matrix, which solved the same problem first
# across eighteen cells: fail-fast off so one platform's failure cannot mask another's,
# advisory legs marked rather than hidden, and legs that cannot run their tests saying so
# in the workflow instead of quietly omitting the step.

# The hosted gate shape (internal/ghworkflow/hostedgate.go, docs/guides/workflow-triggers.md): a
# pull request runs on every activity that can change what merges, and both jobs fail a draft in
# their first step and run once the draft is marked ready (ready_for_review). The dispatch stays.
on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'lts-*'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Pull request runs replace an older run of the same pull request; a push or scheduled run
  # gets its own group and is never cancelled, so every main commit gets its verdict (#1566:
  # a run per merge cancelled the 60 to 100 minute Windows job of the commit before).
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  # Outside the canonical repository the matrix is an operator's choice (#189): the macOS
  # and Windows legs are billed at a multiple on a private repository, and an operational
  # fork receives many commits per sync. It runs there only when the repository variable
  # PRAETOR_FORK_PORTABILITY is 'enabled'. The matrix also skips a Renovate pull request in every
  # repository, one the Renovate app opened from a renovate/ branch: the update is taken over on a
  # signed-off branch whose own pull request runs the three legs, and a rebase of every open
  # Renovate branch would otherwise fill every runner. A person's branch named renovate/... runs it.
  # HISS-21 forbids a silent skip, so the job below, whose condition is the exact negation of the
  # matrix's, states the reason on one Linux runner instead of leaving three legs quietly absent.
  skipped:
    name: Platform Neutrality skipped (fork without PRAETOR_FORK_PORTABILITY=enabled, or a Renovate pull request)
    if: "!(!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]') && (github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') || vars.PRAETOR_FORK_PORTABILITY == 'enabled'))"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      # The hosted gate's draft step, as ghworkflow.HostedGateDraftStep renders it: on a draft
      # nothing runs and the job says so instead of stating a skip reason.
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # The branch name and the author reach the script through the environment, never through
      # an expression inside it, so a crafted branch name cannot become shell text. The test
      # repeats the job condition's Renovate term, so the reason names the cause that skipped it.
      - name: State Why The Matrix Did Not Run
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "${HEAD_REF}" == renovate/* && "${PR_AUTHOR}" == "renovate[bot]" ]]; then
            reason="Platform Neutrality did not run: ${HEAD_REF} is a Renovate pull request. The update is taken over on a signed-off branch whose own pull request runs every leg. No platform was verified by this run."
          else
            reason="Platform Neutrality did not run: ${GITHUB_REPOSITORY} is not the canonical repository and the repository variable PRAETOR_FORK_PORTABILITY is not 'enabled'. No platform was verified by this run."
          fi
          echo "::notice title=Platform Neutrality skipped::${reason}"
          echo "${reason}" >> "${GITHUB_STEP_SUMMARY}"

  harness:
    name: Platform Neutrality (${{ matrix.name }})
    # The literal is the .standards.yaml identity; internal/forge/workflow_guard_test.go
    # holds the two equal. The names are required status contexts and stay unchanged: the
    # leading Renovate term keeps them required (renovateBranchSkip in
    # internal/forge/workflow_guard.go), and on a Renovate pull request no leg reports at all.
    if: "!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]') && (github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') || vars.PRAETOR_FORK_PORTABILITY == 'enabled')"
    runs-on: ${{ matrix.os }}
    # windows-2025 needed 55 to 80 minutes for the whole job in October 2026 (go test 41 to 63,
    # the harness self-tests 12 to 13), against 12 on Linux and 19 on macOS; a slow runner took
    # a green run on #737 past the earlier 75-minute limit in its last step. On 2026-10-24 a
    # runner about twice as slow (median package time x1.96, go test 94 minutes, the harness
    # self-tests over 21) cancelled main at the 120-minute limit with every finished step green.
    # The leg is a required check, so a limit at that edge cancels a green run and blocks the
    # pull request; 180 minutes keeps a third over that run, inside the job-timeout gate's
    # measured window (1.25 to 4 times the slowest green run). Splitting the leg is the durable
    # fix (#729 tracks the suite's growth).
    timeout-minutes: 180
    strategy:
      # One platform failing must never cancel the others. Which platforms are broken is
      # the entire output of this job; cancelling the rest discards it.
      fail-fast: false
      # Explicit image labels, not the -latest aliases, for the reason
      # internal/config/hierarchy.go states for the Darwin tier: a floating label
      # retargets the matrix the day GitHub promotes the next image, and a
      # portability matrix that silently changes platform is not a measurement.
      # macos-latest already resolves to arm64 macOS 26 and windows-latest to
      # Windows Server 2025 (actions/runner-images README, 2026-09-19), so these
      # name what already runs.
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux
          - os: macos-26
            name: macOS

    steps:
      # The hosted gate's draft step, as ghworkflow.HostedGateDraftStep renders it: on a draft
      # every leg fails here with the annotation the checkpoint planner reads as draft pending.
      # The steps that run on after a failure (!cancelled() below) also carry the draft term
      # (github.event.pull_request.draft != true), so a draft runs no step of the matrix. The
      # step names bash (ghworkflow.HostedGateDraftShell): the Windows leg's default shell is
      # pwsh, which refuses the script, so the leg would fail without the annotation.
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go Toolchain
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: portability
          go-version: ${{ steps.setup-go.outputs.go-version }}

      - name: Detect Changed Paths
        id: base
        uses: ./.github/actions/changed-paths

      - name: Setup Python Toolchain
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # One PR run cost 119.4 runner minutes across the three legs. Scope PR work
      # through the hook's package selector; push and dispatch retain the full run.
      - name: Select Platform Neutrality Scope
        id: scope
        if: ${{ !cancelled() && github.event.pull_request.draft != true }}
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.base_ref }}
        run: |
          "$PYTHON" -B .config/lefthook/scripts/ci_scope.py --event "$EVENT" --base "$BASE" --head HEAD \
            --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" --packages "$RUNNER_TEMP/portability-packages.txt"

      - name: Select Buildable Go Packages
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < "$RUNNER_TEMP/portability-packages.txt"
          # go build rejects test-only packages; use Go's own source-file metadata.
          go list -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' "${packages[@]}" > "$RUNNER_TEMP/buildable.txt"

      # Build before test: a compile error on one OS is the cheapest portability defect to
      # find and the one most likely to be a build-constraint or path-separator mistake.
      - name: Compile Every Package
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          buildable=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then buildable+=("$package"); fi
          done < "$RUNNER_TEMP/buildable.txt"
          if [ "${#buildable[@]}" -gt 0 ]; then
            go build "${buildable[@]}"
          else
            echo "Compile Every Package skipped: selected packages contain tests only"
          fi

      # Every step below runs even when an earlier one failed. #84 was four portability
      # defects stacked so that each was invisible until the one before it was fixed, which
      # cost four separate round trips to discover. A job that halts at the first red step
      # reproduces exactly that. `!cancelled()` does not alter the job's conclusion: a failed
      # step still fails the leg. It only means one run reports every layer instead of one.
      - name: Vet Every Package
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          buildable=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then buildable+=("$package"); fi
          done < "$RUNNER_TEMP/buildable.txt"
          if [ "${#buildable[@]}" -gt 0 ]; then
            go vet "${buildable[@]}"
          else
            echo "Vet Every Package skipped: selected packages contain tests only"
          fi

      # The gating and flavor tests build the pinned gosec and install the fallback scanners
      # from the versions tools/go/go.mod pins, under a 2-minute and a 4-minute bound. Those
      # modules reached the module cache only with "Install Security Scanner", which runs after
      # the tests: once a go.sum change gave the cache a new key, main c565cba50's macOS leg
      # downloaded them inside those bounds and both tests ran out of time. Downloading them
      # before the tests keeps the bounds about the build. bash keeps the dotted -modfile value
      # one argument on Windows (see "Install Security Scanner"). Main 4ae64cb27's macOS leg then
      # ran out of the same bounds compiling the scanners while the other test binaries ran;
      # building them here, outside any bound, leaves the tests a build cache to hit.
      - name: Download And Build Pinned Tools
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          go mod download -modfile=tools/go/go.mod
          go build -modfile=tools/go/go.mod -o "$RUNNER_TEMP/pinned-tools/" golang.org/x/vuln/cmd/govulncheck github.com/securego/gosec/v2/cmd/gosec github.com/zricethezav/gitleaks/v8

      # Not -race here. The race detector needs a host C toolchain, and whether one exists
      # on each runner image is exactly the kind of thing this matrix is meant to discover
      # rather than assume. The Linux race legs already run in the main CI gate, so nothing
      # is lost by keeping this job about portability alone. The explicit -timeout replaces
      # go test's 10-minute default per package: on windows-latest internal/operationalsync
      # alone took 557 s, most of it a nested go test over a repository copy, so the default
      # was one slow runner away from a panic that names no failing test.
      # go test -json keeps each test's elapsed time, which the plain output drops, so a package that
      # runs close to the 30-minute bound on one platform can be profiled from the uploaded file
      # (internal/adopt on Windows). Each go test run writes its stream to a file and the step prints
      # that stream's output events when the run ends: a pipe into the printer would keep the step
      # open as long as any process still held its write end, and on Windows train 4's step sat 28
      # minutes after its last package passed until the job bound cancelled it (run 38798931720).
      # The file goes to the runner's temporary folder, never the checkout: a test that copies the
      # tracked tree with its untracked files (internal/identity) refused the 12 MB file there.
      # The printer writes UTF-8 whatever the console code page: cp1252 cannot encode every character a
      # test prints (run 38818801669 stopped at U+25CB), and a stderr line that is no JSON prints as is.
      # internal/adopt runs on its own after the other packages, under the same 30-minute bound. On
      # Windows it took 1856 s while #166 ran its hermetic fixtures there; with that enablement taken
      # out again (#1369) it takes 129 s (run 38983863003), so its longer bound and the dated
      # exception for it are gone (#1381). operationalsync's identity suite replays only the
      # Windows-specific adopt tests on Windows, so it stays in the first run. Every selected run
      # goes even after a failure; the step fails when any selected run does.
      - name: Test Every Package
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          adopt=$(go list ./internal/adopt)
          cli=$(go list ./cmd/standardsctl)
          # cmd/standardsctl took 1583, 1997 and 2043 s on Windows in the three green runs before
          # 452c74e3c, whose run 39155177618 passed the 30-minute bound with no test hanging (1181 s of
          # test time in run 39143445406). Its tests run in two halves, each under the same bound:
          # -run takes the audit tests and the B-D tests (638 s of the 1181), -skip the rest, so
          # every test runs exactly once (internal/forge TestPortability_LongestPackageRunsInHalves).
          cli_half='^Test(Aud|[B-D])'
          # A read loop, not mapfile: macOS runners ship bash 3.2, which has no mapfile.
          selected=()
          while IFS= read -r package; do selected+=("$package"); done < "$RUNNER_TEMP/portability-packages.txt"
          go list "${selected[@]}" > "$RUNNER_TEMP/selected-packages.txt"
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < <(grep -vxF -e "$adopt" -e "$cli" "$RUNNER_TEMP/selected-packages.txt")
          json="$RUNNER_TEMP/go-test-$RUNNER_OS.json"
          : > "$json"
          show() {
            "$PYTHON" -B -c 'import json, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try:
                  event = json.loads(line) if line.startswith("{") else {"Action": "output", "Output": line}
              except ValueError:
                  event = {"Action": "output", "Output": line}
              if event.get("Action") in ("output", "build-output"):
                  sys.stdout.write(event.get("Output", ""))' "$1"
            cat "$1" >> "$json"
          }
          status=0
          if [ "${#packages[@]}" -gt 0 ]; then
            go test -json -timeout 30m "${packages[@]}" > "$RUNNER_TEMP/run-1.json" 2>&1 || status=$?
            show "$RUNNER_TEMP/run-1.json"
          else
            echo "run-1 skipped: no selected packages outside adopt and CLI"
          fi
          if [ "$ADOPT" = true ]; then
            go test -json -timeout 30m "$adopt" > "$RUNNER_TEMP/run-2.json" 2>&1 || status=$?
            show "$RUNNER_TEMP/run-2.json"
          else
            echo "run-2 skipped: adopt is not selected"
          fi
          if [ "$CLI" = true ]; then
            go test -json -timeout 30m -run "$cli_half" "$cli" > "$RUNNER_TEMP/run-3.json" 2>&1 || status=$?
            show "$RUNNER_TEMP/run-3.json"
            go test -json -timeout 30m -skip "$cli_half" "$cli" > "$RUNNER_TEMP/run-4.json" 2>&1 || status=$?
            show "$RUNNER_TEMP/run-4.json"
          else
            echo "run-3/run-4 skipped: CLI is not selected"
          fi
          exit "$status"
        env:
          ADOPT: ${{ steps.scope.outputs.adopt }}
          CLI: ${{ steps.scope.outputs.cli }}
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Upload Per-Test Timing
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-json-${{ matrix.name }}
          path: ${{ runner.temp }}/go-test-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

      # tools/schemacheck is a nested module, outside ./... above. It validates every rendered
      # client config against the vendored upstream schemas and builds and drives standards-mcp,
      # so it runs on each platform too (HISS-21); its network checks skip with a stated reason.
      - name: Test The Client Schema Oracle Module
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.schemacheck == 'true' }}
        run: |
          go -C tools/schemacheck vet ./...
          go -C tools/schemacheck test -timeout 30m ./...

      # The self-tests drive the real hooks, so they need the pinned hook runner and the
      # binary the hooks invoke. Both are installed per platform rather than assumed present:
      # a suite that silently degrades because a tool is missing is the failure mode this whole
      # job exists to make visible, and it would be absurd to introduce it here.
      - name: Install Pinned Git Hook Toolchain
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' }}
        run: go install -C tools/lefthook github.com/evilmartians/lefthook/v2

      # test_security_scope.py fails outright when gosec is absent rather than skipping, which
      # is the right call for a security regression -- so the tool is a real dependency of this
      # job, not an optional extra. The first run of this matrix failed here for exactly that
      # reason, which is the intended behaviour working.
      #
      # bash, not the Windows default pwsh: PowerShell splits an unquoted native argument that
      # starts with a dash at its period (PowerShell/PowerShell#6291), so go received
      # `-modfile=tools/go/go` and `.mod`, refused the file name, and the Windows leg lost
      # gosec and with it the harness self-tests below (#558).
      # TestPortabilityPassesNoDottedDashArgumentThroughPowerShell keeps such an argument out
      # of the default shell.
      - name: Install Security Scanner
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' }}
        shell: bash
        run: go install -modfile=tools/go/go.mod github.com/securego/gosec/v2/cmd/gosec

      # The steps below run the commands of Makefile targets directly rather than through
      # make. The Windows image's only make is a copy of mingw32-make that its build script
      # writes to C:\mingw64\bin and its software list does not name (#341): the hooks run
      # their hook-cli target with it, which Assert Hook Toolchain checks on every leg, and
      # no other target has been run under it. The executable extension comes from
      # `go env GOEXE` rather than a second copy of the Makefile's EXE_SUFFIX rule: the
      # toolchain already knows it, and a duplicate would be free to drift (HISS-19).
      # checks.py shells out to yamllint, which is pinned and installed nowhere: it happens to
      # be present on the ubuntu image and absent on macOS, so the hook failed closed there.
      # Installing it explicitly makes the dependency real on every leg rather than accidental
      # on one. The version is pinned as well: an unpinned linter turns an upstream release
      # into a red gate on an untouched tree, and a new rule firing on one leg but not another
      # is indistinguishable from a portability defect, which is the only thing this job can
      # report. The pin is the hash-locked .config/hook-lint/requirements.txt that make
      # hooks-lint installs and Renovate recompiles, so this job and that gate share one
      # yamllint pin (HISS-19). The lock is universal for Python >= 3.10, and it also brings
      # black and flake8, which no hook runs.
      - name: Install YAML Linter
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' }}
        shell: bash
        run: >-
          "$PYTHON" -m pip install --disable-pip-version-check --require-hashes
          -r .config/hook-lint/requirements.txt
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      # Same rationale as the YAML linter, one step later. checks.py builds an unconditional
      # `shellcheck` command for every staged or pushed *.sh, and common.run() fails closed on
      # a missing binary, so an absent linter is a hook failure rather than a skip. Every
      # fixture repository the suite builds copies .config/lefthook, which carries
      # pre-push/pushed-checks.sh -- so on the images without shellcheck every push the suite
      # drives was rejected (#135). It ships preinstalled on ubuntu-24.04 and on neither the
      # macOS nor the windows image.
      #
      # One step with a per-OS branch rather than one step per leg, and the same pinned
      # version everywhere including Linux: a rule set that differs per platform is not a
      # reproducible gate (HISS-19, HISS-20). The install directory goes first on PATH so the
      # pin wins over the preinstalled copy.
      - name: Install Shell Linter
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          base="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}"
          case "${RUNNER_OS}" in
            Windows)
              # The zip is flat, so no component is stripped. 7-Zip is what the windows image
              # lists; unzip is not on it, and is kept only for a host that has it instead.
              curl -fsSL --max-time 300 -o "${RUNNER_TEMP}/shellcheck.zip" "${base}/shellcheck-${SHELLCHECK_VERSION}.zip"
              if command -v 7z >/dev/null 2>&1; then
                7z x -y -bso0 -bsp0 -o"${RUNNER_TEMP}/shellcheck" "${RUNNER_TEMP}/shellcheck.zip"
              else
                unzip -q -o "${RUNNER_TEMP}/shellcheck.zip" -d "${RUNNER_TEMP}/shellcheck"
              fi
              ;;
            *)
              # The release names the 64-bit ARM asset aarch64 on both platforms, while macOS
              # reports that machine as arm64. Taking uname -m verbatim requests an asset that
              # does not exist and the whole step fails on the one leg it was added for.
              if [ "${RUNNER_OS}" = macOS ]; then platform=darwin; else platform=linux; fi
              machine="$(uname -m)"
              if [ "${machine}" = arm64 ]; then machine=aarch64; fi
              # The tarball carries a shellcheck-<version>/ prefix, unlike the zip.
              curl -fsSL --max-time 300 "${base}/shellcheck-${SHELLCHECK_VERSION}.${platform}.${machine}.tar.xz" \
                | tar -xJ -C "${RUNNER_TEMP}/shellcheck" --strip-components=1
              ;;
          esac
          echo "${RUNNER_TEMP}/shellcheck" >> "${GITHUB_PATH}"
          # GITHUB_PATH takes effect in the next step, so the pin is smoke-tested by path here.
          # A download that produced no runnable binary must fail on this step, not later as a
          # hook error that reads like a rule violation.
          if [ "${RUNNER_OS}" = Windows ]; then
            "${RUNNER_TEMP}/shellcheck/shellcheck.exe" --version
          else
            "${RUNNER_TEMP}/shellcheck/shellcheck" --version
          fi

      - name: Build praetorctl
        if: ${{ !cancelled() && github.event.pull_request.draft != true }}
        shell: bash
        run: go build -o "bin/praetorctl$(go env GOEXE)" ./cmd/standardsctl

      # BUG-992. The documentation reference gate reads Markdown that the Windows image checks
      # out with CRLF, lists the tree through git and reads Go source by slash-separated
      # repository path: the three places a platform difference would make it wrong. The
      # binary built above runs it directly, not through its Makefile target.
      - name: Documentation References
        if: ${{ !cancelled() && github.event.pull_request.draft != true }}
        shell: bash
        run: '"bin/praetorctl$(go env GOEXE)" docs references --path=.'

      # Every hook the self-tests drive starts its interpreter through
      # .config/lefthook/python.sh, which tries a fixed list of candidates and runs the first
      # that answers a version probe as Python 3 at the supported floor (#339). No variable
      # selects the interpreter, so this step sets none: it resolves the same candidates from
      # the leg's PATH, where the setup action put its interpreter first, and a leg on which
      # none proves itself fails here as a missing dependency, not later as a hook rejecting a
      # commit. The hooks also run GNU Make on every leg (hook-cli, state-audit): the step
      # resolves it the same way, from make, gmake and mingw32-make, by its version output
      # (#341); no leg installs one, each image carries its own. The programs the hooks start
      # by name are looked up on PATH, and the linters this job installs are held to the
      # floors in .config/lefthook/tool-floors.txt (#343). One line is printed per declared
      # tool; one outside --require is reported as not asserted, never silently absent. The
      # table in docs/standards/hiss-21-platform-neutrality.md is rendered from REQUIRED.
      - name: Assert Hook Toolchain
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' }}
        shell: bash
        run: '"$PYTHON" -B .config/lefthook/scripts/toolchain.py --require "$REQUIRED"'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          REQUIRED: python,make,git,go,gofmt,gosec,lefthook,sh,shellcheck,yamllint

      # The self-tests are the part that could not run on Windows at all before #102, and the
      # part that governs the hooks, so they are the highest-value cell in the matrix. The
      # driver refuses to report a pass that executed nothing and prints every skip with its
      # reason, so a platform losing coverage shows up as a number that moved.
      #
      # The suites themselves are started through the path the setup action reports rather
      # than by name: assuming a platform's binary naming is the exact defect this job exists
      # to catch. The hooks they drive resolve their own interpreter, as on any host.
      - name: Harness Self-Tests
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' }}
        # 19 green Windows runs: median 21.8 min, p95/max 25.1 min; 40 min = 1.6x p95.
        # The driver's 1800 s suite timeout plus bounded tree cleanup fits inside this bound.
        timeout-minutes: 40
        shell: bash
        # Both run whatever the first returns, so a failing timeout regression never hides the
        # suites' own results on that leg; the step fails when either does.
        run: |
          status=0
          "$PYTHON" -u -B scripts/test_portability_selftest.py || status=$?
          "$PYTHON" -u -B scripts/portability_selftest.py --min-executed "$MIN_EXECUTED" || status=$?
          exit "$status"
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          # Deliberately a collapse detector, not a coverage assertion. The honest floor per
          # platform is not yet measured on macOS or Windows -- this matrix is what measures
          # it. Raise it to each platform's real figure once the first green run reports one,
          # and never lower it to make a red run green.
          MIN_EXECUTED: '10'

      # The Markdown gate runner is a Go-embedded asset that adoption emits into every
      # docs:seo-portal repository's verify-all, so it is a generated template under this
      # invariant, yet the documentation workflows run it on Linux only. Its self-test performs
      # the real locked `npm ci` and replays the gate's fixtures. On Windows the runner cannot
      # start the npm batch shim without a shell and runs the npm-cli.js shipped beside node.exe
      # instead; this step is the leg that proves that path works on the platform it exists for.
      - name: Setup Node Toolchain
        if: ${{ !cancelled() && github.event.pull_request.draft != true && (steps.scope.outputs.figures == 'true' || steps.scope.outputs.interfig == 'true' || steps.scope.outputs.markdown == 'true') }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            tools/figures/package-lock.json
            tools/markdownlint/package-lock.json

      - name: Markdown Gate Self-Test
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.markdown == 'true' }}
        run: node tools/markdownlint/verify.mjs --self-test

      # `make docs-figures-check` and the managed `make docs-figures` are verify-all gates, so they
      # must run on every platform: these are the commands of both targets, run directly, and
      # `check` and `sources` are exactly what adopters run. esbuild and
      # TypeScript arrive as per-platform npm optional dependencies, so this leg proves the
      # locked --ignore-scripts install works, that a rebuild is byte-identical to the committed
      # SVG and JSON, that each platform's esbuild rebuilds the committed player in
      # tools/figures/player/ byte for byte from the lock within its budget (the player adopters
      # receive, ADR-0016 section 3), and that the Node figure checks and their tests pass, on
      # each OS (the hashed files and the player are pinned to LF by the managed attribute block
      # at the end of .gitattributes). The Chromium smoke test needs a built site and runs in
      # pages.yml on Linux only.
      - name: Figure Build Check
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.figures == 'true' }}
        shell: bash
        run: |
          npm ci --prefix tools/figures --ignore-scripts --no-audit --no-fund
          npm --prefix tools/figures test
          npm --prefix tools/figures run typecheck
          node tools/figures/build.mjs check
          node tools/figures/bundle.mjs --check
          node tools/figures/build.mjs sources

      # `make interfig-verify` is a verify-all gate too; these are its commands. The script's
      # suite and `verify` use pathlib and the standard library only, the vendored files are
      # `-text` in .gitattributes so their hashes hold on a Windows checkout, and node expands the
      # quoted test glob itself (docs/standards/hiss-21-platform-neutrality.md).
      - name: Interfig Verify Gate
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.interfig == 'true' }}
        shell: bash
        run: |
          "$PYTHON" -B scripts/test_sync_interfig.py
          "$PYTHON" -B scripts/sync_interfig.py verify
          node --test 'tools/figures/third_party/interfig/upstream/src/*.test.ts'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

  windows-shard:
    name: Platform Neutrality (Windows shard ${{ matrix.shard }})
    if: "!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]') && (github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') || vars.PRAETOR_FORK_PORTABILITY == 'enabled')"
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go Toolchain
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: portability-windows-shard-${{ matrix.shard }}
          go-version: ${{ steps.setup-go.outputs.go-version }}

      - name: Detect Changed Paths
        id: base
        uses: ./.github/actions/changed-paths

      - name: Setup Python Toolchain
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Select Platform Neutrality Scope
        id: scope
        if: ${{ !cancelled() && github.event.pull_request.draft != true }}
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.base_ref }}
        run: |
          "$PYTHON" -B .config/lefthook/scripts/ci_scope.py --event "$EVENT" --base "$BASE" --head HEAD \
            --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" --packages "$RUNNER_TEMP/portability-packages.txt"

      - name: Select Buildable Go Packages
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < "$RUNNER_TEMP/portability-packages.txt"
          go list -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' "${packages[@]}" > "$RUNNER_TEMP/buildable.txt"

      - name: Compile Every Package
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          buildable=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then buildable+=("$package"); fi
          done < "$RUNNER_TEMP/buildable.txt"
          if [ "${#buildable[@]}" -gt 0 ]; then
            go build "${buildable[@]}"
          else
            echo "Compile Every Package skipped: selected packages contain tests only"
          fi

      - name: Vet Every Package
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          buildable=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then buildable+=("$package"); fi
          done < "$RUNNER_TEMP/buildable.txt"
          if [ "${#buildable[@]}" -gt 0 ]; then
            go vet "${buildable[@]}"
          else
            echo "Vet Every Package skipped: selected packages contain tests only"
          fi

      - name: Download And Build Pinned Tools
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          go mod download -modfile=tools/go/go.mod
          go build -modfile=tools/go/go.mod -o "$RUNNER_TEMP/pinned-tools/" golang.org/x/vuln/cmd/govulncheck github.com/securego/gosec/v2/cmd/gosec github.com/zricethezav/gitleaks/v8

      - name: Test Every Package
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        shell: bash
        run: |
          adopt=$(go list ./internal/adopt)
          cli=$(go list ./cmd/standardsctl)
          cli_half='^Test(Aud|[B-D])'
          selected=()
          while IFS= read -r package; do selected+=("$package"); done < "$RUNNER_TEMP/portability-packages.txt"
          go list "${selected[@]}" > "$RUNNER_TEMP/selected-packages.txt"
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < <(grep -vxF -e "$adopt" -e "$cli" "$RUNNER_TEMP/selected-packages.txt" | LC_ALL=C sort | awk -v shard="$SHARD" 'NR % 2 == (shard % 2)')
          json="$RUNNER_TEMP/go-test-$RUNNER_OS.json"
          : > "$json"
          show() {
            "$PYTHON" -B -c 'import json, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try:
                  event = json.loads(line) if line.startswith("{") else {"Action": "output", "Output": line}
              except ValueError:
                  event = {"Action": "output", "Output": line}
              if event.get("Action") in ("output", "build-output"):
                  sys.stdout.write(event.get("Output", ""))' "$1"
            cat "$1" >> "$json"
          }
          status=0
          if [ "${#packages[@]}" -gt 0 ]; then
            go test -json -timeout 30m "${packages[@]}" > "$RUNNER_TEMP/run-1.json" 2>&1 || status=$?
            show "$RUNNER_TEMP/run-1.json"
          else
            echo "run-1 skipped: no selected packages outside adopt and CLI for shard $SHARD"
          fi
          if [ "$SHARD" = 1 ]; then
            if [ "$ADOPT" = true ]; then
              go test -json -timeout 30m "$adopt" > "$RUNNER_TEMP/run-2.json" 2>&1 || status=$?
              show "$RUNNER_TEMP/run-2.json"
            else
              echo "run-2 skipped: adopt is not selected"
            fi
            if [ "$CLI" = true ]; then
              go test -json -timeout 30m -run "$cli_half" "$cli" > "$RUNNER_TEMP/run-3.json" 2>&1 || status=$?
              show "$RUNNER_TEMP/run-3.json"
              go test -json -timeout 30m -skip "$cli_half" "$cli" > "$RUNNER_TEMP/run-4.json" 2>&1 || status=$?
              show "$RUNNER_TEMP/run-4.json"
            else
              echo "run-3/run-4 skipped: CLI is not selected"
            fi
          fi
          exit "$status"
        env:
          ADOPT: ${{ steps.scope.outputs.adopt }}
          CLI: ${{ steps.scope.outputs.cli }}
          PYTHON: ${{ steps.python.outputs.python-path }}
          SHARD: ${{ matrix.shard }}

      - name: Upload Per-Test Timing
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.go == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-json-Windows-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Test The Client Schema Oracle Module
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.schemacheck == 'true' && matrix.shard == 2 }}
        run: |
          go -C tools/schemacheck vet ./...
          go -C tools/schemacheck test -timeout 30m ./...

      - name: Install Pinned Git Hook Toolchain
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' && matrix.shard == 2 }}
        run: go install -C tools/lefthook github.com/evilmartians/lefthook/v2

      - name: Install Security Scanner
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' && matrix.shard == 2 }}
        shell: bash
        run: go install -modfile=tools/go/go.mod github.com/securego/gosec/v2/cmd/gosec

      - name: Install YAML Linter
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' && matrix.shard == 2 }}
        shell: bash
        run: >-
          "$PYTHON" -m pip install --disable-pip-version-check --require-hashes
          -r .config/hook-lint/requirements.txt
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Install Shell Linter
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' && matrix.shard == 2 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          base="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}"
          case "${RUNNER_OS}" in
            Windows)
              curl -fsSL --max-time 300 -o "${RUNNER_TEMP}/shellcheck.zip" "${base}/shellcheck-${SHELLCHECK_VERSION}.zip"
              if command -v 7z >/dev/null 2>&1; then
                7z x -y -bso0 -bsp0 -o"${RUNNER_TEMP}/shellcheck" "${RUNNER_TEMP}/shellcheck.zip"
              else
                unzip -q -o "${RUNNER_TEMP}/shellcheck.zip" -d "${RUNNER_TEMP}/shellcheck"
              fi
              ;;
            *)
              if [ "${RUNNER_OS}" = macOS ]; then platform=darwin; else platform=linux; fi
              machine="$(uname -m)"
              if [ "${machine}" = arm64 ]; then machine=aarch64; fi
              curl -fsSL --max-time 300 "${base}/shellcheck-${SHELLCHECK_VERSION}.${platform}.${machine}.tar.xz" \
                | tar -xJ -C "${RUNNER_TEMP}/shellcheck" --strip-components=1
              ;;
          esac
          echo "${RUNNER_TEMP}/shellcheck" >> "${GITHUB_PATH}"
          if [ "${RUNNER_OS}" = Windows ]; then
            "${RUNNER_TEMP}/shellcheck/shellcheck.exe" --version
          else
            "${RUNNER_TEMP}/shellcheck/shellcheck" --version
          fi

      - name: Build praetorctl
        if: ${{ !cancelled() && github.event.pull_request.draft != true && matrix.shard == 2 }}
        shell: bash
        run: go build -o "bin/praetorctl$(go env GOEXE)" ./cmd/standardsctl

      - name: Documentation References
        if: ${{ !cancelled() && github.event.pull_request.draft != true && matrix.shard == 2 }}
        shell: bash
        run: '"bin/praetorctl$(go env GOEXE)" docs references --path=.'

      - name: Assert Hook Toolchain
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' && matrix.shard == 2 }}
        shell: bash
        run: '"$PYTHON" -B .config/lefthook/scripts/toolchain.py --require "$REQUIRED"'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          REQUIRED: "python,make,git,go,gofmt,gosec,lefthook,sh,shellcheck,yamllint"

      - name: Harness Self-Tests
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.harness == 'true' && matrix.shard == 2 }}
        timeout-minutes: 40
        shell: bash
        run: |
          status=0
          "$PYTHON" -u -B scripts/test_portability_selftest.py || status=$?
          "$PYTHON" -u -B scripts/portability_selftest.py --min-executed "$MIN_EXECUTED" || status=$?
          exit "$status"
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          MIN_EXECUTED: '10'

      - name: Setup Node Toolchain
        if: ${{ !cancelled() && github.event.pull_request.draft != true && (steps.scope.outputs.figures == 'true' || steps.scope.outputs.interfig == 'true' || steps.scope.outputs.markdown == 'true') && matrix.shard == 2 }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            tools/figures/package-lock.json
            tools/markdownlint/package-lock.json

      - name: Markdown Gate Self-Test
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.markdown == 'true' && matrix.shard == 2 }}
        run: node tools/markdownlint/verify.mjs --self-test

      - name: Figure Build Check
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.figures == 'true' && matrix.shard == 2 }}
        shell: bash
        run: |
          npm ci --prefix tools/figures --ignore-scripts --no-audit --no-fund
          npm --prefix tools/figures test
          npm --prefix tools/figures run typecheck
          node tools/figures/build.mjs check
          node tools/figures/bundle.mjs --check
          node tools/figures/build.mjs sources

      - name: Interfig Verify Gate
        if: ${{ !cancelled() && github.event.pull_request.draft != true && steps.scope.outputs.interfig == 'true' && matrix.shard == 2 }}
        shell: bash
        run: |
          "$PYTHON" -B scripts/test_sync_interfig.py
          "$PYTHON" -B scripts/sync_interfig.py verify
          node --test 'tools/figures/third_party/interfig/upstream/src/*.test.ts'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

  # The aggregate carries the same Renovate skip and repository guard as windows-shard before
  # always(), so provenAggregateNeeds covers the shard matrix and provenDraftStepAggregate proves
  # draft handling through each shard's leading draft step. Shards are skipped only where the
  # aggregate's own guard is false, so failing on failure, cancelled or skipped is stricter and
  # never fires on a normal run.
  windows:
    name: Platform Neutrality (Windows)
    needs: windows-shard
    if: "!(startsWith(github.head_ref, 'renovate/') && github.event.pull_request.user.login == 'renovate[bot]') && (github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') || vars.PRAETOR_FORK_PORTABILITY == 'enabled') && always()"
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require Every Windows Portability Shard
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a Windows portability shard failed, was cancelled or was skipped"
          exit 1
