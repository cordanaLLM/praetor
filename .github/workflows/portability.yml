name: Platform Neutrality

# HISS-21. This repository's git hooks were unusable on Windows through four stacked
# defects (#84), and each one was hidden behind the one before it. The last of them was
# that the harness self-tests could not build there at all, so the gate could not be
# repaired from the platform it was broken on. Nothing was wrong with the fixes; what was
# missing was a runner that would have failed the day any of them landed.
#
# Enforcement is a matrix rather than a rule, because a rule only catches the defects
# somebody thought to enumerate. This catches the class.
#
# Structure is taken from VMAFx/vmafx's build matrix, which solved the same problem first
# across eighteen cells: fail-fast off so one platform's failure cannot mask another's,
# advisory legs marked rather than hidden, and legs that cannot run their tests saying so
# in the workflow instead of quietly omitting the step.

on:
  push:
    branches:
      - main
      - 'lts-*'
  pull_request:
    branches:
      - main
      - 'lts-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Outside the canonical repository the matrix is an operator's choice (#189): the macOS
  # and Windows legs are billed at a multiple on a private repository, and an operational
  # fork receives many commits per sync. It runs there only when the repository variable
  # PRAETOR_FORK_PORTABILITY is 'enabled'. HISS-21 forbids a silent skip, so the job below
  # states the reason on one Linux runner instead of leaving three legs quietly absent.
  skipped:
    name: Platform Neutrality skipped (set PRAETOR_FORK_PORTABILITY=enabled to run)
    if: "!(github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') || vars.PRAETOR_FORK_PORTABILITY == 'enabled')"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: State Why The Matrix Did Not Run
        shell: bash
        run: |
          reason="Platform Neutrality did not run: ${GITHUB_REPOSITORY} is not the canonical repository and the repository variable PRAETOR_FORK_PORTABILITY is not 'enabled'. No platform was verified by this run."
          echo "::notice title=Platform Neutrality skipped::${reason}"
          echo "${reason}" >> "${GITHUB_STEP_SUMMARY}"

  harness:
    name: Platform Neutrality (${{ matrix.name }})
    # The literal is the .standards.yaml identity; internal/forge/workflow_guard_test.go
    # holds the two equal. The names are required status contexts and stay unchanged.
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor') || vars.PRAETOR_FORK_PORTABILITY == 'enabled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing must never cancel the others. Which platforms are broken is
      # the entire output of this job; cancelling the rest discards it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: portability
          go-version: '1.27'

      - name: Setup Python Toolchain
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Build before test: a compile error on one OS is the cheapest portability defect to
      # find and the one most likely to be a build-constraint or path-separator mistake.
      - name: Compile Every Package
        run: go build ./...

      # Every step below runs even when an earlier one failed. #84 was four portability
      # defects stacked so that each was invisible until the one before it was fixed, which
      # cost four separate round trips to discover. A job that halts at the first red step
      # reproduces exactly that. `!cancelled()` does not alter the job's conclusion: a failed
      # step still fails the leg. It only means one run reports every layer instead of one.
      - name: Vet Every Package
        if: ${{ !cancelled() }}
        run: go vet ./...

      # Not -race here. The race detector needs a host C toolchain, and whether one exists
      # on each runner image is exactly the kind of thing this matrix is meant to discover
      # rather than assume. The Linux race legs already run in the main CI gate, so nothing
      # is lost by keeping this job about portability alone.
      - name: Test Every Package
        if: ${{ !cancelled() }}
        run: go test ./...

      # The self-tests drive the real hooks, so they need the pinned hook runner and the
      # binary the hooks invoke. Both are installed per platform rather than assumed present:
      # a suite that silently degrades because a tool is missing is the failure mode this whole
      # job exists to make visible, and it would be absurd to introduce it here.
      - name: Install Pinned Git Hook Toolchain
        if: ${{ !cancelled() }}
        run: go install github.com/evilmartians/lefthook/v2@v2.1.12

      # test_security_scope.py fails outright when gosec is absent rather than skipping, which
      # is the right call for a security regression -- so the tool is a real dependency of this
      # job, not an optional extra. The first run of this matrix failed here for exactly that
      # reason, which is the intended behaviour working.
      - name: Install Security Scanner
        if: ${{ !cancelled() }}
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # `make` is not on PATH on the Windows runner image (MSYS2 ships it but is unlisted),
      # so the Makefile target cannot be reused here. The executable extension comes from
      # `go env GOEXE` rather than a second copy of the Makefile's EXE_SUFFIX rule: the
      # toolchain already knows it, and a duplicate would be free to drift (HISS-19).
      # checks.py shells out to yamllint, which is pinned and installed nowhere: it happens to
      # be present on the ubuntu image and absent on macOS, so the hook failed closed there.
      # Installing it explicitly makes the dependency real on every leg rather than accidental
      # on one. The version is pinned as well: an unpinned linter turns an upstream release
      # into a red gate on an untouched tree, and a new rule firing on one leg but not another
      # is indistinguishable from a portability defect, which is the only thing this job can
      # report. 1.38.0 is the current release; it requires Python >= 3.10 and pathspec >= 1.0.0,
      # both satisfied by the 3.14 toolchain this job sets up.
      - name: Install YAML Linter
        if: ${{ !cancelled() }}
        shell: bash
        run: '"$PYTHON" -m pip install --disable-pip-version-check yamllint==1.38.0'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      # Same rationale as the YAML linter, one step later. checks.py builds an unconditional
      # `shellcheck` command for every staged or pushed *.sh, and common.run() fails closed on
      # a missing binary, so an absent linter is a hook failure rather than a skip. Every
      # fixture repository the suite builds copies .config/lefthook, which carries
      # pre-push/pushed-checks.sh -- so on the images without shellcheck every push the suite
      # drives was rejected (#135). It ships preinstalled on ubuntu-24.04 and on neither the
      # macOS nor the windows image.
      #
      # One step with a per-OS branch rather than one step per leg, and the same pinned
      # version everywhere including Linux: a rule set that differs per platform is not a
      # reproducible gate (HISS-19, HISS-20). The install directory goes first on PATH so the
      # pin wins over the preinstalled copy.
      - name: Install Shell Linter
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          base="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}"
          case "${RUNNER_OS}" in
            Windows)
              # The zip is flat, so no component is stripped. 7-Zip is what the windows image
              # lists; unzip is not on it, and is kept only for a host that has it instead.
              curl -fsSL -o "${RUNNER_TEMP}/shellcheck.zip" "${base}/shellcheck-${SHELLCHECK_VERSION}.zip"
              if command -v 7z >/dev/null 2>&1; then
                7z x -y -bso0 -bsp0 -o"${RUNNER_TEMP}/shellcheck" "${RUNNER_TEMP}/shellcheck.zip"
              else
                unzip -q -o "${RUNNER_TEMP}/shellcheck.zip" -d "${RUNNER_TEMP}/shellcheck"
              fi
              ;;
            *)
              # The release names the 64-bit ARM asset aarch64 on both platforms, while macOS
              # reports that machine as arm64. Taking uname -m verbatim requests an asset that
              # does not exist and the whole step fails on the one leg it was added for.
              if [ "${RUNNER_OS}" = macOS ]; then platform=darwin; else platform=linux; fi
              machine="$(uname -m)"
              if [ "${machine}" = arm64 ]; then machine=aarch64; fi
              # The tarball carries a shellcheck-<version>/ prefix, unlike the zip.
              curl -fsSL "${base}/shellcheck-${SHELLCHECK_VERSION}.${platform}.${machine}.tar.xz" \
                | tar -xJ -C "${RUNNER_TEMP}/shellcheck" --strip-components=1
              ;;
          esac
          echo "${RUNNER_TEMP}/shellcheck" >> "${GITHUB_PATH}"
          # GITHUB_PATH takes effect in the next step, so the pin is smoke-tested by path here.
          # A download that produced no runnable binary must fail on this step, not later as a
          # hook error that reads like a rule violation.
          if [ "${RUNNER_OS}" = Windows ]; then
            "${RUNNER_TEMP}/shellcheck/shellcheck.exe" --version
          else
            "${RUNNER_TEMP}/shellcheck/shellcheck" --version
          fi

      - name: Build praetorctl
        if: ${{ !cancelled() }}
        shell: bash
        run: go build -o "bin/praetorctl$(go env GOEXE)" ./cmd/standardsctl

      # The self-tests are the part that could not run on Windows at all before #102, and the
      # part that governs the hooks, so they are the highest-value cell in the matrix. The
      # driver refuses to report a pass that executed nothing and prints every skip with its
      # reason, so a platform losing coverage shows up as a number that moved.
      #
      # Python is invoked through the path the setup action reports rather than by name:
      # `python3` is not guaranteed to exist on a Windows runner, and assuming a platform's
      # binary naming is the exact defect this job exists to catch.
      - name: Harness Self-Tests
        if: ${{ !cancelled() }}
        shell: bash
        run: '"$PYTHON" -B scripts/portability_selftest.py --min-executed "$MIN_EXECUTED"'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          # Deliberately a collapse detector, not a coverage assertion. The honest floor per
          # platform is not yet measured on macOS or Windows -- this matrix is what measures
          # it. Raise it to each platform's real figure once the first green run reports one,
          # and never lower it to make a red run green.
          MIN_EXECUTED: '10'

      # The Markdown gate runner is a Go-embedded asset that adoption emits into every
      # docs:seo-portal repository's verify-all, so it is a generated template under this
      # invariant, yet the documentation workflows run it on Linux only. Its self-test performs
      # the real locked `npm ci` and replays the gate's fixtures. On Windows the runner cannot
      # start the npm batch shim without a shell and runs the npm-cli.js shipped beside node.exe
      # instead; this step is the leg that proves that path works on the platform it exists for.
      - name: Setup Node Toolchain
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/markdownlint/package-lock.json

      - name: Markdown Gate Self-Test
        if: ${{ !cancelled() }}
        run: node tools/markdownlint/verify.mjs --self-test
