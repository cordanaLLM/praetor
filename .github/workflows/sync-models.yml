name: Sync AI Model Catalog

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Read-only on purpose (#201). The job used to commit catalog drift straight to main,
# which is how a runner without a model daemon deleted every locally discovered model.
# main now requires a pull request, signed commits and passing checks with no bypass
# actor, so a bot push cannot land, and this repository does not let GITHUB_TOKEN open
# pull requests. The job therefore reports drift and a person lands the regenerated
# catalog through a reviewed pull request.
permissions:
  contents: read

jobs:
  sync-models:
    # Engine-only: skipped outside the canonical repository (#189). The literal is the
    # .standards.yaml identity; internal/forge/workflow_guard_test.go holds the two equal.
    name: Reconcile Frontier & Open Model Catalog (canonical repository only)
    if: github.repository == (vars.PRAETOR_CANONICAL_REPOSITORY || 'cordanaLLM/praetor')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Restore Go Module And Build Caches
        uses: ./.github/actions/go-cache
        with:
          job: sync-models
          go-version: '1.27'

      # The runner has no Ollama or vLLM daemon, so discovery is off. The sync merges
      # and exits non-zero, writing nothing, if any existing entry would be removed.
      - name: Sync AI Model Catalog
        run: go run ./cmd/standardsctl models sync --discover-local=false

      - name: Verify Model Routing & Headroom Integrity
        run: go test -v -race ./internal/router/...

      - name: Check for Catalog Drift
        run: |
          if ! git diff --exit-code -- .config/models/; then
            echo "::error file=.config/models/routing.yaml::The seed list changed but the tracked catalog was not regenerated. Run 'praetorctl models sync' and land the result in a pull request."
            exit 1
          fi
