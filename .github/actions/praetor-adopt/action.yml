name: "Praetor Fast Adoption & Dogfooding"
description: "Automatically adopt any repository into Praetor governance or execute dry-run dogfooding benchmarks."
author: "cordanaLLM"

inputs:
  path:
    description: "Path to repository to adopt or dogfood"
    required: false
    default: "."
  mode:
    description: "Execution mode: 'adopt' or 'dogfood'"
    required: false
    default: "adopt"
  dry-run:
    description: "Run in dry-run simulation mode without writing files"
    required: false
    default: "false"
  force:
    description: "Force overwrite existing configurations"
    required: false
    default: "false"
  record-baseline:
    description: "Record existing debt infractions into .standards-baseline.json"
    required: false
    default: "true"
  go-version:
    description: "Go version to install; mirrors the go directive in praetor's go.mod"
    required: false
    default: "1.27"

outputs:
  report:
    description: "Combined output of the adoption / dogfooding run, written by the run step"
    value: ${{ steps.run-praetor.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true

    # This step owns the question "which binary runs the command" and answers it once, as a step
    # output. The fallback build lands in the runner's own temporary directory rather than in /tmp:
    # on a self-hosted runner /tmp is shared between jobs, so a binary a previous job left behind
    # would be picked up here in place of the one this job resolved.
    - name: Build standardsctl
      id: build-standardsctl
      shell: bash
      run: |
        set -euo pipefail
        if go install github.com/cordanaLLM/praetor/cmd/standardsctl@latest; then
          echo "binary=standardsctl" >> "$GITHUB_OUTPUT"
        else
          fallback="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/standardsctl"
          go build -o "$fallback" ./cmd/standardsctl
          echo "binary=$fallback" >> "$GITHUB_OUTPUT"
        fi

    # Every value this step needs arrives through env. An expression written into a run body is
    # substituted into the script *text* before bash parses it, so an adopter's path or mode would
    # be executed rather than passed; through env it is data, and the array keeps it one argument
    # even when it carries ;, $(...) or a newline.
    - name: Execute Praetor Action
      id: run-praetor
      shell: bash
      env:
        PRAETOR_BIN: ${{ steps.build-standardsctl.outputs.binary }}
        PRAETOR_PATH: ${{ inputs.path }}
        PRAETOR_MODE: ${{ inputs.mode }}
        PRAETOR_DRY_RUN: ${{ inputs.dry-run }}
        PRAETOR_FORCE: ${{ inputs.force }}
        PRAETOR_RECORD_BASELINE: ${{ inputs.record-baseline }}
      run: |
        set -euo pipefail

        bin="${PRAETOR_BIN:-standardsctl}"
        if [ -z "$PRAETOR_PATH" ]; then
          echo "praetor-adopt: the 'path' input names the repository to work on and must not be empty" >&2
          exit 1
        fi

        if [ "$PRAETOR_MODE" = "dogfood" ]; then
          args=(dogfood "--path=$PRAETOR_PATH")
          if [ "$PRAETOR_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
        else
          args=(adopt "--path=$PRAETOR_PATH")
          if [ "$PRAETOR_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$PRAETOR_FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$PRAETOR_RECORD_BASELINE" = "true" ]; then
            args+=(--record-baseline)
          fi
        fi

        report="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/praetor-adopt-report.txt"
        : > "$report"

        # The run is allowed to fail: its output is the report, and the step reports the failure
        # through its own exit status after the output has been written.
        set +e
        "$bin" "${args[@]}" 2>&1 | tee -a "$report"
        status=${PIPESTATUS[0]}
        if [ "$status" -eq 0 ] && [ "$PRAETOR_MODE" != "dogfood" ]; then
          "$bin" compile-context --verify 2>&1 | tee -a "$report"
          status=${PIPESTATUS[0]}
        fi
        set -e

        # A multiline output needs a delimiter that cannot appear on a line of its own inside the
        # value (GitHub, "Workflow commands", multiline strings), so it is drawn at random.
        random="$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -d ' \n' || true)"
        if [ -z "$random" ]; then
          random="${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        fi
        delimiter="praetor-report-$random"
        body="$(cat "$report")"
        {
          printf 'report<<%s\n' "$delimiter"
          printf '%s\n' "$body"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"

        exit "$status"
