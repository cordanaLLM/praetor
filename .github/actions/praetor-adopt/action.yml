name: "Praetor Fast Adoption & Dogfooding"
description: "Automatically adopt any repository into Praetor governance or execute dry-run dogfooding benchmarks."
author: "cordanaLLM"

inputs:
  path:
    description: "Path to repository to adopt or dogfood"
    required: false
    default: "."
  mode:
    description: "Execution mode: 'adopt' or 'dogfood'"
    required: false
    default: "adopt"
  dry-run:
    description: "adopt: plan without writing files, and skip the compile-context verify that follows a real adopt. dogfood: no effect, since the action runs no target adoptions"
    required: false
    default: "false"
  force:
    description: "adopt: pass --force, the refresh docs/adoption.md describes under 'What a forced re-adoption changes': it rebuilds .standards.lock, rewrites the drifted files audit compares byte for byte, merges editor JSON, regenerates the AGENTS.md harness and resets a Paperclip platform that names another repository, and keeps every other file. --force needs a lock source, so the action passes the praetor checkout it builds standardsctl from as --lock-source-root. Loaded remotely, the action's own tree has no .git, so a forced run first checks out the action's repository at the action's ref with git under the runner's temporary directory and builds from that checkout"
    required: false
    default: "false"
  record-baseline:
    description: "adopt: pass --record-baseline. true records existing debt infractions into .standards-baseline.json when the repository has none; a baseline that already exists is kept byte for byte, rescanned, and the report states what praetorctl baseline --verify says about it, so a re-adoption never accepts new debt. When that verdict is a rejection the report ends with 'not ready yet: Debt Baseline' in place of the success line, the step still exits 0, and praetorctl audit is what fails on the debt. false skips the scan. Re-recording an existing baseline is not an input: run praetorctl adopt --rerecord-baseline or praetorctl baseline --record"
    required: false
    default: "true"
  go-version:
    description: "Go toolchain the step builds standardsctl with; the default mirrors the go directive in praetor's go.mod"
    required: false
    default: "1.27"
  cache:
    description: "Let actions/setup-go restore and save the Go module and build caches. Set false in a job a pull request or its comment starts, where the entry saved would be restored by later trusted runs, and in a job that keeps its own Go cache"
    required: false
    default: "true"

outputs:
  report:
    description: "Combined output of the adoption / dogfooding run, written by the run step. An adopt run that leaves a pillar pending (the Verification Gate, or a kept baseline the rescan rejects) exits 0 and closes this report with 'not ready yet: <pillars>' in place of the success line"
    value: ${{ steps.run-praetor.outputs.report }}
  binary:
    description: "Absolute path of the standardsctl the build step compiled, for a later step of the same job that has to run that same binary"
    value: ${{ steps.build-standardsctl.outputs.binary }}

runs:
  using: "composite"
  steps:
    # setup-go restores and saves the Go caches unless told not to (its cache input defaults to
    # true), and a save lands in the scope of the ref the run belongs to. A job an issue_comment
    # starts belongs to the default branch, whose entries every branch restores, so that caller
    # turns this off.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
        check-latest: true

    # This step owns the question "which binary runs the command" and answers it once, as a step
    # output holding an absolute path.
    #
    # The binary has to be the praetor the caller pinned. GITHUB_ACTION_PATH is this action's own
    # directory inside the repository GitHub checked out at the ref the caller wrote (GitHub,
    # "Variables": supported in composite actions), so when that repository is praetor the module
    # three directories above it is praetor at that same ref. Building from there is what makes
    # `praetor-adopt@<ref>` mean something.
    #
    # Any other layout fails, and there is no install to fall back on. With a local
    # `uses: ./.github/actions/praetor-adopt`, or a copy of this action kept in another repository,
    # the directory above is that repository and the ref GitHub resolved names one of *its*
    # commits: `go install praetor/...@<that ref>` would pick whatever praetor calls by that name,
    # a moving branch tip for `@main`, the newest v1.x.x tag for `@v1` and the proxy's newest
    # release for `@latest` (go/ref/mod, "Version queries"). None of these is a praetor the caller
    # pinned.
    #
    # The binary lands in the runner's own temporary directory rather than in /tmp: on a
    # self-hosted runner /tmp is shared between jobs, so a binary a previous job left behind would
    # be picked up here in place of the one this job resolved.
    #
    # A forced adoption also rebuilds .standards.lock from this source, and that rebuild inventories
    # the DevContainer bootstrap source with git ls-files, so it needs a git checkout. Loaded
    # remotely, the action is a tree the runner unpacked from an archive, with no .git. On a forced
    # adopt run in such a tree the step checks out the action's own repository at the action's own
    # ref with git into a fresh directory under the runner's temporary directory, and builds from
    # that checkout and passes it on as the lock source. actions/checkout cannot do this: it refuses
    # a path outside GITHUB_WORKSPACE. A tree that already is a git checkout (the action loaded
    # locally from one) stays as it is. github.action_repository and github.action_ref are empty in
    # a composite action's run body and work only through its env (GitHub, "Contexts reference",
    # github context; actions/runner#2473), so they arrive as env variables.
    - name: Build standardsctl
      id: build-standardsctl
      shell: bash
      env:
        PRAETOR_MODE: ${{ inputs.mode }}
        PRAETOR_FORCE: ${{ inputs.force }}
        PRAETOR_ACTION_REPOSITORY: ${{ github.action_repository }}
        PRAETOR_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        # Every branch below is about identifying praetor, so an unset GITHUB_ACTION_PATH has no
        # safe default: three directories above the runner's working directory is somebody else's
        # tree, and the guard would accept it as praetor whenever it happens to hold a go.mod.
        if [ -z "${GITHUB_ACTION_PATH:-}" ]; then
          echo "praetor-adopt: GITHUB_ACTION_PATH is unset; a composite action cannot locate its own checkout" >&2
          exit 1
        fi

        source_root="$GITHUB_ACTION_PATH/../../.."
        bin_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        binary="$bin_dir/standardsctl"
        # go build -o writes exactly the name it is given, so the .exe a Windows executable
        # carries has to be part of that name.
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          binary="$binary.exe"
        fi

        # require_praetor refuses a directory ($1, described by $2) that is not praetor, not merely
        # one that looks like a Go module with a cmd/standardsctl: with
        # `uses: ./.github/actions/praetor-adopt` the three levels up are the adopter's own
        # workspace, and building that runs a binary that is not praetor.
        require_praetor() {
          module=""
          if [ -f "$1/go.mod" ]; then
            module="$(sed -n 's/^module[[:space:]]\{1,\}\([^[:space:]]*\).*/\1/p' "$1/go.mod" | head -n 1 | tr -d '\r')"
          fi
          if [ "$module" != "github.com/cordanaLLM/praetor" ] || [ ! -d "$1/cmd/standardsctl" ]; then
            echo "praetor-adopt: $2 is not a praetor checkout with" \
              "cmd/standardsctl (module '${module:-none}'), so there is no praetor ref to build; reference it as" \
              "cordanaLLM/praetor/.github/actions/praetor-adopt@<tag or commit>" >&2
            exit 1
          fi
        }

        # fetch_source makes $1 a git checkout of the repository at URL $2 at ref $3: a tag, a
        # branch or a commit id, each fetched alone with no history. A transfer that stalls below
        # one byte a second for a minute is abandoned, and no credential prompt can hold it.
        fetch_source() {
          GIT_TERMINAL_PROMPT=0 git init --quiet "$1" &&
            GIT_TERMINAL_PROMPT=0 git -C "$1" -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 \
              fetch --quiet --depth=1 --no-tags "$2" "$3" &&
            git -C "$1" checkout --quiet --detach FETCH_HEAD
        }

        require_praetor "$source_root" "the repository this action was loaded from"

        if [ "${PRAETOR_MODE:-}" = "adopt" ] && [ "${PRAETOR_FORCE:-}" = "true" ] && [ ! -e "$source_root/.git" ]; then
          repository="${PRAETOR_ACTION_REPOSITORY:-}"
          ref="${PRAETOR_ACTION_REF:-}"
          # Both values come from GitHub, not the caller's inputs; the patterns still keep a
          # value from reaching git as an option or a refspec with a destination.
          if ! [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
            ! [[ "$ref" =~ ^[A-Za-z0-9_][A-Za-z0-9_./+@-]*$ ]]; then
            echo "praetor-adopt: a forced adoption rebuilds .standards.lock from a git checkout of praetor, the" \
              "action tree has no .git, and GitHub named no repository ('$repository') and ref ('$ref') to" \
              "check out" >&2
            exit 1
          fi
          checkout="$(mktemp -d "$bin_dir/praetor-source.XXXXXX")"
          url="${GITHUB_SERVER_URL:-https://github.com}/$repository"
          if ! fetch_source "$checkout" "$url" "$ref"; then
            echo "praetor-adopt: a forced adoption rebuilds .standards.lock from a git checkout of praetor," \
              "and checking out $url at $ref failed" >&2
            exit 1
          fi
          require_praetor "$checkout" "the checkout of $repository at $ref"
          echo "praetor-adopt: forced adoption; building and rebuilding the lock from $repository at $ref, checked out into $checkout"
          source_root="$checkout"
        fi

        go build -C "$source_root" -o "$binary" ./cmd/standardsctl
        echo "binary=$binary" >> "$GITHUB_OUTPUT"
        # The checkout the binary was built from is also the source bundle a forced adoption
        # rebuilds .standards.lock from: praetor at the ref the caller pinned.
        echo "source_root=$source_root" >> "$GITHUB_OUTPUT"

    # Every value this step needs arrives through env. An expression written into a run body is
    # substituted into the script *text* before bash parses it, so an adopter's path or mode would
    # be executed rather than passed; through env it is data, and the array keeps it one argument
    # even when it carries ;, $(...) or a newline.
    #
    # Each boolean is passed as --flag=<value> rather than appended when the value is "true":
    # dogfood's --dry-run and adopt's --record-baseline both default to true in standardsctl, so an
    # omitted flag is an opt-in, not an opt-out, and `record-baseline: "false"` used to record a
    # baseline anyway.
    #
    # A forced adoption rebuilds .standards.lock, and the rebuild needs a lock source
    # (adopt.ForceContract); without one every forced run stopped at the lock step. The source is
    # the checkout the build step compiled, so the lock pins the praetor the binary came from.
    - name: Execute Praetor Action
      id: run-praetor
      shell: bash
      env:
        PRAETOR_BIN: ${{ steps.build-standardsctl.outputs.binary }}
        PRAETOR_LOCK_SOURCE: ${{ steps.build-standardsctl.outputs.source_root }}
        PRAETOR_PATH: ${{ inputs.path }}
        PRAETOR_MODE: ${{ inputs.mode }}
        PRAETOR_DRY_RUN: ${{ inputs.dry-run }}
        PRAETOR_FORCE: ${{ inputs.force }}
        PRAETOR_RECORD_BASELINE: ${{ inputs.record-baseline }}
      run: |
        set -euo pipefail

        bin="${PRAETOR_BIN:-}"
        report="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/praetor-adopt-report.txt"
        : > "$report"

        # publish hands the report to every consumer and leaves with the status it was given, so
        # the report exists for a rejected input just as it does for a failed run.
        publish() {
          # A multiline output needs a delimiter that cannot appear on a line of its own inside
          # the value (GitHub, "Workflow commands", multiline strings), so it is drawn at random.
          random="$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -d ' \n' || true)"
          if [ -z "$random" ]; then
            random="${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          fi
          delimiter="praetor-report-$random"
          body="$(cat "$report")"
          {
            printf 'report<<%s\n' "$delimiter"
            printf '%s\n' "$body"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
          # Whether a composite action's declared output still reaches the caller once one of its
          # steps has failed is not documented either way, so the report also goes to the job
          # summary, which a failed run does not take with it.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$1"
        }

        reject() {
          printf 'praetor-adopt: %s\n' "$1" | tee -a "$report" >&2
          publish 1
        }

        require_boolean() {
          case "$2" in
            true | false) ;;
            *) reject "the '$1' input takes true or false, not '$2'" ;;
          esac
        }

        # An empty PRAETOR_BIN means the build step published no binary. Falling back to whatever
        # `standardsctl` PATH resolves to would run a praetor unrelated to the caller's ref, which
        # is the defect the build step exists to close, so the step refuses instead.
        if [ -z "$bin" ]; then
          reject "the build step published no standardsctl path; refusing to resolve one from PATH"
        fi
        if [ -z "$PRAETOR_PATH" ]; then
          reject "the 'path' input names the repository to work on and must not be empty"
        fi
        require_boolean dry-run "$PRAETOR_DRY_RUN"
        require_boolean force "$PRAETOR_FORCE"
        require_boolean record-baseline "$PRAETOR_RECORD_BASELINE"

        case "$PRAETOR_MODE" in
          dogfood)
            args=(dogfood "--path=$PRAETOR_PATH" "--dry-run=$PRAETOR_DRY_RUN")
            ;;
          adopt)
            args=(
              adopt "--path=$PRAETOR_PATH" "--dry-run=$PRAETOR_DRY_RUN"
              "--force=$PRAETOR_FORCE" "--record-baseline=$PRAETOR_RECORD_BASELINE"
            )
            if [ "$PRAETOR_FORCE" = "true" ]; then
              if [ -z "${PRAETOR_LOCK_SOURCE:-}" ]; then
                reject "--force needs a lock source, and the build step published no praetor checkout to pass as one"
              fi
              args+=("--lock-source-root=$PRAETOR_LOCK_SOURCE")
            fi
            ;;
          *)
            reject "the 'mode' input takes adopt or dogfood, not '$PRAETOR_MODE'"
            ;;
        esac

        # The run is allowed to fail: its output is the report, and the step reports the failure
        # through its own exit status after the output has been written.
        set +e
        "$bin" "${args[@]}" 2>&1 | tee -a "$report"
        status=${PIPESTATUS[0]}
        # compile-context resolves --source and --target-dir against the runner's working
        # directory, not against what adopt just wrote, so both have to name the same repository
        # the adopt run was given or the verify decides the step's exit status on another tree.
        # A dry run writes nothing, so there is nothing of its own to verify, and on a repository
        # not yet adopted there is no AGENTS.md to read: the verify runs after a real adopt only.
        if [ "$status" -eq 0 ] && [ "$PRAETOR_MODE" != "dogfood" ] && [ "$PRAETOR_DRY_RUN" != "true" ]; then
          "$bin" compile-context --verify "--source=$PRAETOR_PATH/AGENTS.md" \
            "--target-dir=$PRAETOR_PATH" 2>&1 | tee -a "$report"
          status=${PIPESTATUS[0]}
        fi
        set -e

        publish "$status"
