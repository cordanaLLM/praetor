{% extends "base.html" %}

{% block extrahead %}
  {#- base.html already writes <link rel="canonical"> from site_url. Static templates such
      as 404.html render with page = None, so every page.* read sits behind this guard. -#}
  {% if page %}
  <!-- Pre-wired Schema.org JSON-LD structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": {{ (page.title or config.site_name) | tojson }},
    "description": {{ ((page.meta and page.meta.description) or config.site_description) | tojson }},
    "url": {{ (page.canonical_url or config.site_url ~ '/' ~ page.url) | tojson }},
    "author": {
      "@type": "Organization",
      "name": "cordanaLLM",
      "url": "https://standards.cordana.ai"
    },
    "inLanguage": "en",
    "proficiencyLevel": "Expert"
  }
  </script>
  {% endif %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "name": "cordanaLLM/praetor",
    "programmingLanguage": "Go",
    "codeRepository": "https://github.com/cordanaLLM/praetor",
    "runtimePlatform": "Linux / POSIX",
    "license": "https://spdx.org/licenses/EUPL-1.2.html"
  }
  </script>
{% endblock %}
