site_name: "cordanaLLM/praetor"
site_url: "https://standards.cordana.ai"
site_description: "Enterprise Fleet Governance, Repository-as-Code & Universal AI Agent Engineering Engine"
site_author: "cordanaLLM"
repo_url: "https://github.com/cordanaLLM/praetor"
repo_name: "cordanaLLM/praetor"

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  # No sitemap plugin: MkDocs core already writes site/sitemap.xml and sitemap.xml.gz from
  # the nav, and the `mkdocs-sitemap-plugin` this block used to name does not exist on PyPI,
  # so `pip install -r requirements.txt` failed and the preset aborted with a config error.
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

# List only pages under docs/ in this preset: `mkdocs build --strict` fails on a nav entry
# whose file is absent. Add a page file and its nav entry together.
nav:
  - Overview: index.md
