site_name: "example-org/example-repo"
# Operator configuration, not a shipped value: the URL the built site is served from.
# Set DOCS_SITE_URL at build time (for example https://<owner>.github.io/<repo>/). Unset
# or empty, the build writes no canonical links, no JSON-LD URLs and an empty sitemap.xml,
# so Material's navigation.instant, which reads that sitemap, falls back to full page loads.
site_url: !ENV DOCS_SITE_URL
site_description: "Project documentation"
site_author: "example-org"
repo_url: "https://github.com/example-org/example-repo"
repo_name: "example-org/example-repo"

# overrides/main.html reads every identity value from this file: the TechArticle author is
# site_author (site_name when unset), and the site-wide SoftwareSourceCode block needs
# repo_url (or source_code.repository) plus source_code.programming_language. Set them to
# your project. Without programming_language no SoftwareSourceCode block is emitted, and
# 404.html, which has no page and so no TechArticle, then carries no JSON-LD at all.
extra:
  source_code:
    programming_language: "PlaceholderLang"
    license: "https://spdx.org/licenses/MIT.html"

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  # No sitemap plugin: MkDocs core already writes site/sitemap.xml and sitemap.xml.gz from
  # the nav, and the `mkdocs-sitemap-plugin` this block used to name does not exist on PyPI,
  # so `pip install -r requirements.txt` failed and the preset aborted with a config error.
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

# Figures: `praetorctl adopt` writes the figure engine to tools/figures/ with the docs:seo-portal
# facet. The hook turns each ```figure fence into the figure rendered from
# docs/assets/figures/<slug>.json and publishes the stylesheet and the player itself, so the site
# build needs Python and MkDocs only. docs/figures/ holds the TypeScript specs, which are not
# pages. tools/figures/README.md explains how to add a figure. The README's Quickstart puts the
# preset's Python lock, requirements.in and requirements.txt, into docs/ beside the pages; they
# are not published either.
hooks:
  - tools/figures/mkdocs_hook.py
exclude_docs: |
  /figures/
  /requirements.in
  /requirements.txt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

# List only pages under docs/ in this preset: `mkdocs build --strict` fails on a nav entry
# whose file is absent. Add a page file and its nav entry together.
nav:
  - Overview: index.md
