<svg role="img" aria-labelledby="figure-title figure-desc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="903.8" height="652" viewBox="0 0 903.8 652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="figure-title">Container Diagram</title>
<desc id="figure-desc">Runtime modules within the Praetor binary, daemon services, and configuration inputs.</desc>
