  - name: "Caveman"
    url: "https://github.com/JuliusBrussee/caveman"
    section: "adapted"
    kind: "adapted code"
    relation: "adapted"
    license: "MIT"
    notice: >-
      © 2026 Julius Brussee: the MIT terms of the upstream skill when this skill was adapted from it (2026-09-18),
      shipped byte for byte as `LICENSE` beside the skill from upstream commit 8dffbb260, the last licence text before
      the relicensing. Upstream commit 921eab8a8 relicensed the repository to Apache-2.0 on 2026-09-24, released as
      Caveman 3.0.0 on 2026-09-30; releases before 3.0.0 keep the terms they shipped with
    artifact: "`caveman` skill, `.agents/skills/caveman/SKILL.md`"
    use: >-
      The name and the rules (drop articles, filler and hedges; write fragments; keep code and error text verbatim;
      invent no abbreviations; keep negations; fall back to plain wording when compression makes a line ambiguous) are
      rewritten for agent-to-agent traffic only, and the skill adds connective symbols, the brief and return shapes
      and the evidence bound. No upstream text is copied.
    paths:
      - ".agents/skills/caveman/SKILL.md"
      - "docs/guides/text-register.md"
  - name: "Caveman"
    url: "https://github.com/JuliusBrussee/caveman"
    section: "adapted"
    kind: "adapted code"
    relation: "adapted"
    license: "MIT"
    notice: "© 2026 Julius Brussee, as above"
    artifact: "prose linter, `internal/caveman` (`praetorctl caveman check`)"
    use: >-
      The same rules checked mechanically: article density, filler and hedge words, sentence length, and the brief and
      return contracts. The Go code is praetor's own.
    paths:
      - "internal/caveman/check.go"
  - name: "i-have-adhd"
    url: "https://github.com/ayghri/i-have-adhd"
    section: "adapted"
    kind: "adapted code"
    relation: "adapted"
    license: "MIT"
    notice: >-
      © 2026 Ayoub Ghriss: the MIT text shipped byte for byte as `LICENSE` beside each skill, from upstream commit
      d1671755d, the last commit to change the licence text
    artifact: >-
      `adhd-format` skill, `.agents/skills/adhd-format/SKILL.md`; `social-text` skill,
      `.agents/skills/social-text/SKILL.md`, which inherits from it
    use: >-
      The purpose: shape output for a reader with ADHD by leading with the next action, numbering steps, chunking and
      suppressing tangents. The rules are rewritten in praetor's own words for technical reports (bottom line first,
      bolded anchors, alert callouts, small diagrams), and no upstream word sequence is reused. `social-text` inherits
      the credit through the principles it takes from `adhd-format`.
    paths:
      - ".agents/skills/adhd-format/SKILL.md"
      - ".agents/skills/social-text/SKILL.md"
    match:
      - "adhd"
  - name: "Documenting Architecture Decisions"
    url: "https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions"
    detail: "by Michael Nygard (2011), and [MADR](https://adr.github.io/madr/)"
    section: "adapted"
    kind: "inspiration"
    relation: "inspired"
    license: "CC0-1.0"
    notice: "waived by Cognitect; MADR is MIT OR CC0-1.0"
    artifact: "`adr-scaffold` skill, `.agents/skills/adr-scaffold/SKILL.md`, and the records in `docs/adr/`"
    use: >-
      The practice of one short, immutable record per decision and its shape: status, context, decision and
      consequences. Numbering, the lifecycle rules and the HISS framing are praetor's own.
    paths:
      - ".agents/skills/adr-scaffold/SKILL.md"
      - "docs/adr/README.md"
    match:
      - "decision record"
