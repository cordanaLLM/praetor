#
# The curated credits list: one entry per third-party project, tool, image, action,
# specification, integration, font or icon praetor takes something from, with the upstream URL,
# the kind, how much of it reaches praetor (relation), the license the upstream states and the
# repository paths that use it. docs/credits.md renders its tables from this file
# (RenderCreditsPage, internal/supplychain/credits_page.go), and CheckUpstreamCredits
# (internal/supplychain/upstream_credits.go) fails when an item the dependency inventory lists
# has no entry, when a named path no longer uses its item, when a persona or skill is neither
# derived (metadata.derived_from) nor listed under originals, and when a license written
# unknown has no unexpired credits exception in .standards.yaml. After an edit, regenerate the
# page: PRAETOR_UPDATE_GOLDEN=1 go test ./internal/supplychain -run TestCreditsPageIsRendered.
#
# Entry keys: name, url (https), detail (after the link), section (the page table: adapted,
# shipped, images, presets, actions, integrations, specifications, fonts, tooling,
# development), kind (dependency, tool, action, image, vendored file, adapted code,
# inspiration, specification, integration, font or icon), relation (shipped, vendored,
# adapted, inspired, used by CI, integrated), license (an SPDX expression, or unknown,
# proprietary or none), notice (after the license), artifact (adapted section only), use,
# paths, packages (the inventory items it answers, each <ecosystem>:<identifier>, the ecosystem
# one of go, npm, pypi, action, image, feature and download) and match (terms a path names it
# by; a path is checked for the packages and match terms, or for the name when there are
# neither). Licenses are as the upstream LICENSE file or registry entry states them, never a
# deprecated SPDX identifier (a GNU license names -only or -or-later).
