---
name: Security Scan

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:
  schedule:
    - cron: '0 4 * * *'

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v7
      - name: Setup Go
        if: github.event.pull_request.draft != true
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          # See ci.yml: setup-go's cache key carries no job name, so every job
          # in the repository would share one build cache entry.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        if: github.event.pull_request.draft != true
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # `vulncheck` names this job's build cache and must differ from every
      # other job's.
      - name: Restore Go build cache
        if: github.event.pull_request.draft != true
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-
      # yamllint enable rule:line-length

      - name: Install Tools
        if: github.event.pull_request.draft != true
        run: |
          d="$RUNNER_TEMP/scanners"
          mkdir -p "$d"
          cd "$d"
          go mod init scanners
          go get golang.org/x/vuln@v1.8.0 github.com/securego/gosec/v2@v2.29.0 golang.org/x/tools@v0.50.0
          go mod download all
          go install golang.org/x/vuln/cmd/govulncheck github.com/securego/gosec/v2/cmd/gosec
      - name: Run govulncheck
        if: github.event.pull_request.draft != true
        run: govulncheck ./...
      - name: Run gosec
        if: github.event.pull_request.draft != true
        run: gosec -conf .gosec.json ./...
