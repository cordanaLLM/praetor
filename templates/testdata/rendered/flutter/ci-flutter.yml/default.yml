---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check for pubspec.yaml
        if: github.event.pull_request.draft != true
        id: manifest
        run: |
          if [ -f pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Flutter steps skipped: no pubspec.yaml yet"
          fi

      - name: Setup Flutter
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        # yamllint disable-line rule:line-length
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: flutter pub get

      - name: Analyze
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: flutter analyze

      - name: Test
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: flutter test
