---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Cargo.toml
        if: github.event.pull_request.draft != true
        id: manifest
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust steps skipped: no Cargo.toml yet"
          fi

      - name: Install the stable toolchain
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Install cargo-semver-checks 0.51.0
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: cargo install cargo-semver-checks --version 0.51.0 --locked

      - name: Check formatting
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: Lint
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: cargo test --all-features

      - name: Check API compatibility against the base revision
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        env:
          BASELINE_REV: >-
            ${{ github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          case "$BASELINE_REV" in
            ""|0000000000000000000000000000000000000000)
              echo "::notice::No baseline revision; API compatibility skipped"
              exit 0
              ;;
          esac
          cargo semver-checks \
            --workspace \
            --baseline-rev "$BASELINE_REV"
