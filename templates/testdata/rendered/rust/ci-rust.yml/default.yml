---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4

      # rustup ships on the hosted runner image, so the toolchain needs no
      # third-party action.
      - name: Install the stable toolchain
        if: github.event.pull_request.draft != true
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        if: github.event.pull_request.draft != true
        run: cargo fmt --all -- --check

      - name: Lint
        if: github.event.pull_request.draft != true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: github.event.pull_request.draft != true
        run: cargo test --all-features
