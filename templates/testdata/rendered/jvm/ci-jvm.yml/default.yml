---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4
      - name: Setup Java
        if: github.event.pull_request.draft != true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # jvm-service matches Maven and Gradle builds alike, so the step runs
      # whichever the repository carries, preferring a checked-in wrapper over
      # the runner's own install.
      - name: Build and verify
        if: github.event.pull_request.draft != true
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B verify
          elif [ -f ./mvnw ]; then
            sh ./mvnw -B verify
          elif [ -f pom.xml ]; then
            mvn -B verify
          elif [ -x ./gradlew ]; then
            ./gradlew check
          elif [ -f ./gradlew ]; then
            sh ./gradlew check
          elif [ -f build.gradle ] || [ -f build.gradle.kts ] ||
            [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            if command -v gradle >/dev/null 2>&1; then
              gradle check
            else
              echo "Gradle build has no gradlew wrapper and the runner" \
                "no gradle; commit one: gradle wrapper" >&2
              exit 1
            fi
          else
            echo "no Maven or Gradle build found" >&2
            exit 1
          fi
