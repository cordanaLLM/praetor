---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: github.event.pull_request.draft != true
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # npm ci installs exactly what package-lock.json records and fails when
      # the two disagree.
      - name: Install dependencies
        if: github.event.pull_request.draft != true
        run: npm ci

      - name: Lint
        if: github.event.pull_request.draft != true
        run: npm run lint --if-present

      - name: Build
        if: github.event.pull_request.draft != true
        run: npm run build --if-present

      - name: Test
        if: github.event.pull_request.draft != true
        run: npm test
