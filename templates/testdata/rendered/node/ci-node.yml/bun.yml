---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4
      - name: Setup Bun
        if: github.event.pull_request.draft != true
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        if: github.event.pull_request.draft != true
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # --frozen-lockfile installs exactly what the Bun lockfile records and
      # fails when the two disagree.
      - name: Install dependencies
        if: github.event.pull_request.draft != true
        run: bun install --frozen-lockfile

      - name: Lint
        if: github.event.pull_request.draft != true
        run: bun run --if-present lint

      - name: Build
        if: github.event.pull_request.draft != true
        run: bun run --if-present build

      - name: Test
        if: github.event.pull_request.draft != true
        run: bun run test
