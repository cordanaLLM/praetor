---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for package.json
        if: github.event.pull_request.draft != true
        id: manifest
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Node steps skipped: no package.json yet"
          fi
      - name: Setup Node.js
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Corepack provisions the Yarn packageManager pins, or Yarn 1, which
      # hands over to the release a .yarnrc.yml yarnPath names; Node 25 and
      # later ship without Corepack.
      - name: Enable Yarn
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: |
          npm install --global corepack@latest
          corepack enable yarn

      # The locked install takes exactly what yarn.lock records and fails
      # when the two disagree.
      - name: Install dependencies
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: yarn install --immutable

      - name: Lint
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: yarn run lint

      - name: Test
        if: >-
          github.event.pull_request.draft != true &&
          steps.manifest.outputs.present == 'true'
        run: yarn run test
