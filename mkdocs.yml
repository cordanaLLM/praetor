site_name: Praetor
site_url: https://cordanallm.github.io/praetor/
site_description: Enterprise Fleet Governance, Repository-as-Code & Universal AI Agent Engineering Engine
site_author: Lusoris


# The preset's override template is the live site's too, so the JSON-LD it injects into
# every page head is one template rather than a copy that can drift from it. The template
# sits inside docs_dir, so exclude_docs keeps MkDocs from also publishing its Jinja source
# as a static page. `praetorctl seo audit site` checks the built result.
#
# docs/figures/ holds the TypeScript figure specs. tools/figures/build.mjs turns them into the
# committed SVG and JSON under docs/assets/figures/; the specs themselves are not published.
#
# docs/presets/mkdocs/docs/ is the adopter preset's own docs_dir: its mkdocs.yml builds it, with its
# own example figure, in a repository adopted with docs:seo-portal (CI docs-presets job). The
# preset's README stays in the navigation. The figure checks (tools/figures/checks.mjs) read this list, so the root
# checks skip the excluded pages exactly as MkDocs does.
exclude_docs: |
  presets/mkdocs/overrides/
  /figures/
  /presets/mkdocs/docs/

# Interactive figures (docs/adr/0015-interactive-figures-from-vendored-interfig.md,
# docs/adr/0016-figures-for-adopters.md). The hook turns each ```figure fence into a <picture> of
# the committed SVGs, publishes tools/figures/figures.css and the committed player files from
# tools/figures/dist/, and links the stylesheet and the loader itself, so no step bundles before
# `mkdocs build`. The loader mounts the player near the viewport from the props each SVG embeds.
# The figure checks (tools/figures/checks.mjs) read this hooks entry to decide that ```figure
# fences are enabled for this site. Figures are the only diagram kind here: no mermaid custom fence
# is declared, so the checks fail a Mermaid fence.
hooks:
  - tools/figures/mkdocs_hook.py

copyright: >-
  Figures drawn with
  <a href="https://github.com/vectorize-io/hindsight/tree/ccfe85b4851957ac2adf88b4a9ddf9668b2882f1/hindsight-interfig">interfig</a>,
  (c) 2025 Vectorize AI, Inc., MIT License.

theme:
  name: material
  custom_dir: docs/presets/mkdocs/overrides
  favicon: assets/praetor-favicon.png
  logo: assets/praetor-logo.png
  palette:
    - scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - header.autohide
    - content.code.copy
    - content.code.annotate

extra:
  # praetor:funding-announcement:start
  # praetor:funding-announcement:end
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CordanaLLM/praetor
      name: GitHub Repository
    # praetor:funding-social:start
    # praetor:funding-social:end

  # Read by docs/presets/mkdocs/overrides/main.html for the site-wide Schema.org
  # SoftwareSourceCode block. Set here rather than through repo_url, which would also add
  # Material's repository widget to the header.
  source_code:
    name: cordanaLLM/praetor
    repository: https://github.com/cordanaLLM/praetor
    programming_language: Go
    license: https://spdx.org/licenses/EUPL-1.2.html

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

