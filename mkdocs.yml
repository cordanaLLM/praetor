site_name: Praetor
site_url: https://cordanallm.github.io/praetor/
site_description: Enterprise Fleet Governance, Repository-as-Code & Universal AI Agent Engineering Engine
site_author: Lusoris


theme:
  name: material
  favicon: assets/praetor-favicon.svg
  logo: assets/praetor-mkdocs-logo.svg
  palette:
    - scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - header.autohide
    - content.code.copy
    - content.code.annotate

extra:
  announcement: >
    🎯 <strong>Polar.sh Feature Bounties:</strong> Earn rewards for solved issues or sponsor upcoming roadmap features!
    <a href="sponsoring/"><strong>Learn more &amp; view bounties &rarr;</strong></a>

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CordanaLLM/praetor
      name: GitHub Repository
    - icon: fontawesome/solid/bolt
      link: https://polar.sh/CordanaLLM
      name: Feature Bounties & Rewards on Polar.sh
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/CordanaLLM
      name: Sponsor on GitHub Sponsors
    - icon: fontawesome/solid/mug-hot
      link: https://ko-fi.com/cordana
      name: Support on Ko-fi
    - icon: fontawesome/solid/hand-holding-dollar
      link: https://opencollective.com/cordanallm
      name: Open Collective

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Governance & Standards:
      - HISS-16 Formal Specification: standards/hiss-16-spec.md
      - HISS Refinement Audit: research/hiss-rule-refinement.md
      - Model Routing & Capacity Arbiter: standards/model-routing-and-fanout.md
  - Architecture & Design:
      - C4 Architecture Models: architecture/c4-models.md
      - Shared Lifecycle Management: plans/lifecycle-management.md
      - Bidirectional Module Contracts: plans/bidirectional-contracts.md
      - Architectural Decisions (ADR):
          - Decision Lattice Index: adr/README.md
          - ADR-0001 Universal Context Transpiler: adr/0001-universal-context-transpiler.md
          - ADR-0002 Highest-Standard-Wins Lattice: adr/0002-highest-standard-wins-lattice.md
          - ADR-0003 Canonical Engine & Reverse-Dogfooding: adr/0003-canonical-engine-and-reverse-dogfooding-topology.md
          - ADR-0004 Prefetch & Gating Pipeline: adr/0004-prefetch-dogfood-gating-pipeline.md
          - ADR-0005 OCI Distroless Containers: adr/0005-cloudnative-oci-distroless-containers.md
          - ADR-0006 Hierarchical Runner Matrix: adr/0006-hierarchical-multi-tier-runner-matrix.md
          - ADR-0007 Universal Frameworks Hub: adr/0007-universal-frameworks-org-and-demand-deduplication.md
  - Guides & Adoption:
      - Developer Onboarding: guides/onboarding.md
      - Garbage Collection: guides/garbage-collection.md
      - Contributing Guide: guides/contributing.md
      - Archetype Authoring: guides/archetype-authoring.md
      - Fast Adoption Engine: adoption.md
      - Fleet Dogfooding: dogfooding.md
  - Funding & Community:
      - Sponsoring & Bounties: sponsoring.md
      - Monetization Strategy: monetization.md
