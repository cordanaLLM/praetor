# Lefthook Configuration for cordanaLLM/praetor (Go 1.27+ & HISS-16 Governance)
# Fast, parallel local Git hook runner
pre-commit:
  parallel: false
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    state-sync:
      run: go run ./cmd/standardsctl state sync . && git add .workingdir/
    govet:
      glob: "*.go"
      run: go vet ./...
    context-check:
      run: go run ./cmd/standardsctl compile-context --verify
    hiss-audit:
      run: go run ./cmd/standardsctl audit
    block-evasion:
      run: python3 .config/agent/hooks/block_evasion.py
    topology-audit:
      run: sh -c 'if [ -d "$$HOME/dev" ]; then go run ./cmd/standardsctl topology audit "$$HOME/dev"; fi'

post-commit:
  commands:
    dedupe-cadence:
      run: go run ./cmd/standardsctl dedupe cadence --threshold=20 --record .

pre-push:
  parallel: false
  commands:
    security:
      # gosec runs with ZERO exclusions; .gosec.json is the single source of truth.
      run: govulncheck ./... && gosec -conf .gosec.json ./...
    lint:
      # A golangci-lint binary installed with an older Go toolchain refuses this Go 1.27
      # tree, so the linter is always run from source at a pinned module path.
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run
    flavor-audit:
      run: go run ./cmd/standardsctl flavor audit .
    state-audit:
      run: go run ./cmd/standardsctl state audit .
    audit:
      run: go run ./cmd/standardsctl audit
    gate:
      run: go run ./cmd/standardsctl gate run --path=.
