# Lefthook Configuration for cordanaLLM/praetor (Go 1.27+ & HISS-16 Governance)
# Fast, parallel local Git hook runner
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    govet:
      glob: "*.go"
      run: go vet ./...
    context-check:
      run: go run ./cmd/standardsctl compile-context --verify
    hiss-audit:
      run: go run ./cmd/standardsctl audit
    block-evasion:
      run: python3 .config/agent/hooks/block_evasion.py

pre-push:
  parallel: false
  commands:
    audit:
      run: go run ./cmd/standardsctl audit
    gate:
      run: go run ./cmd/standardsctl gate run --path=.



