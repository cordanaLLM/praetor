# OSV-Scanner configuration (https://google.github.io/osv-scanner/configuration/) for the
# lockfiles in the repository root. OSV-Scanner applies a config only to the lockfiles in its
# own folder and never to child folders, so an exception sits next to the lockfile it covers:
# console/osv-scanner.toml for console/pnpm-lock.yaml. Every entry is a dated exception:
# ignoreUntil is the entry date plus the interval of its category, and an expired entry no
# longer suppresses the finding.
